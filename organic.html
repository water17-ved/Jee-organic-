<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Organic Chemistry — 457-Reaction Field Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
    window.MathJax = { tex: { inlineMath: [['\(', '\)']], displayMath: [['\[', '\]'], ['$$', '$$']] } };
    </script>
    <style>
        :root {
            --paper: #EEF1EA; --card: #FFFFFF; --ink: #1C2118; --ink-soft: #4B5240;
            --line: #DAD9C7; --teal: #1F6F5C; --teal-dark: #144A3D;
            --amber: #DD9A22; --hazard: #B1402A;
            --row-h: 50px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { background: var(--paper); color: var(--ink); font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; }
        .font-display { font-family: 'Fraunces', ui-serif, Georgia, serif; }
        .font-mono-eq { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
        .gradient-header { background: linear-gradient(135deg, #14180F 0%, #1F3B33 45%, #1F6F5C 100%); }

        .tag-prep { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .tag-rxn { background-color: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
        .tag-test { background-color: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
        .tag-rearrange { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; }
        .tag-reduction { background-color: #ffe4e6; color: #be123c; border: 1px solid #fecdd3; }
        .tag-oxidation { background-color: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
        .tag-condensation { background-color: #ccfbf1; color: #0f766e; border: 1px solid #99f6e4; }
        .tag-isom { background-color: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; }
        .tag-concept { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .tag-adv { background-color: #4338ca; color: #ffffff; border: 1px solid #312e81; font-weight: 800; }
        .chip { display:inline-block; padding:0.15rem 0.6rem; border-radius:9999px; font-size:0.7rem; font-weight:600; }

        .spine-PREP { background: #22c55e; } .spine-RXN { background: #0ea5e9; }
        .spine-TEST { background: #f59e0b; } .spine-REARRANGEMENT { background: #a855f7; }
        .spine-REDUCTION { background: #f43f5e; } .spine-OXIDATION { background: #f97316; }
        .spine-CONDENSATION { background: #14b8a6; } .spine-ISOM { background: #8b5cf6; }
        .spine-CONCEPT { background: #ef4444; }

        /* ================= VIRTUALIZED MASTER LIST =================
           Only the rows scrolled into view (plus a small buffer) are ever
           real DOM nodes — the other ~430+ reactions exist purely as JS
           data until they're scrolled to. A tall spacer gives the
           scrollbar correct proportions; an inner layer is translated to
           the right vertical offset and holds just the visible rows. */
        #listViewport { overflow-y: auto; position: relative; flex: 1; }
        #listSpacer { position: relative; width: 100%; }
        #listInner { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }

        .vrow { height: var(--row-h); display: flex; align-items: center; cursor: pointer; }
        .vrow-header {
            background: var(--paper); font-family: 'Fraunces', serif; font-weight: 600;
            color: var(--ink); padding: 0 1rem; gap: 0.6rem; border-bottom: 1px solid var(--line); cursor: default;
        }
        .vrow-reaction {
            padding: 0 0.85rem 0 0; gap: 0.6rem; border-bottom: 1px solid #F0EEE1;
            transition: background 0.1s;
        }
        .vrow-reaction:hover { background: #F5F3EA; }
        .vrow-reaction.selected { background: #E3F0EB; }
        .vrow-spine { width: 5px; align-self: stretch; flex-shrink: 0; }
        .vrow-name { font-weight: 600; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 0.7rem; }
        .vrow-chips { margin-left: auto; display: flex; gap: 0.3rem; flex-shrink: 0; padding-left: 0.5rem; }
        .adv-dot { width: 0.45rem; height: 0.45rem; border-radius: 999px; background: var(--hazard); flex-shrink: 0; margin-left: 0.6rem; }

        /* ================= SPLIT LAYOUT ================= */
        #splitShell { flex: 1; display: flex; min-height: 0; max-width: 1500px; margin: 0 auto; width: 100%; }
        #listPane { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--card); }
        #detailPane { flex: 1; overflow-y: auto; min-width: 0; }
        #detailInner { max-width: 760px; margin: 0 auto; padding: 1.75rem; }
        .detail-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--ink-soft); text-align: center; padding: 2rem; }

        @media (max-width: 860px) {
            #splitShell { flex-direction: column; }
            #listPane { width: 100%; height: 46vh; border-right: none; border-bottom: 1px solid var(--line); }
            #detailPane { flex: 1; }
        }

        .audio-btn { transition: background-color 0.2s, border-color 0.2s, color 0.2s, transform 0.15s; min-height: 32px; }
        .audio-btn:active { transform: scale(0.95); }
        .audio-btn.speaking i { animation: pulseDot 1s ease-in-out infinite; }
        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        #searchInput:focus { outline: 2px solid var(--teal); }
    </style>
</head>
<body>
    <header class="gradient-header text-white py-4 px-4 sm:px-8 shadow-lg">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 max-w-[1500px] mx-auto">
            <div>
                <h1 class="font-display text-xl sm:text-2xl font-semibold tracking-tight flex items-center gap-3">
                    <i class="fa-solid fa-flask-vial text-amber-300"></i> JEE Organic Chemistry Field Guide
                </h1>
                <p class="text-white/70 mt-0.5 text-xs sm:text-sm">
                    <span class="font-mono-eq text-amber-300">457</span> reactions, virtualized — only what's on screen is ever in the DOM.
                </p>
            </div>
        </div>
    </header>

    <div class="bg-white border-b border-[var(--line)] px-4 sm:px-8 py-2.5 shadow-sm">
        <div class="max-w-[1500px] mx-auto flex flex-col sm:flex-row gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search 457 reactions..."
                       class="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none text-sm">
            </div>
            <select id="tagFilter" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
                <option value="ALL">All classifications</option>
                <option value="PREP">Preparation</option>
                <option value="RXN">Reaction</option>
                <option value="TEST">Test</option>
                <option value="REARRANGEMENT">Rearrangement</option>
                <option value="REDUCTION">Reduction</option>
                <option value="OXIDATION">Oxidation</option>
                <option value="CONDENSATION">Condensation</option>
                <option value="ISOM">Isomerism</option>
                <option value="CONCEPT">Concept</option>
            </select>
            <select id="levelFilter" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-sm font-semibold text-indigo-700">
                <option value="ALL">Main & Advanced</option>
                <option value="ADV">Advanced only</option>
                <option value="MAIN">Main only</option>
            </select>
            <button type="button" id="resetBtn" onclick="resetFilters()" class="text-xs text-[var(--teal)] hover:underline font-semibold flex items-center gap-1 px-2 shrink-0">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </div>
        <div class="max-w-[1500px] mx-auto text-xs text-[var(--ink-soft)] mt-1.5 font-mono-eq" id="resultCountDisplay"></div>
    </div>

    <div id="splitShell">
        <div id="listPane">
            <div id="listViewport">
                <div id="listSpacer">
                    <div id="listInner"></div>
                </div>
            </div>
        </div>
        <div id="detailPane">
            <div id="detailInner">
                <div class="detail-placeholder">
                    <i class="fa-solid fa-flask-vial text-4xl mb-3 text-slate-300"></i>
                    <p class="font-semibold">Pick a reaction from the list</p>
                    <p class="text-sm mt-1">Its mechanism, mnemonic, and JEE notes will open here.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        // =================================================================
        // VIRTUALIZED MASTER LIST
        // -----------------------------------------------------------------
        // Instead of putting all 457 reactions in the DOM (paginated,
        // accordion, or otherwise) and hiding/showing them, only the rows
        // that are actually scrolled into view are ever created. Everything
        // else is just entries in a plain JS array. Scrolling through the
        // full list therefore costs the same whether there are 50 reactions
        // or 5,000 — the DOM never holds more than ~30 row elements.
        // =================================================================

        const ROW_H = 50;
        const BUFFER_ROWS = 8;

        let allItems = [];      // flat [{type:'header',...} | {type:'reaction', r}] for the current filter
        let selectedId = null;
        let reactionsById = {};
        let reactionsByChapter = {};

        function buildItemList(predicate) {
            const items = [];
            chaptersData.forEach((ch, idx) => {
                const list = (reactionsByChapter[ch.name] || []).filter(predicate);
                if (!list.length) return;
                items.push({ type: 'header', name: ch.name, icon: ch.icon, count: list.length });
                list.forEach(r => items.push({ type: 'reaction', r }));
            });
            return items;
        }

        function rowHTML(item) {
            if (item.type === 'header') {
                return `<div class="vrow vrow-header">
                    <i class="fa-solid ${item.icon} text-[var(--teal)] text-xs"></i>
                    <span>${item.name}</span>
                    <span class="ml-auto font-mono-eq text-[11px] text-[var(--ink-soft)] font-normal">${item.count}</span>
                </div>`;
            }
            const r = item.r;
            const spineTag = r.type[0] || 'RXN';
            const sel = r.id === selectedId ? ' selected' : '';
            return `<div class="vrow vrow-reaction${sel}" onclick="selectReaction(${r.id})">
                <span class="vrow-spine spine-${spineTag}"></span>
                ${r.isAdv ? '<span class="adv-dot" title="JEE Advanced"></span>' : ''}
                <span class="vrow-name">${r.name}</span>
                <span class="vrow-chips">${r.type.slice(0, 1).map(t => `<span class="chip ${tagClass(t)}">${t}</span>`).join('')}</span>
            </div>`;
        }

        const TAG_STYLE = {
            PREP: "tag-prep", RXN: "tag-rxn", TEST: "tag-test",
            REARRANGEMENT: "tag-rearrange", REDUCTION: "tag-reduction",
            OXIDATION: "tag-oxidation", CONDENSATION: "tag-condensation",
            ISOM: "tag-isom", CONCEPT: "tag-concept"
        };
        function tagClass(t) { return TAG_STYLE[t] || 'tag-rxn'; }

        let renderScheduled = false;
        function renderVirtualRows() {
            renderScheduled = false;
            const viewport = document.getElementById('listViewport');
            const spacer = document.getElementById('listSpacer');
            const inner = document.getElementById('listInner');

            const total = allItems.length;
            spacer.style.height = (total * ROW_H) + 'px';

            const scrollTop = viewport.scrollTop;
            const viewportH = viewport.clientHeight || 500;
            let start = Math.floor(scrollTop / ROW_H) - BUFFER_ROWS;
            let end = Math.ceil((scrollTop + viewportH) / ROW_H) + BUFFER_ROWS;
            start = Math.max(0, start);
            end = Math.min(total, end);

            inner.style.transform = `translateY(${start * ROW_H}px)`;
            inner.innerHTML = allItems.slice(start, end).map(rowHTML).join('');
        }

        function scheduleRender() {
            if (!renderScheduled) {
                renderScheduled = true;
                requestAnimationFrame(renderVirtualRows);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('listViewport').addEventListener('scroll', scheduleRender, { passive: true });
            window.addEventListener('resize', scheduleRender);
        });

        // ---- DETAIL PANE (only one reaction's content ever built at a time) ----
        function detailHTML(r) {
            const cleanName = r.name.replace(/'/g, "\\'");
            const cleanMnemonic = r.mnemonic.replace(/'/g, "\\'");
            const cleanStory = r.story.replace(/'/g, "\\'");
            const advBadge = r.isAdv
                ? `<span class="px-2 py-0.5 rounded text-[11px] tag-adv"><i class="fa-solid fa-star mr-0.5 text-amber-300"></i>JEE ADVANCED</span>`
                : `<span class="px-2 py-0.5 rounded text-[11px] bg-slate-100 text-slate-600 border border-slate-300 font-semibold">JEE MAIN</span>`;
            return `
                <h2 class="font-display text-xl font-semibold mb-2">${r.name}</h2>
                <div class="flex flex-wrap gap-1.5 mb-3">
                    ${advBadge}
                    <span class="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded font-medium border border-slate-200"><i class="fa-solid fa-folder text-slate-400 mr-1"></i>${r.group}</span>
                    <span class="bg-slate-50 text-slate-700 text-xs px-2 py-0.5 rounded font-medium border border-slate-200"><i class="fa-solid fa-bolt text-amber-600 mr-1"></i>${r.intermediateType}</span>
                    <span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded font-medium border border-indigo-200"><i class="fa-solid fa-gear mr-1"></i>${r.mechanism}</span>
                </div>
                <div class="bg-slate-900 text-amber-300 p-3 rounded-lg text-sm font-mono-eq mb-4 overflow-x-auto shadow-inner">$$ ${r.reaction} $$</div>
                <div class="bg-amber-50/60 border border-amber-200/60 rounded-lg p-3 mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <div class="text-xs font-bold text-amber-900 uppercase tracking-wider flex items-center gap-1"><i class="fa-solid fa-lightbulb text-amber-500"></i> Memory Trick</div>
                        <button type="button" id="audio-btn-${r.id}" onclick="speakStory(${r.id}, '${cleanName}', '${cleanMnemonic}', '${cleanStory}')" class="audio-btn text-[11px] font-bold text-amber-800 bg-amber-100 hover:bg-amber-200 px-2 py-1 rounded border border-amber-300 flex items-center gap-1"><i class="fa-solid fa-volume-high text-amber-600"></i> Read Aloud</button>
                    </div>
                    <p class="text-sm font-semibold text-amber-950 italic">"${r.mnemonic}"</p>
                    <p class="text-xs text-amber-900 mt-1">${r.story}</p>
                </div>
                <div class="space-y-1.5 text-xs text-slate-600 mb-3">
                    <div><span class="font-bold text-slate-800"><i class="fa-solid fa-microscope mr-1 text-blue-500"></i>Intermediate:</span> ${r.intermediate}</div>
                    <div><span class="font-bold text-slate-800"><i class="fa-solid fa-arrows-split-up-and-left mr-1 text-emerald-500"></i>Repeats / Overlaps In:</span> ${r.overlap}</div>
                </div>
                <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-lg text-xs text-blue-950"><span class="font-bold text-blue-900 block mb-0.5"><i class="fa-solid fa-triangle-exclamation text-blue-600 mr-1"></i> JEE Key Notes &amp; Traps:</span>${r.notes}</div>
            `;
        }

        function selectReaction(id) {
            selectedId = id;
            const r = reactionsById[id];
            if (!r) return;
            const detail = document.getElementById('detailInner');
            detail.innerHTML = detailHTML(r);
            if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                window.MathJax.typesetPromise([detail]).catch(() => {});
            }
            scheduleRender(); // refresh visible rows so the selected one highlights
            if (window.innerWidth <= 860) {
                document.getElementById('detailPane').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // ---- FILTERS ----
        function currentPredicate() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const tag = document.getElementById('tagFilter').value;
            const level = document.getElementById('levelFilter').value;
            return function (r) {
                const matchesSearch = !search ||
                    r.name.toLowerCase().includes(search) ||
                    r.mnemonic.toLowerCase().includes(search) ||
                    r.reaction.toLowerCase().includes(search) ||
                    r.notes.toLowerCase().includes(search);
                const matchesTag = tag === 'ALL' || r.type.includes(tag);
                let matchesLevel = true;
                if (level === 'ADV') matchesLevel = r.isAdv === true;
                if (level === 'MAIN') matchesLevel = r.isAdv === false;
                return matchesSearch && matchesTag && matchesLevel;
            };
        }

        function applyFilters() {
            allItems = buildItemList(currentPredicate());
            document.getElementById('listViewport').scrollTop = 0;
            const count = allItems.filter(i => i.type === 'reaction').length;
            document.getElementById('resultCountDisplay').textContent = `${count} of 457 reactions`;
            scheduleRender();
        }

        function debounce(fn, wait) {
            let t = null;
            return function (...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); };
        }
        const debouncedApplyFilters = debounce(applyFilters, 120);

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('tagFilter').value = 'ALL';
            document.getElementById('levelFilter').value = 'ALL';
            applyFilters();
        }

        const chaptersData = [
            { name: "Alkanes", icon: "fa-fire", count: 25 },
            { name: "Alkenes", icon: "fa-atom", count: 38 },
            { name: "Alkynes", icon: "fa-bolt", count: 36 },
            { name: "Haloalkanes & Haloarenes", icon: "fa-shield-halved", count: 43 },
            { name: "Alcohols, Phenols & Ethers", icon: "fa-wine-bottle", count: 73 },
            { name: "Aldehydes & Ketones", icon: "fa-cube", count: 73 },
            { name: "Carboxylic Acids & Derivatives", icon: "fa-dna", count: 37 },
            { name: "Amines & Biomolecules", icon: "fa-capsules", count: 46 },
            { name: "Carbohydrates, Amino Acids & Polymers", icon: "fa-seedling", count: 27 },
            { name: "Purification & Analysis", icon: "fa-vial", count: 17 },
            { name: "Isomerism", icon: "fa-shapes", count: 19 },
            { name: "General Organic Chemistry (GOC)", icon: "fa-diagram-project", count: 24 }
        ];

        // DYNAMIC BUILDER FOR 220 UNIQUE ORGANIC CHEMISTRY REACTIONS
        const reactionsData = [];

        function addR(name, group, isAdv, type, typeDesc, reaction, mnemonic, story, intermediate, intermediateType, mechanism, overlap, notes) {
            reactionsData.push({
                id: reactionsData.length + 1,
                name: name,
                group: group,
                isAdv: isAdv,
                type: type,
                typeDesc: typeDesc,
                reaction: reaction,
                mnemonic: mnemonic,
                story: story,
                intermediate: intermediate,
                intermediateType: intermediateType,
                mechanism: mechanism,
                overlap: overlap,
                notes: notes
            });
        }

        // ================= ALKANES (1 to 25) =================
        addR("Sabatier-Senderens Reduction", "Alkanes", false, ["PREP", "REDUCTION"], "Catalytic Hydrogenation of Unsaturated Hydrocarbons", "R-CH=CH-R + H_2 \\xrightarrow{Ni, 200-300^\\circ C} R-CH_2-CH_2-R", "Hot Sabbath Nickel flattens double bonds into alkanes.", "Alkene adsorbs on nickel metal surface where hydrogen adds across C=C in syn-manner.", "Metal Surface Heterogeneous Complex", "Concerted", "Syn-Catalytic Addition", "Alkenes & Alkynes", "Methane CANNOT be prepared by this method. Raney Nickel reacts at room temp.");
        addR("Reduction of Alkyl Halides by Nascent [H]", "Alkanes", false, ["PREP", "REDUCTION"], "Reduction of R-X with Metal-Acid Couples", "R-X + 2 [H] \\xrightarrow{Zn + HCl \\text{ or } Zn-Cu/EtOH} R-H + HX", "Zinc-Acid couple gives nascent Hydrogen to replace Halogen.", "Electron transfer from Zn metal to substrate followed by protonation converts R-X to alkane.", "Organozinc Intermediate / Carbanion", "Carbanion", "Metal-Mediated Reduction", "Haloalkanes Chapter", "Red P + HI at 150°C reduces all functional groups (R-OH, R-CHO, R-COOH) to corresponding alkanes!");
        addR("Wurtz Reaction", "Alkanes", false, ["PREP", "RXN"], "Sodium-Mediated Coupling of Alkyl Halides", "2 R-X + 2 Na \\xrightarrow{\\text{Dry Ether}} R-R + 2 NaX", "Two Na-ughty Twins Grab Halogens to Double Up.", "Sodium extracts halogens from two alkyl halides; alkyl radicals dimerize into symmetrical alkane.", "Free Radical / Organosodium Carbanion", "Free Radical", "Radical Coupling / SN2", "Haloalkanes Chapter", "Cannot prepare Methane. Wet ether gives alcohols! 3° alkyl halides undergo E2 elimination giving alkenes.");
        addR("Corey-House Synthesis", "Alkanes", true, ["PREP", "RXN"], "Coupling via Lithium Dialkylcopper (Gilman Reagent)", "R_2CuLi + R'-X \\rightarrow R-R' + RCu + LiX", "Corey builds a House with Gilman bricks to couple ANY two Alkyls.", "Gilman reagent (R₂CuLi) attacks primary alkyl halide cleanly via SN2 without elimination side reactions.", "Gilman Reagent (R₂CuLi)", "Concerted", "SN2 Nucleophilic Displacement", "Haloalkanes Chapter", "Best method for unsymmetrical alkanes! R'-X MUST be 1° or methyl halide; 2°/3° halides give E2 elimination.");
        addR("Frankland Reaction", "Alkanes", true, ["PREP", "RXN"], "Coupling of Alkyl Halides using Zinc Metal", "2 R-X + Zn \\xrightarrow{\\Delta} R-R + ZnX_2", "Frankenstein uses Zinc bolts to weld two Alkyl chains.", "Zinc metal forms organozinc species (R₂Zn) which couples with alkyl halides to yield symmetrical alkanes.", "Organozinc Species (R₂Zn)", "Concerted", "Organometallic Coupling", "Organometallic Chemistry", "R₂Zn is less reactive than Grignard or Organosodium reagents, preventing unwanted side reactions.");
        addR("Decarboxylation with Sodalime", "Alkanes", false, ["PREP", "RXN"], "Base-Mediated Removal of CO₂ from Carboxylate Salts", "R-COONa + NaOH \\xrightarrow{CaO, \\Delta} R-H + Na_2CO_3", "Soda-Lime burns CO₂ right out of the Acid.", "Heating sodium salt of carboxylic acid with Sodalime (NaOH + CaO 3:1) strips CO₂ as carbonate.", "Carbanion (R⁻)", "Carbanion", "Decarboxylation", "Carboxylic Acids Chapter", "Step-down reaction (product has 1 less carbon). Rate depends on carbanion stability: NO₂-CH₂-COOH > Ph-COOH > CH₃-COOH.");
        addR("Kolbe’s Electrolytic Method", "Alkanes", true, ["PREP", "RXN"], "Electrolytic Decarboxylation to Alkanes/Alkenes/Alkynes", "2 RCOONa + 2 H_2O \\xrightarrow{\\text{Electrolysis}} R-R + 2 CO_2 \\uparrow (Anode) + H_2 \\uparrow + 2 NaOH (Cathode)", "Electrifying carboxylate salt releases CO₂ at Anode and raises pH.", "Electrolysis oxidizes carboxylate anion at Anode to carboxyl radical, losing CO₂ to give alkyl radicals that dimerize.", "Free Radical (Anode)", "Free Radical", "Electrolytic Free Radical Decarboxylation", "Carboxylic Acids Chapter", "Cannot prepare Methane. Solution pH increases during reaction due to NaOH formation at Cathode.");
        addR("Clemmensen Reduction", "Alkanes", false, ["PREP", "REDUCTION"], "Acidic Reduction of Carbonyls to Alkanes", "R-CO-R' \\xrightarrow{Zn-Hg / \\text{Conc. } HCl} R-CH_2-R' + H_2O", "Clemmensen’s Zinc-Mercury Acid dissolves Carbonyl into Alkane.", "Zinc amalgam in concentrated HCl reduces aldehyde and ketone carbonyls into methylene (-CH₂-) groups.", "Zinc-Carbenoid Surface Complex", "Concerted", "Heterogeneous Metal Reduction", "Aldehydes & Ketones", "CANNOT be used if compound contains acid-sensitive groups (-OH, ethers, esters, -NH₂).");
        addR("Wolff-Kishner Reduction", "Alkanes", false, ["PREP", "REDUCTION"], "Basic Reduction of Carbonyls to Alkanes", "R-CO-R' \\xrightarrow{NH_2NH_2 / KOH, \\text{Glycol}, \\Delta} R-CH_2-R' + N_2 \\uparrow", "Wolf & Kishner shoot Hydrazine arrow; Nitrogen gas flies away.", "Hydrazine forms hydrazone with carbonyl, which upon heating in KOH/glycol loses N₂ gas to yield alkane.", "Hydrazone / Carbanion", "Carbanion", "Hydrazone Base Cleavage", "Aldehydes & Ketones", "Basic complement to Clemmensen; CANNOT be used for base-sensitive groups (haloalkanes, esters).");
        addR("Reduction with Red Phosphorus and HI", "Alkanes", true, ["PREP", "REDUCTION"], "Universal Reduction of Oxygen/Halogen Substrates", "R-OH + 2 HI \\xrightarrow{\\text{Red } P, 150^\\circ C} R-H + H_2O + I_2", "Red Phosphorus sweeps Iodine away to force total reduction to Alkane.", "HI reduces alcohols, carbonyls, and carboxylic acids to alkanes at 150°C; Red P removes I₂ to drive equilibrium.", "Radical / Carbocation", "Free Radical", "Universal Acidic Reduction", "Alcohols, Acids & Carbonyls", "Red P is added to consume I₂ gas formed, preventing reverse iodination of alkane.");
        addR("Hydrolysis of Metal Carbides", "Alkanes", false, ["PREP", "RXN"], "Synthesis of Methane from Methanide Carbides", "Al_4C_3 + 12 H_2O \\xrightarrow{\\Delta} 4 Al(OH)_3 + 3 CH_4 \\uparrow", "Aluminum and Beryllium Carbides hydrolyze into pure Methane gas.", "Methanide carbides containing isolated C⁴⁻ ions react with water to yield pure methane.", "Carbanion (C⁴⁻)", "Carbanion", "Protonation of Carbide Anion", "Inorganic Chemistry", "Al₄C₃ and Be₂C give Methane. CaC₂ gives Ethyne (Acetylene). Mg₂C₃ gives Propyne!");
        addR("Free Radical Chlorination of Alkanes", "Alkanes", true, ["RXN"], "Photochemical Radical Halogenation", "CH_4 + Cl_2 \\xrightarrow{h\\nu \\text{ or } \\Delta} CH_3Cl + HCl", "Light snaps Chlorine bond into Radicals that plunder Hydrogen.", "UV light initiates Cl• radicals that abstract hydrogen from alkane, propagating free radical substitution chain.", "Alkyl Free Radical", "Free Radical", "Free Radical Chain Substitution", "Haloalkanes Chapter", "Reactivity ratio for H abstraction during Chlorination: 3° (5.0) > 2° (3.8) > 1° (1.0). Excess Cl₂ gives polychlorinated mixture.");
        addR("Free Radical Bromination of Alkanes", "Alkanes", true, ["RXN"], "Regioselective Radical Halogenation", "R-H + Br_2 \\xrightarrow{h\\nu} R-Br + HBr", "Bromine Radical is Lazy but Selective for 3° Carbon.", "Br• abstraction step is endothermic, making Bromination highly selective according to Reactivity-Selectivity principle.", "Alkyl Free Radical", "Free Radical", "Free Radical Substitution", "Haloalkanes Chapter", "Reactivity ratio for Bromination: 3° (1600) : 2° (82) : 1° (1). Isobutane yields 99.4% 2-bromo-2-methylpropane!");
        addR("Free Radical Reversible Iodination", "Alkanes", true, ["RXN"], "Iodination with Oxidizing Agents", "CH_4 + I_2 \\xrightleftharpoons{HIO_3 \\text{ or } HNO_3} CH_3I + HI", "Iodine reaction reverses unless Oxidizer destroys HI byproduct.", "HI produced is a powerful reducing agent that reverses iodination; HIO₃ or HNO₃ oxidizes HI into I₂ to drive forward.", "Alkyl Radical", "Free Radical", "Reversible Radical Substitution", "Haloalkanes Chapter", "5 HI + HIO₃ → 3 I₂ + 3 H₂O. Reversibility overcome by removing HI with oxidizing agent.");
        addR("Vapour Phase Nitration of Alkanes", "Alkanes", true, ["RXN"], "High Temperature Radical Nitration", "R-H + HNO_3 \\xrightarrow{400-500^\\circ C} R-NO_2 + H_2O", "Hot Nitric Acid vapors cleave C-C bonds to make nitroalkane mixture.", "At 450°C, HO-NO₂ undergoes homolysis; HO• abstracts H and NO₂• couples. C-C bond cleavage yields lower nitroalkanes.", "Free Radical", "Free Radical", "Vapour Phase Radical Substitution", "Nitrogen Compounds", "Propane nitration at 450°C yields a mixture of 1-nitropropane (25%), 2-nitropropane (40%), nitroethane (10%), and nitromethane (25%).");
        addR("Sulphonation of Alkanes", "Alkanes", true, ["RXN"], "Sulphonation with Fuming H₂SO₄ / Oleum", "R-H + H_2S_2O_7 \\xrightarrow{\\Delta} R-SO_3H + H_2SO_4", "Oleum welds Sulfonic Acid onto 3° carbon of higher alkanes.", "Higher alkanes (6+ carbons) or branched lower alkanes react with oleum at high temperature to form alkane sulfonic acids.", "Free Radical", "Free Radical", "Radical Substitution", "Detergents Chemistry", "Reactivity order: 3° H > 2° H > 1° H. Lower unbranched alkanes fail except in vapor phase with SO₃.");
        addR("Reed Reaction (Chlorosulphonation)", "Alkanes", true, ["RXN"], "Synthesis of Alkane Sulfonyl Chlorides", "R-H + SO_2 + Cl_2 \\xrightarrow{h\\nu} R-SO_2Cl + HCl", "Reed light couples SO₂ and Cl₂ onto Alkane chain.", "UV light decomposes Cl₂ to initiation radicals; SO₂ and Cl₂ add across alkane chain to yield sulfonyl chlorides used for synthetic detergents.", "Alkyl & Sulfonyl Radicals", "Free Radical", "Radical Chlorosulphonation", "Detergents / Surfactants", "Hydrolysis of R-SO₂Cl gives R-SO₃H; sodium salt (R-SO₃Na) is widely used as synthetic detergent.");
        addR("Isomerization of Alkanes", "Alkanes", true, ["RXN", "REARRANGEMENT"], "Conversion of Straight Chains to Branched Alkanes", "\\text{n-Alkane} \\xrightarrow{\\text{Anhyd. } AlCl_3 / HCl, 200^\\circ C} \\text{Branched Alkane}", "Lewis acid AlCl₃ bends straight alkane chains into octane-boosting branches.", "AlCl₃/HCl abstracts hydride to generate carbocation, which undergoes 1,2-alkyl shift to yield more stable branched isomers.", "Carbocation", "Carbocation", "1,2-Carbocation Shift Isomerization", "Petroleum Industry", "Crucial industrial process to increase Octane Number of gasoline/petrol fuel.");
        addR("Pyrolysis or Thermal Cracking", "Alkanes", false, ["RXN"], "Thermal Decomposition into Lower Hydrocarbons", "C_n H_{2n+2} \\xrightarrow{500-700^\\circ C, \\text{No Air}} \\text{Alkanes} + \\text{Alkenes} + H_2 \\uparrow", "Extreme heat cracks long alkanes into gas fuels and alkenes.", "Heating alkanes above 500°C in absence of air breaks strong C-C and C-H bonds homolytically, forming free radical mixtures.", "Free Radical", "Free Radical", "Thermal Radical Cleavage", "Petroleum Chemistry", "Used for manufacturing petrol gas, oil gas, and alkenes. Propane cracking gives Ethene + Methane + Propene + H₂.");
        addR("Catalytic Reforming / Aromatization (Hydroforming)", "Alkanes", true, ["RXN"], "Cyclization & Dehydrogenation to Aromatic Hydrocarbons", "\\text{n-Hexane} \\xrightarrow{Cr_2O_3 / Al_2O_3, 500^\\circ C, 10-20\\text{ atm}} \\text{Benzene} + 4 H_2 \\uparrow", "Chromia-Alumina catalyst folds 6+ carbon chains into Aromatic Benzene rings.", "Alkanes with 6 to 10 carbons undergo cyclization followed by dehydrogenation over Cr₂O₃/Al₂O₃ at 500°C to form aromatic rings.", "Cyclic Surface Intermediate", "Concerted", "Dehydrocyclization Aromatization", "Aromatic Chemistry", "n-Hexane yields Benzene; n-Heptane yields Toluene; n-Octane yields o-Xylene!");
        addR("Chlorinolysis of Alkanes", "Alkanes", true, ["RXN"], "Exhaustive Chlorination & C-C Bond Scission", "C_3H_8 + 8 Cl_2 \\xrightarrow{300-400^\\circ C, \\text{Press.}} C_2Cl_6 + CCl_4 + 8 HCl", "Extreme Chlorination cleaves Carbon backbone into Perchlorocarbons.", "Excess chlorine under high temperature and pressure breaks C-C bonds of alkanes, converting all carbons into perchlorocarbons.", "Perchloro Radicals", "Free Radical", "Radical Exhaustive Chlorinolysis", "Industrial Chlorocarbons", "Converts propane directly to Hexachloroethane (C₂Cl₆) and Carbon Tetrachloride (CCl₄).");
        addR("Controlled Catalytic Oxidation to Alcohols/Aldehydes", "Alkanes", false, ["OXIDATION"], "Partial Catalytic Air Oxidation", "2 CH_4 + O_2 \\xrightarrow{\\text{Red hot Cu tube, High P/T}} 2 CH_3OH", "Copper tube cooks Methane into Methanol; Molybdenum catalyst gives Formaldehyde.", "Controlled oxidation of methane over Cu tube gives Methanol; over Mo₂O₃ catalyst at 230°C gives Formaldehyde (HCHO).", "Surface Oxo Complex", "Concerted", "Controlled Surface Oxidation", "Industrial Organic", "Manganese acetate (CH₃COO)₂Mn oxidizes long-chain alkanes directly to fatty acids!");
        addR("KMnO₄ Oxidation of 3° Alkanes", "Alkanes", true, ["OXIDATION"], "Selective Oxidation of 3° C-H to 3° Alcohol", "(CH_3)_3C-H + [O] \\xrightarrow{KMnO_4 / H^+} (CH_3)_3C-OH", "Permanganate selectively oxidizes tertiary C-H proton into 3° Alcohol.", "Ordinary alkanes resist KMnO₄ oxidation, but 3° C-H bonds are sufficiently labile to be oxidized directly to 3° alcohols.", "Manganese-Ester Transition State", "Concerted", "Selective C-H Oxidation", "Alcohols Chapter", "Specific exception: 1° and 2° alkanes do NOT react with KMnO₄ under ordinary conditions.");
        addR("Grignard Reaction with Active Hydrogen", "Alkanes", false, ["PREP", "RXN"], "Protonation of Organometallic Reagents to Alkanes", "R-MgX + H-OH \\rightarrow R-H + Mg(OH)X", "Grignard Carbanion steals Active Hydrogen from Water/Alcohol to form Alkane.", "Strongly basic alkyl group in Grignard reagent abstracts acidic proton from H₂O, ROH, RNH₂, or PhOH to generate alkane.", "Grignard Carbanion (R⁻)", "Carbanion", "Acid-Base Proton Transfer", "Zerewitinoff Method", "Zerewitinoff Method uses CH₃MgI to quantitatively estimate active H-atoms by measuring CH₄ gas evolved!");
        addR("Wurtz Disproportionation Side Reaction", "Alkanes", true, ["RXN"], "Radical Disproportionation in Wurtz Coupling", "2 C_2H_5^\\bullet \\rightarrow C_2H_6 (Ethane) + CH_2=CH_2 (Ethene)", "Radical Twins trade a Hydrogen: One becomes Alkane, One becomes Alkene.", "During Wurtz reaction, one ethyl radical abstracts hydrogen from another, yielding an alkane and an alkene as side products.", "Ethyl Free Radical", "Free Radical", "Radical Hydrogen Abstraction Disproportionation", "Radical Chemistry", "Explains the presence of ethene and ethane side products during n-butane synthesis via Wurtz reaction.");

        // ================= ALKYNES (26 to 61) =================

        const alkynesList = [
            ["Dehydrohalogenation of gem-Dihalides (NaNH₂)", "R-CX_2-CH_3 \\xrightarrow{2\\ NaNH_2} R-C\\equiv CH", "Sodamide is the strong base that finishes what alc. KOH can't — full elimination to the triple bond.", "Alc. KOH only removes 1 HX (vinyl halide is resonance-stabilized); NaNH₂ (stronger base, pKa of NH₃ ~38) removes the 2nd HX. Anti-elimination.", "Carbanion"],
            ["Dehydrohalogenation of gem-Dihalides (Alc. KOH → 2-Alkyne)", "R-CH_2-CX_2-CH_3 \\xrightarrow{\\text{Alc. }KOH} R-C\\equiv C-CH_3", "Weaker base (KOH) stalls at the internal alkyne; only NaNH₂ pushes all the way to the terminal one.", "Non-terminal gem-dihalide: Alc. KOH gives mainly the 2-alkyne, while NaNH₂ on the same substrate gives the 1-alkyne (terminal) as major product.", "Carbanion"],
            ["Dehydrohalogenation of Vicinal Dihalides", "R-CHX-CHX-R' \\xrightarrow{2\\ NaNH_2 \\text{ or Alc. }KOH} R-C\\equiv C-R'", "Two neighboring halogens are peeled off one after another to zip the triple bond shut.", "Proceeds via a vinyl halide intermediate; can also give 1,2- and 1,3-alkadienes as minor products alongside the major alkyne.", "Carbanion"],
            ["Dehalogenation of Tetrahaloalkanes (Zn dust)", "R-CX_2-CX_2-R' \\xrightarrow{2\\ Zn} R-C\\equiv C-R' + 2\\ ZnX_2", "Zinc strips all four halogens off a 1,1,2,2-tetrahalide in one shot, snapping the triple bond into place.", "Formed by heating the tetrahalide with Zn dust; a clean way to alkynes from vicinal-dihalide-derived tetrahalides.", "Concerted"],
            ["Kolbe's Electrolysis (Fumarate/Maleate)", "KOOC-CH=CH-COOK \\xrightarrow{\\text{Electrolysis}} HC\\equiv CH + 2\\ CO_2 + 2\\ KOH", "Electrolyzing the potassium salt of a dicarboxylic unsaturated acid strips off two CO₂'s and leaves acetylene.", "Anode releases alkyl radical + CO₂ (loses 2 CO₂ total via oxy-radical fragmentation); cathode produces KOH + H₂, so pH of solution rises with time.", "Free Radical"],
            ["Grignard Alkylation to Higher Alkynes", "R-C\\equiv CH \\xrightarrow{CH_3MgBr} R-C\\equiv C-MgBr \\xrightarrow{R'I} R-C\\equiv C-R'", "The acidic acetylenic hydrogen is swapped for MgBr, then alkylated with R'-I to build a longer alkyne.", "Terminal alkyne's acidic H reacts with Grignard reagent releasing alkane (CH₄); the resulting acetylenic Grignard then attacks R'X.", "Carbanion"],
            ["Laboratory Preparation of Acetylene (CaC₂ + H₂O)", "CaC_2 + 2\\ H_2O \\rightarrow HC\\equiv CH + Ca(OH)_2", "Calcium carbide plus water bubbles up acetylene straight away — the classic lab method.", "Ca²⁺C₂²⁻ carbide anion is protonated twice by water to give acetylene directly; standard laboratory-scale synthesis.", "Concerted"],
            ["Manufacture of Acetylene from Methane (Electric Arc)", "2\\ CH_4 \\xrightarrow{\\text{Electric arc, }1500^\\circ C} HC\\equiv CH + 3\\ H_2", "Zapping methane at extreme heat rips off hydrogens and fuses two carbons into acetylene.", "Industrial-scale route; methane or natural gas is passed through an electric arc at 1500°C.", "Free Radical"],
            ["Berthelot's Synthesis of Acetylene", "2\\ C + H_2 \\xrightarrow{\\text{Electric arc, }1200^\\circ C} HC\\equiv CH", "Striking an arc between carbon electrodes in hydrogen gas fuses carbon atoms directly into acetylene.", "Direct combination of elemental carbon with hydrogen via electric arc between carbon electrodes.", "Concerted"],
            ["Acetylene from Haloform (CHI₃ + Ag)", "2\\ CHI_3 + 6\\ Ag \\xrightarrow{\\Delta} HC\\equiv CH + 6\\ AgI", "Heating iodoform with silver powder couples two CHI₃ units into pure acetylene.", "Silver abstracts iodine (forms AgI); the resulting carbene-like fragments couple to give pure acetylene.", "Carbene"],
            ["Partial Oxidation of Methane to Acetylene", "4\\ CH_4 + 3\\ O_2 \\xrightarrow{1500^\\circ C} 2\\ HC\\equiv CH + 6\\ H_2O", "Controlled, limited burning of methane at very high temperature yields acetylene instead of CO₂.", "Modern industrial method — controlled partial combustion of methane at high temperature to manufacture acetylene.", "Free Radical"],
            ["Catalytic Hydrogenation of Alkynes (Ni/Pt/Pd)", "R-C\\equiv C-R' + 2\\ H_2 \\xrightarrow{Ni, Pt \\text{ or } Pd} R-CH_2-CH_2-R'", "Unpoisoned metal catalysts don't stop halfway — they hydrogenate straight through to the full alkane.", "Full reduction over Ni/Pt/Pd proceeds via the alkene intermediate, ending at the saturated alkane; heat of hydrogenation released.", "Concerted"],
            ["Lindlar's Catalyst Reduction (cis-Alkene)", "R-C\\equiv C-R' + H_2 \\xrightarrow{Pd/CaCO_3, \\text{ quinoline}} \\underset{\\text{cis}}{R-CH=CH-R'}", "Poisoned palladium (Lindlar's catalyst) lets only ONE syn addition of H₂ through, locking in the cis-alkene.", "Syn (same-face) addition on the poisoned metal surface; quinoline is the 'catalyst poison' that halts reduction at the alkene stage. Stereospecific.", "Concerted"],
            ["Birch Reduction of Alkynes (trans-Alkene)", "R-C\\equiv C-R' \\xrightarrow{Na / \\text{Liq. }NH_3} \\underset{\\text{trans}}{R-CH=CH-R'}", "Dissolving sodium in liquid ammonia hands over electrons one at a time, forcing anti-addition to the trans-alkene.", "Radical-anion mechanism via vinyl radical intermediate; gives anti (trans) addition, unlike Lindlar's syn addition. Fails for terminal alkynes (they form the sodium salt instead).", "Free Radical"],
            ["Electrophilic Addition of Halogens (Cl₂/Br₂, dark, FeCl₃)", "R-C\\equiv CH + 2\\ Cl_2 \\xrightarrow{FeCl_3, \\text{dark}} R-CCl_2-CHCl_2", "Chlorine adds twice over, in the dark with a Lewis-acid nudge, to fully saturate the triple bond with 4 halogens.", "Reactivity Cl₂ > Br₂ > I₂; proceeds via a chloronium-like cyclic cation. Acetylene tetrachloride ('Westron') can be dehydrohalogenated by Ca(OH)₂ to 'Westrosol' (trichloroethylene), both cloth-industry solvents.", "Carbocation"],
            ["Addition of Bromine / Iodine to Alkynes", "HC\\equiv CH + Br_2 \\xrightarrow{H_2O} BrCH=CHBr \\ \\ ; \\ \\ HC\\equiv CH + I_2 \\xrightarrow{NH_3} I-C\\equiv C-I", "Bromine water just adds across the bond, but iodine with ammonia around prefers to substitute instead of add.", "With dilute Br₂/water: simple electrophilic addition. With I₂/NH₃: a substitution reaction instead, giving di-iodoacetylene + NH₄I — reactivity order Cl₂ > Br₂ > I₂.", "Carbocation"],
            ["Markovnikov Addition of HX to Alkynes", "R-C\\equiv CH + 2\\ HX \\rightarrow R-CX_2-CH_3", "Two molecules of HX pile onto the same terminal carbon, giving the gem-dihalide as major product.", "Both additions follow Markovnikov's rule via the more stable carbocation; reactivity order HI > HBr > HCl > HF. Second HX addition is directed by +M of the first halogen.", "Carbocation"],
            ["Addition of Hypohalous Acid (HOX)", "R-C\\equiv CH + HOCl \\rightarrow R-CO-CHCl_2", "Hypochlorous acid adds Markovnikov-style to give an unstable gem-diol that collapses straight into a haloketone.", "Reactivity order HOCl > HOBr > HOI; the intermediate gem-halohydrin (unstable enol/diol) loses water to give an α,α-dihaloketone.", "Carbocation"],
            ["Hydroboration-Oxidation of Alkynes", "3\\ R-C\\equiv C-R' \\xrightarrow{1.\\ BH_3/THF\\ \\ 2.\\ H_2O_2, OH^-} R-CH_2-CO-R'", "Boron adds anti-Markovnikov via THF-stabilized borane, and oxidative workup converts the resulting enol straight to the ketone.", "BH₃ needs THF as a solvent since it's unstable as a monomer; overall gives the less-substituted enol which tautomerizes to the ketone (or aldehyde for terminal alkynes).", "Concerted"],
            ["Kucherov Hydration (HgSO₄/H₂SO₄)", "R-C\\equiv CH + H_2O \\xrightarrow{HgSO_4, \\ \\text{dil. }H_2SO_4} R-CO-CH_3", "Mercury(II) grabs the triple bond, water attacks Markovnikov-style, and the unstable enol tautomerizes into the ketone.", "Acetylene itself gives acetaldehyde (only exception since it's the only case forming an aldehyde); all other terminal alkynes give methyl ketones. Enol is the unstable intermediate.", "Carbocation"],
            ["Addition of HCN (Vinyl Cyanide)", "HC\\equiv CH + HCN \\xrightarrow{Ba(CN)_2} CH_2=CH-CN", "Barium cyanide catalyzes HCN addition to give the monomer that becomes Orlon and Buna-N rubber.", "Vinyl cyanide (acrylonitrile) is the direct precursor to Orlon fiber and Buna-N synthetic rubber via polymerization.", "Carbanion"],
            ["Addition of Acetic Acid (Vinyl / Ethylidene Acetate)", "HC\\equiv CH + CH_3COOH \\xrightarrow{Hg^{2+}} CH_2=CH-OOCCH_3 \\xrightarrow{CH_3COOH} CH_3CH(OOCCH_3)_2", "Acetylene first grabs one acetic acid to form vinyl acetate, then a second to lock both onto the same carbon as ethylidene diacetate.", "Vinyl acetate polymerizes to poly(vinyl acetate), the base adhesive polymer, which hydrolyzes to poly(vinyl alcohol); heating ethylidene diacetate regenerates acetaldehyde + acetic anhydride.", "Carbocation"],
            ["Addition of Alcohols (Acetal / Ketal Formation)", "R-C\\equiv CH + 2\\ CH_3OH \\xrightarrow{BF_3, HgO} R-C(OCH_3)_2-CH_3", "Methanol adds twice under BF₃/HgO catalysis, capping the carbon in two methoxy groups.", "Acetylene specifically forms an acetal (methylal); every other alkyne forms a ketal, since the carbonyl carbon already bears an R group.", "Carbocation"],
            ["Addition of AsCl₃ (Lewisite Synthesis)", "HC\\equiv CH + Cl-AsCl_2 \\xrightarrow{AlCl_3 \\text{ or } HgCl_2} ClCH=CH-AsCl_2", "Acetylene combines with arsenic trichloride to make Lewisite — four times more toxic than mustard gas.", "Product is 2-chlorovinyl dichloroarsine (Lewisite), a chemical warfare agent; its antidote is BAL (2,3-dimercapto-1-propanol), which forms a non-toxic cyclic complex with it.", "Carbocation"],
            ["Carbonylation of Alkynes (Ni(CO)₄)", "HC\\equiv CH + CO + H_2O \\xrightarrow{Ni(CO)_4} CH_2=CH-COOH", "Nickel tetracarbonyl inserts CO and water across the triple bond to build acrylic acid directly.", "With ROH instead of water, gives the alkyl acrylate ester instead of the free acid; industrially important route to acrylic monomers.", "Concerted"],
            ["Combustion of Alkynes", "C_nH_{2n-2} + \\frac{3n-1}{2}O_2 \\rightarrow n\\ CO_2 + (n-1)\\ H_2O", "Burning acetylene in oxygen releases enormous heat — hot enough to cut and weld metal.", "The oxy-acetylene flame reaches ~3000°C, making it ideal for welding/cutting metal; 2 HC≡CH + 5 O₂ → 4 CO₂ + 2 H₂O + 312 kcal.", "Concerted"],
            ["Baeyer's Test — Alkaline KMnO₄ Oxidation", "HC\\equiv CH + 4\\ [O] \\xrightarrow{\\text{alk. }KMnO_4} HOOC-COOH", "Cold alkaline permanganate decolorizes and cleaves the triple bond straight to a dicarboxylic acid (oxalic acid for acetylene).", "General terminal-alkyne test alongside Br₂/CCl₄ decolorization; internal alkynes like 2-butyne give two moles of monocarboxylic acid instead.", "Carbanion"],
            ["Acidic KMnO₄ / K₂Cr₂O₇ Oxidative Cleavage", "R-C\\equiv C-R' + 2\\ [O] \\xrightarrow{H^+} R-COOH + R'-COOH", "Hot acidic oxidant chops the triple bond clean in half, dropping a carboxylic acid on each side.", "Cleaves at the triple bond exactly like ozonolysis; a terminal ≡CH carbon is oxidized all the way to CO₂ + H₂O.", "Carbanion"],
            ["SeO₂ Oxidation to Dicarbonyls", "R-C\\equiv C-R' \\xrightarrow{SeO_2} R-CO-CO-R'", "Selenium dioxide stops the oxidation one step earlier than KMnO₄, leaving a 1,2-diketone (glyoxal-type) instead of two acids.", "Milder oxidant than KMnO₄; halts at the vicinal diketone stage rather than cleaving all the way to carboxylic acids.", "Concerted"],
            ["Ozonolysis of Alkynes", "R-C\\equiv C-R' \\xrightarrow{1.\\ O_3\\ \\ 2.\\ H_2O} R-COOH + R'-COOH", "Ozone slices the triple bond and hydrolysis (with H₂O₂ present) delivers two carboxylic acids.", "H₂O₂ generated in situ acts as oxidant to push the ozonide fully to acids; adding Zn/H₂O instead reduces H₂O₂ and can trap an intermediate keto-acid.", "Concerted"],
            ["Formation of Sodium Acetylides", "HC\\equiv CH \\xrightarrow{NaNH_2} HC\\equiv C-Na \\xrightarrow{NaNH_2} Na-C\\equiv C-Na", "Sodamide strips off the acidic acetylenic hydrogens one at a time, since acetylene is effectively a dibasic acid.", "Acetylene is dibasic (gives up 2 H⁺) while 1-alkynes are monobasic; dry acetylides are unstable/explosive and regenerate the alkyne on treatment with dilute acid — useful for purification.", "Carbanion"],

            ["Reductive Ozonolysis of Alkenes", ["PREP","OXIDATION"], "Ozonide Cleavage to Carbonyls", "R_2C=CR_2' \\xrightarrow{1.\\ O_3\\ 2.\\ Zn/H_2O} R_2C=O + O=CR_2'", "Ozone slices the double bond clean in half; zinc dust stops the pieces from over-oxidising.", "Unbranched alkene carbons become aldehydes; branched (fully substituted) carbons become ketones.", "Concerted", "Classic method to locate the position of a double bond in an unknown alkene by identifying the carbonyl fragments formed."],

            ["Nef's Reaction", ["PREP"], "Nitroalkane to Carbonyl via Aci-Form", "R-CH_2-NO_2 \\xrightarrow{NaOH} R-CH=NOOH \\xrightarrow{H_3O^+} R-CHO + N_2O", "Base tautomerises the nitro group into its acidic aci-form, and acid hydrolysis then rips it apart into a carbonyl.", "The unstable aci-nitro salt collapses on acid workup, releasing nitrous oxide and unmasking the carbonyl.", "Carbanion", "1° nitroalkanes give aldehydes, 2° nitroalkanes give ketones; 3° nitroalkanes (no alpha-H) give no reaction at all."],

            ["Reduction of Acyl Chlorides with LiAlH[OtBu]3", ["REDUCTION"], "Bulky Hydride Stops at Aldehyde", "R-COCl \\xrightarrow{1.\\ LiAlH[OC(CH_3)_3]_3,\\ -78^\\circ C\\ 2.\\ H_2O} R-CHO", "The three bulky tert-butoxy groups on this hydride are too fat to reduce past the aldehyde stage.", "Steric bulk on the aluminium centre halts hydride delivery after just one addition to the acyl chloride.", "Carbanion", "A milder, more selective alternative to Rosenmund reduction that avoids the need for a poisoned palladium catalyst."],
            ["Decarboxylative Formation of Ketones from β-Keto Acids", ["RXN"], "Six-Membered TS Decarboxylation", "R-CO-CH_2-COOH \\xrightarrow{\\Delta,\\ 110^\\circ C} R-CO-CH_3 + CO_2", "Heat coaxes the acid group off through a comfortable six-membered cyclic transition state.", "The carboxyl proton hydrogen-bonds back to the carbonyl oxygen, releasing CO2 smoothly on warming.", "Concerted", "This decarboxylation step is exactly what finishes off both the acetoacetic ester and malonic ester syntheses."],

            ["Wacker Process (Ethene to Acetaldehyde)", ["PREP","OXIDATION"], "Pd(II)-Catalysed Alkene Oxidation", "CH_2=CH_2 + PdCl_2 + H_2O \\xrightarrow{CuCl_2} CH_3CHO + Pd + 2\\ HCl", "Palladium(II) grabs the alkene, water attacks, and CuCl2 regenerates the catalyst for the next cycle.", "This is the one alkene that breaks the pattern, ethene gives an aldehyde while every other alkene gives a ketone.", "Concerted", "All other terminal alkenes (RCH=CH2) give methyl ketones by the same Pd(II)/Cu(II) catalytic cycle, not aldehydes."],
            ["Oxo Reaction / Hydroformylation", ["PREP"], "Cobalt-Catalysed CO/H2 Addition", "R-CH=CH_2 + CO + H_2 \\xrightarrow{Co,\\ 150^\\circ C} R-CH_2-CH_2-CHO", "Water gas (CO + H2) adds an extra carbon onto the alkene, capped with an aldehyde.", "Symmetrical alkenes give one straight-chain aldehyde; unsymmetrical alkenes give a mix of chain isomers.", "Concerted", "Industrially important route that extends the carbon count by exactly one via syngas addition across the double bond."],

            ["Mixed (Crossed) Cannizzaro Reaction", ["CONDENSATION","REDUCTION","OXIDATION"], "Disproportionation Between Two Non-Enolisable Aldehydes", "HCHO + C_6H_5CHO \\xrightarrow{Conc.\\ NaOH} HCOONa + C_6H_5CH_2OH", "When two different aldehydes without alpha-hydrogens meet strong base, the more reactive one gets oxidised and the other reduced.", "Formaldehyde, being the most electrophilic, always sacrifices itself as the reducing agent, becoming formate.", "Carbanion", "HCHO is almost always the one oxidised to HCOO- in a mixed Cannizzaro, since its carbonyl carbon is the most electrophilic and accepts hydride transfer fastest."],

            ["Knoevenagel Condensation", ["CONDENSATION"], "Amine-Catalysed Active Methylene Condensation", "RCHO + CH_2(COOEt)_2 \\xrightarrow{piperidine} RCH=C(COOEt)_2", "A weak amine base like piperidine coaxes the acidic active-methylene compound into attacking the aldehyde.", "Two electron-withdrawing ester groups make the methylene hydrogens acidic enough for a mild organic base to deprotonate.", "Carbanion", "Followed by decarboxylation (if a free -COOH is present) this route builds alpha,beta-unsaturated acids like cinnamic acid from malonic ester + benzaldehyde."],

            ["Reaction of Alcohols with Phosphorus Halides", ["RXN"], "Conversion to Alkyl Halides", "3\\ R-OH + PCl_3 \\rightarrow 3\\ R-Cl + H_3PO_3", "Phosphorus trichloride, pentachloride, or thionyl chloride all swap the -OH for a halogen directly.", "SOCl2 is the cleanest of the three since its byproducts (SO2, HCl) are both gases that simply escape.", "Concerted", "SOCl2 with pyridine is preferred synthetically because both byproducts are gaseous, giving the purest alkyl halide with no aqueous workup needed."],
            ["Ceric Ammonium Nitrate Test", ["TEST"], "Colour Test for -OH Group", "R-OH + Ce(NH_4)_2(NO_3)_6 \\rightarrow \\text{Red Colour}", "A simple colour-change spot test confirms the presence of an alcoholic -OH group.", "Red colouration develops as the alcohol coordinates to the cerium(IV) complex, forming a new charge-transfer species.", "Concerted", "Simple, fast qualitative test for distinguishing alcohols from other functional groups without needing wet chemistry setups."],
            ["Reaction of Alcohol with Sodium Metal", ["RXN","TEST"], "Effervescence Test for -OH", "R-OH + Na \\rightarrow R-ONa + \\tfrac{1}{2}H_2\\uparrow", "Bubbles of hydrogen gas confirm an acidic O-H proton is present, just like water reacting with sodium.", "Alcohols are far less acidic than water but still acidic enough to react vigorously with reactive metals like Na and K.", "Concerted", "Acidity order across common OH-bearing species: H2O > ROH > (terminal alkyne C-H) > NH3, explaining why alcohols react with Na but not as violently as water."],
            ["Acetylation of Alcohols with Ketene", ["RXN"], "Ketene as Acetylating Agent", "CH_2=C=O + R-OH \\rightarrow CH_3-COOR", "Ketene's strained cumulated double bond is so reactive that alcohol adds straight across it without any catalyst.", "The alcohol oxygen attacks the central sp-carbon of ketene, and a proton shift finishes off the acetate ester.", "Concerted", "Ketene is one of the most powerful acetylating agents known, reacting instantly with alcohols, amines, and even water."],
            ["Ethyl Urethane Formation", ["RXN"], "Reaction of Alcohol with Isocyanic Acid", "HN=C=O + C_2H_5OH \\rightarrow NH_2-COOC_2H_5", "Ethanol adds across the isocyanate's C=N bond just like it would across a ketene, forming a carbamate.", "Ethyl urethane produced this way is itself a key intermediate in industrial urea synthesis routes.", "Concerted", "Ethyl carbamate (urethane) synthesised this way historically found use as a sedative before safety concerns limited its application."],
            ["Xanthate Ester Formation (CS2 Reaction)", ["RXN"], "Sodium Alkyl Xanthate Synthesis", "R-ONa + CS_2 \\rightarrow R-O-CS-SNa", "Sodium alkoxide's oxygen attacks carbon disulfide, and the resulting xanthate salt is famous as a mineral-ore flotation agent.", "The alkoxide adds across one C=S bond of CS2, leaving a thiolate to balance the negative charge.", "Carbanion", "Sodium alkyl xanthates are used industrially as flotation agents in mineral ore processing to separate valuable minerals from gangue."],
            ["Periodic Acid Cleavage of Glycerol", ["OXIDATION"], "Triol Oxidative Cleavage", "CH_2OH-CHOH-CH_2OH \\xrightarrow{2\\ HIO_4} 2\\ HCHO + HCOOH", "A three-hydroxyl chain needs two equivalents of periodic acid to snip it entirely into small carbonyl fragments.", "The middle carbon, flanked by two adjacent -OH groups, ends up over-oxidised all the way to formic acid.", "Concerted", "Requires at least two adjacent -OH (or one -OH plus one C=O) groups on neighbouring carbons; isolated, non-adjacent hydroxyls are untouched."],
            ["Phenol from Benzene Sulphonic Acid", ["PREP"], "Alkali Fusion Route", "C_6H_5SO_3Na + NaOH \\xrightarrow{Fusion} C_6H_5OH + Na_2SO_3", "Molten sodium hydroxide simply displaces the sulfonate group, swapping it out for a hydroxide.", "This nucleophilic aromatic substitution needs the extreme heat of a fusion reaction to overcome the poor leaving-group ability of sulfonate.", "Concerted", "One of the oldest industrial methods, though largely superseded today by the cheaper, milder cumene process."],
            ["Phenol from Benzene Diazonium Salt", ["PREP"], "Steam Hydrolysis of Diazonium", "C_6H_5N_2^+Cl^- \\xrightarrow{H_2O,\\ \\Delta} C_6H_5OH + N_2 + HCl", "Warming the diazonium salt with steam kicks out nitrogen gas and lets water trap the resulting aryl cation.", "Bubbling nitrogen confirms the reaction is proceeding as the unstable diazonium decomposes.", "Carbocation", "Must avoid excess acid or heat too early, or the diazonium salt decomposes prematurely before controlled hydrolysis can occur."],
            ["Cumene Process for Phenol (Industrial)", ["PREP"], "Cumene Hydroperoxide Route", "C_6H_5CH(CH_3)_2 \\xrightarrow{1.\\ O_2\\ 2.\\ dil.\\ H_2SO_4} C_6H_5OH + CH_3COCH_3", "Air oxidises cumene to its hydroperoxide, and dilute acid then rearranges it, splitting off phenol and acetone together.", "This single industrial process elegantly produces both phenol and acetone as valuable co-products from one cheap feedstock.", "Carbocation", "The world's dominant industrial phenol synthesis; the mechanism proceeds via a phenyl group migration to electron-deficient oxygen, mirroring Baeyer-Villiger logic."],
            ["Raschig Process for Phenol (Industrial)", ["PREP"], "Chlorobenzene Steam Hydrolysis Route", "C_6H_6 + HCl + \\tfrac{1}{2}O_2 \\xrightarrow{CuCl_2/FeCl_3} C_6H_5Cl \\xrightarrow{H_2O,\\ 425^\\circ C} C_6H_5OH", "Benzene is first chlorinated catalytically, then blasted with superheated steam to swap chlorine for hydroxide.", "Two harsh industrial steps in sequence turn cheap benzene directly into phenol via a chlorobenzene intermediate.", "Concerted", "Largely an older industrial route, now mostly displaced by the more economical cumene process."],
            ["Order of Nucleophilic Substitution on Nitro-Activated Chlorobenzenes", ["RXN"], "Electron-Withdrawing Group Activation", "\\text{ArCl (with -NO_2 groups)} + aq.\\ NaOH \\rightarrow \\text{ArOH}", "Ordinary chlorobenzene barely reacts with hydroxide at room temperature, but stacking on -NO2 groups makes the ring dramatically more reactive.", "More ortho/para -NO2 groups mean more resonance stabilisation of the Meisenheimer-like intermediate carrying the incoming nucleophile.", "Concerted", "2,4,6-Trinitrochlorobenzene reacts with aqueous NaOH even at room temperature, while plain chlorobenzene needs 300 degrees C fusion conditions."],
            ["Phenol vs. Alcohol: Acidity Comparison with NaHCO3", ["TEST"], "Diagnostic Weak-Acid Test", "C_6H_5OH + NaHCO_3 \\rightarrow \\text{No Reaction}", "Phenol is too weak an acid to displace carbonic acid from bicarbonate, unlike carboxylic acids which readily do.", "No effervescence with NaHCO3 distinguishes phenol from carboxylic acids, even though both dissolve in NaOH.", "Concerted", "Order of acid strength: carboxylic acids > carbonic acid > phenol > water > alcohol, phenol sits just below carbonic acid, hence no CO2 evolution."],
            ["Bromination of Phenol (2,4,6-Tribromophenol Test)", ["TEST","RXN"], "Highly Activated Ring Halogenation", "C_6H_5OH + 3\\ Br_2(aq) \\rightarrow 2,4,6\\text{-}Br_3C_6H_2OH\\downarrow + 3\\ HBr", "The -OH group activates the ring so strongly that bromine water alone (no catalyst needed) gives instant white precipitate.", "All three positions ortho/para to -OH light up with bromine at once, unlike benzene which needs a Lewis acid catalyst.", "Concerted", "Classic confirmatory test for phenol, bromine water is instantly decolourised with formation of a white precipitate, no catalyst required."],
            ["Reaction of Phenol with PCl5", ["RXN"], "Poor-Yield Chlorobenzene Route", "3\\ C_6H_5OH + PCl_5 \\rightarrow (C_6H_5O)_3PO + 3\\ HCl", "Unlike ordinary alcohols, phenol mostly reacts with PCl5 through its oxygen lone pair rather than substituting the whole -OH.", "Triphenyl phosphate forms as the major product, with chlorobenzene only a minor byproduct, the opposite of alcohol behaviour.", "Concerted", "Sharp distinguishing test from aliphatic alcohols, which cleanly give the alkyl chloride with PCl5 instead of an ester-like phosphate."],
            ["Reaction of Phenol with Zinc Dust", ["RXN"], "Deoxygenation to Benzene", "C_6H_5OH + Zn \\xrightarrow{\\Delta} C_6H_6 + ZnO", "Distilling phenol with zinc dust strips the oxygen away entirely, regenerating plain benzene.", "Benzylic or ring-substituted phenols with steric protection near -OH resist this deoxygenation.", "Concerted", "A useful way to confirm that -OH is directly on the aromatic ring; ortho-substituted phenols with steric hindrance may not react cleanly."],
            ["Bucherer Reaction", ["RXN"], "Phenol to Aniline Interconversion", "C_6H_5OH + NH_3 \\xrightarrow{ZnCl_2\\ or\\ (NH_4)_2SO_3,\\ 300^\\circ C} C_6H_5NH_2 + H_2O", "High pressure ammonia and a zinc chloride catalyst swap phenol's -OH for -NH2 under forcing conditions.", "This reaction is reversible, so aniline can likewise be converted back to phenol by superheated steam.", "Concerted", "Reversible reaction: the same catalytic system run with steam instead of ammonia converts aniline back into phenol."],
            ["Gattermann Aldehyde Synthesis on Phenol", ["PREP"], "Formylation via HCN/HCl", "C_6H_5OH + HCN + HCl \\xrightarrow{AlCl_3} p\\text{-}HOC_6H_4CHO", "HCN and HCl gas combine under Lewis acid catalysis to formylate phenol's ring, mainly at the para position.", "The imine intermediate hydrolyses in the final step to unmask the aldehyde group on the activated ring.", "Carbocation", "Closely related to Gattermann-Koch (used on benzene itself); here the strongly activating -OH group lets phenol react even without added CO/HCl gas mixture."],
            ["Friedel-Crafts Alkylation of Phenol", ["RXN"], "AlCl3-Catalysed Ring Alkylation", "C_6H_5OH + CH_3Cl \\xrightarrow{AlCl_3} o/p\\text{-}CH_3C_6H_4OH", "Phenol's activated ring readily undergoes Friedel-Crafts alkylation, giving a mixture of o- and p-cresol.", "Both directing effects of -OH (strong o,p-activator) funnel the incoming methyl group to those same two positions.", "Carbocation", "Similarly reacts with acid chlorides (e.g., acetyl chloride) under AlCl3 to give ortho/para hydroxyacetophenone mixtures."],
            ["Lederer-Manasse Reaction (Bakelite Formation)", ["CONDENSATION"], "Phenol-Formaldehyde Resin Synthesis", "C_6H_5OH + HCHO \\xrightarrow{NaOH\\ or\\ H^+} \\text{Novolac/Resole} \\xrightarrow{\\Delta} \\text{Bakelite}", "Formaldehyde condenses repeatedly at phenol's ortho/para positions, cross-linking chains into a rigid thermoset polymer.", "The famous first synthetic plastic, bakelite, is literally built one phenol-formaldehyde link at a time.", "Carbanion", "Excess formaldehyde with base catalyst gives a resole prepolymer that cross-links irreversibly on heating into the hard, infusible Bakelite resin."],
            ["Liebermann's Nitroso Test for Phenol", ["TEST"], "Colour Test via Indophenol", "C_6H_5OH + HNO_2 \\xrightarrow{Conc.\\ H_2SO_4} \\text{Green/Blue} \\xrightarrow{H_2O} \\text{Red} \\xrightarrow{NaOH} \\text{Blue}", "A dramatic colour sequence, green to red to blue, confirms phenol's presence with unmistakable clarity.", "The nitroso compound formed with phenol builds an indophenol dye whose colour flips with pH, a built-in confirmation cycle.", "Concerted", "The full colour cycle (green/blue to red on dilution to blue again on adding NaOH) is what makes this such a definitive, hard-to-fake positive test."],
            ["Coupling of Phenol with Diazonium Salt", ["RXN"], "Azo Dye Formation", "C_6H_5N_2^+Cl^- + C_6H_5OH \\xrightarrow{NaOH} C_6H_5-N=N-C_6H_4OH", "The diazonium ion, a weak electrophile, needs the strongly activated phenoxide ring to couple successfully at the para position.", "This azo coupling is the exact reaction that builds the orange/red azo dyes used throughout the textile industry.", "Concerted", "Coupling occurs almost exclusively para to -OH (or ortho if para is blocked), since the phenoxide ion is a far stronger nucleophile than neutral phenol."],
            ["Phenolphthalein Formation", ["CONDENSATION"], "Phthalic Anhydride Condensation", "2\\ C_6H_5OH + C_8H_4O_3 \\xrightarrow{Conc.\\ H_2SO_4} \\text{Phenolphthalein} + H_2O", "Two phenol molecules bracket a phthalic anhydride core, building the classic acid-base indicator dye.", "Colourless in acid, but ring-opening under base unveils an extended conjugated system that flashes bright pink.", "Carbocation", "Colourless in acidic/neutral solution; the quinonoid, fully conjugated dianion formed under alkaline conditions is responsible for the vivid pink colour used as a titration indicator."],
            ["Bisphenol-A Formation", ["CONDENSATION"], "Phenol-Acetone Condensation", "2\\ C_6H_5OH + (CH_3)_2C=O \\xrightarrow{Conc.\\ HCl} (HOC_6H_4)_2C(CH_3)_2", "Two phenol rings bracket a central acetone-derived carbon, forming the monomer behind polycarbonate plastics.", "This is essentially an acid-catalysed electrophilic substitution of acetone's carbonyl carbon onto two separate phenol rings.", "Carbocation", "Bisphenol-A (BPA) is the key industrial monomer for polycarbonate and epoxy resin plastics, making this an economically significant reaction."],
            ["Elbs Persulfate Oxidation of Phenol", ["OXIDATION"], "Para-Hydroxylation via Persulfate", "C_6H_5OH \\xrightarrow{K_2S_2O_8/KOH} p\\text{-}HOC_6H_4OH\\ (Quinol)", "Alkaline potassium persulfate selectively installs a second hydroxyl group right at the para position of phenol.", "Air oxidation of phenol instead gives the fully oxidised red p-benzoquinone rather than the dihydroxy quinol.", "Concerted", "Complementary oxidative outcomes: Elbs persulfate stops at the dihydroxybenzene (quinol) stage, while further oxidation (Air/[O], CrO2Cl2) pushes on to p-benzoquinone."],
            ["FeCl3 Test for Phenol", ["TEST"], "Complexation Colour Test", "6\\ C_6H_5OH + FeCl_3 \\rightarrow [Fe(OC_6H_5)_6]^{3-} + \\text{Violet Colour}", "Neutral ferric chloride solution turns violet the instant it meets a phenolic -OH, but stays colourless with ordinary alcohols.", "The phenoxide oxygens coordinate directly to the iron(III) centre, forming a distinctive coloured complex.", "Concerted", "The single fastest, most reliable spot test to distinguish phenols from aliphatic alcohols in a qualitative analysis scheme."],
            ["Oxonium Salt Formation of Ethers with Acids", ["RXN"], "Lewis Basicity of Ether Oxygen", "R-O-R + HCl(cold,\\ conc.) \\rightarrow [R_2OH]^+Cl^-", "Ether's lone pair grabs a proton from cold concentrated acid, forming a salt-like oxonium ion, without breaking the C-O bond.", "This reversible protonation is exactly why ethers can dissolve in cold concentrated acids while alkanes cannot.", "Concerted", "Cold dilute or cold concentrated HCl only forms the oxonium salt; hot concentrated or cold concentrated HI/HBr instead cleave the C-O bond entirely."],
            ["Peroxide Formation in Ethers (Autoxidation)", ["OXIDATION","TEST"], "Slow Aerial Oxidation Hazard", "R-O-CH_2-R' + O_2 \\xrightarrow{Sunlight,\\ long\\ contact} R-O-CH(OOH)-R'", "Ethers left open to air and light slowly build up dangerously explosive peroxides at the carbon next to oxygen.", "A free-radical chain abstracts the alpha-hydrogen first, and the resulting radical then traps atmospheric oxygen.", "Free Radical", "FeSO4/KCNS test detects these peroxides via a red colouration (Fe2+ oxidised to Fe3+, which forms red Fe(CNS)3); old ether bottles must never be distilled to dryness due to explosion risk."],
            ["Cleavage of Ethers with PCl5/BCl3", ["RXN"], "Halide-Forming Ether Cleavage", "R-O-R + PCl_5 \\xrightarrow{\\Delta} 2\\ R-Cl + POCl_3", "Phosphorus pentachloride and boron trichloride both rip the ether apart, converting both alkyl arms into alkyl halides.", "With BCl3, three ether molecules react per boron centre, giving three alkyl chlorides and a trialkyl borate ester.", "Concerted", "Distinct from oxonium salt formation with cold HCl, these are much harsher reagents that fully cleave the C-O-C linkage into two separate halides."],
            ["Base-Promoted Epoxide Formation from Halohydrins", ["PREP","RXN"], "Intramolecular Williamson-Type Ring Closure", "R_2C(OH)-CR_2X \\xrightarrow{NaOH} \\text{Epoxide} + NaX", "Hydroxide deprotonates the alcohol, and the resulting alkoxide displaces the neighbouring halide intramolecularly to snap the three-membered ring shut.", "This is really just an intramolecular Williamson ether synthesis, forced into a tight three-membered ring instead of an open chain.", "Concerted", "Proceeds with inversion of configuration at the carbon bearing the leaving halide, exactly like any SN2 ring-closure."],
            ["Nucleophilic Ring-Opening of Epoxides", ["RXN"], "Acidic vs. Basic Regiochemistry", "\\text{Epoxide} + H_2O \\xrightarrow{H^+\\ or\\ OH^-} \\text{1,2-Diol}", "Under basic conditions the nucleophile attacks the less hindered carbon (SN2-like); under acidic conditions it attacks the more substituted carbon (via a carbocation-like transition state).", "Both pathways converge on a vicinal diol, but the regiochemistry, and sometimes the stereochemistry, flips completely depending on the conditions.", "Carbocation", "This regiochemical switch (basic = less hindered carbon, acidic = more substituted carbon) is one of the most commonly tested concepts in epoxide chemistry."],
            ["Grignard Reaction with Ethylene Oxide", ["PREP"], "Two-Carbon Chain Extension", "R-MgX + H_2C{-\\!\\!-}CH_2 \\xrightarrow{1.\\ ether\\ 2.\\ H_3O^+} R-CH_2-CH_2-OH", "Ethylene oxide's ring strain makes it uniquely reactive toward Grignard reagents, always extending the chain by exactly two carbons.", "The strained three-membered ring snaps open the instant the Grignard carbanion attacks either carbon.", "Carbanion", "A reliable, general two-carbon homologation method, always installs a primary alcohol two carbons further out from the original Grignard reagent."]
