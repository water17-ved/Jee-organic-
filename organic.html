        // ================= NEW: AMINES (extracted from ALIPHATIC_&_AROMATIC_AMINES.pdf) =================
        // Each row: [name, tags[], typeDesc, reaction(LaTeX), mnemonic, story, intermediateType, notes]
        const aminesExtra = [
            ["Hofmann's Ammonolysis of Alkyl Halides", ["PREP","RXN"], "Excess Ammonia Route to 1° Amine", "R-X + NH_3(excess) \\xrightarrow{\\Delta} R-NH_2 \\xrightarrow{R-X} R_2NH \\xrightarrow{R-X} R_3N \\xrightarrow{R-X} R_4N^+X^-", "Ammonia keeps attacking every alkyl halide it can find, so only a big excess of NH3 stops the chain at the 1° amine.", "Each substitution regenerates a more nucleophilic amine that reacts even faster with the next R-X, right up to the quaternary salt.", "Concerted", "Excess NH3 favours 1° amine as major product; excess R-X drives the reaction all the way to the quaternary ammonium salt (R4N+X-), which itself is non-nucleophilic and doesn't react further."],
            ["Ammonolysis of Alcohols (Al2O3/ThO2)", ["PREP"], "Vapour-Phase Amination of Alcohols", "R-OH + NH_3 \\xrightarrow{Al_2O_3\\ or\\ ThO_2,\\ 350^\\circ C} R-NH_2 \\xrightarrow{R-OH} R_2NH \\xrightarrow{R-OH} R_3N", "Passing alcohol vapour with ammonia over hot alumina swaps -OH for -NH2 instead of -X for -NH2.", "Steric hindrance around nitrogen means the quaternary ammonium hydroxide never actually forms this way, unlike the alkyl halide route.", "Concerted", "Excess ammonia again favours the 1° amine; unlike Hofmann's ammonolysis, this route stops at the 3° amine since steric crowding blocks formation of the quaternary salt."],
            ["Reduction of Amides (LiAlH4 / Na-EtOH)", ["REDUCTION"], "Amide to 1° Amine, Same Carbon Count", "R-CONH_2 \\xrightarrow{LiAlH_4\\ or\\ Na/C_2H_5OH} R-CH_2-NH_2", "Lithium aluminium hydride strips the amide's oxygen clean away, leaving a primary amine with the carbon count untouched.", "Unlike the Hofmann bromamide route, no carbon is lost here, the amide carbonyl carbon becomes the amine's own CH2 carbon.", "Concerted", "Contrast sharply with Hofmann bromamide degradation, which drops one carbon; this reduction route keeps the same number of carbons as the starting amide."],
            ["Mendius Reaction (Reduction of Nitriles)", ["REDUCTION"], "One-Carbon Chain Extension via Nitrile", "R-CN + 4[H] \\xrightarrow{Na/C_2H_5OH\\ or\\ LiAlH_4} R-CH_2-NH_2", "Four hydrogens saturate the nitrile's triple bond completely, handing over a primary amine with one extra carbon.", "This is the classic homologation route, cyanide displacement on R-X followed by Mendius reduction extends any alkyl chain by exactly one carbon.", "Concerted", "Called the Mendius reaction; reduction of the corresponding alkyl isocyanide (R-NC) instead gives a secondary amine (R-NH-CH3) since the extra carbon stays attached to nitrogen."],
            ["Reduction of Oximes to 1° Amines", ["REDUCTION"], "C=N-OH to CH-NH2", "R_2C=N-OH + 4[H] \\xrightarrow{LiAlH_4\\ or\\ Na/C_2H_5OH} R_2CH-NH_2 + H_2O", "Four hydrogens knock the hydroxyl off the oxime nitrogen and saturate the C=N bond in one sweep to a primary amine.", "Oximes themselves come from aldehydes/ketones plus hydroxylamine, so this is really a two-step carbonyl-to-amine conversion.", "Concerted", "Provides a route from an aldehyde or ketone to a 1° amine bearing the exact same carbon skeleton, since only C=N is reduced, not the carbon chain itself."],
            ["Reduction of Nitroalkanes/Nitrobenzene", ["REDUCTION"], "Lab (Sn/HCl) vs Industrial (Fe/HCl) Routes", "R-NO_2 + 6[H] \\xrightarrow{Sn/HCl\\ (lab)\\ or\\ Fe/HCl\\ (industrial)} R-NH_2 + 2H_2O", "Tin and hydrochloric acid do the job cleanly in a beaker; iron and HCl scale up cheaply in a factory.", "Six nascent hydrogens are consumed per nitro group, stepping through nitroso and hydroxylamine intermediates on the way to the amine.", "Concerted", "This is THE standard synthesis of aniline from nitrobenzene; catalytic hydrogenation (H2/Ni or H2/Pd) is a cleaner modern alternative to the classical metal/acid combination."],
            ["Hydrolysis of Alkyl Isocyanides", ["RXN"], "Acidic Hydrolysis of R-NC to 1° Amine", "R-NC + 2H_2O \\xrightarrow{HCl} R-NH_2 + HCOOH", "Mineral acid tears the isocyanide apart, handing back the original primary amine plus formic acid as a byproduct.", "This regenerates exactly the amine that made the isocyanide in the carbylamine test, closing the loop between the two reactions.", "Carbocation", "Complementary to the carbylamine (isocyanide) test itself: forming R-NC confirms a 1° amine was present, and hydrolysing R-NC confirms it really was an isocyanide."],
            ["Hydrolysis of Alkyl Isocyanates (with KOH)", ["RXN"], "Isocyanate to Amine, Losing CO2 as Carbonate", "R-N=C=O + 2KOH \\xrightarrow{\\Delta} R-NH_2 + K_2CO_3", "Hot potassium hydroxide splits the isocyanate apart, trapping the carbon as carbonate and releasing the free amine.", "This step closes out both the Curtius and Hofmann bromamide sequences, both routes funnel through an isocyanate before hydrolysis liberates the amine.", "Concerted", "Common final step shared by the Hofmann bromamide reaction, Curtius reaction, and Schmidt reaction, all three generate an alkyl isocyanate intermediate that is then hydrolysed to the 1° amine."],
            ["Grignard Reagent + Chloramine", ["PREP"], "Direct C-N Bond Formation from RMgX", "R-MgI + Cl-NH_2 \\rightarrow R-NH_2 + Mg(I)(Cl)", "Chloramine's electrophilic nitrogen is exactly what the Grignard's carbanion wants to attack, forming a fresh C-N bond directly.", "A rarely-used but conceptually clean disconnection: no reduction step needed, the amine nitrogen is installed in a single organometallic step.", "Carbanion", "One of the few methods that builds the C-N bond directly from a Grignard reagent rather than via reduction of a nitrogen-containing functional group."],
            ["Lossen Rearrangement", ["REARRANGEMENT"], "Hydroxamic Acid to 1° Amine", "R-CO-NHOH \\xrightarrow{R'COCl} R-CO-NH-O-CO-R' \\xrightarrow{-R'COOH} R-N=C=O \\xrightarrow{H_2O} R-NH_2", "O-acylation activates the hydroxamic acid's leaving group, and the alkyl group migrates over to nitrogen exactly as in Hofmann and Curtius.", "Sits alongside Hofmann bromamide, Curtius, and Schmidt as the fourth classic 'one-carbon-shorter amine via isocyanate' rearrangement.", "Concerted", "The 4th member of the isocyanate-forming rearrangement family (with Hofmann, Curtius, Schmidt); all four proceed with retention of configuration at the migrating carbon since the group never fully leaves as a free carbocation."],
            ["Reductive Amination of Carbonyls", ["PREP","REDUCTION"], "Imine/Iminium Intermediate Route to Amines", "R_2C=O + NH_3 + H_2 \\xrightarrow{Ni} R_2CH-NH_2 \\ \\ ;\\ \\ R_2C=O + R'NH_2 + H_2 \\xrightarrow{Ni} R_2CH-NHR'", "Ammonia or a primary amine first condenses with the carbonyl to an imine, which nickel then hydrogenates flat to the saturated amine.", "Swap in ammonia for a 1° amine, a 1° amine for a 2° amine, or a 2° amine for a 3° amine, the same imine/iminium mechanism handles all three.", "Concerted", "One of the most versatile amine syntheses: NH3 gives a 1° amine, a 1° amine gives a 2° amine, and a 2° amine gives a 3° amine, all via the same carbonyl + hydrogenation logic."],
            ["Hofmann's Mustard Oil Reaction", ["TEST","RXN"], "CS2/HgCl2 Test Distinguishing 1° from 2°/3° Amines", "R-NH_2 + CS_2 \\xrightarrow{HgCl_2} R-N=C=S + HgS\\downarrow + 2HCl", "Only a primary amine can lose both N-H protons to carbon disulfide and mercury(II), releasing an isothiocyanate that smells exactly like mustard oil.", "Secondary amines get stuck as the dithiocarbamate salt (no reaction with HgCl2), and tertiary amines don't react with CS2 at all, primary amines alone go all the way.", "Concerted", "Alongside the carbylamine test, this is a second classic mustard-oil-smell test specific to 1° amines; 2° amines give no reaction with HgCl2 and 3° amines don't react with CS2 in the first place."],
            ["Liebermann's Nitrosoamine Test (2° Amines + HNO2)", ["TEST"], "Yellow Oily N-Nitrosoamine Layer", "R_2NH + HONO \\rightarrow R_2N-N=O\\ (yellow\\ oil) + H_2O", "Secondary amines react with nitrous acid to form a yellow oily N-nitroso layer floating on the aqueous mixture, the tell-tale Liebermann test.", "This is the middle case in the classic HNO2 test: 1° amines fizz with N2 gas, 2° amines form the yellow oil, 3° amines merely dissolve as a soluble nitrite salt.", "Concerted", "N-nitrosoamines formed this way are well-known carcinogens; the reaction is the key qualitative distinction between 1°, 2°, and 3° aliphatic amines using cold NaNO2/HCl."],
            ["Diazotisation of Aniline", ["PREP","RXN"], "Ice-Cold Formation of Benzenediazonium Salt", "C_6H_5NH_2 + NaNO_2 + 2HCl \\xrightarrow{0-5^\\circ C} C_6H_5N_2^+Cl^- + NaCl + 2H_2O", "Ice-cold nitrous acid, generated in situ from sodium nitrite and HCl, converts aniline into the versatile benzenediazonium salt.", "Unlike aliphatic 1° amines (which lose N2 gas immediately), aromatic diazonium salts are stabilised by the ring and survive as isolable, synthetically useful intermediates.", "Concerted", "The diazonium salt must be kept below 5°C, since it decomposes on warming; it's the gateway to phenols, aryl halides, nitriles, and azo dyes."],
            ["Azo Coupling (Dye Test) of Diazonium Salts", ["TEST","RXN"], "Electrophilic Coupling with Phenols/Amines", "C_6H_5N_2^+Cl^- + C_6H_5OH \\xrightarrow{pH\\ 9-10} C_6H_5-N=N-C_6H_4-OH", "The weakly electrophilic diazonium ion attacks the electron-rich ring of phenol or aniline, stitching together a brightly coloured azo dye.", "Coupling with beta-naphthol under NaOH gives a scarlet-red precipitate, the classic dye test that confirms a primary aromatic amine went through diazotisation.", "Concerted", "Positive azo dye test is specific to primary AROMATIC amines (via their diazonium salt); primary aliphatic amines cannot give this test since their diazonium ion decomposes to an alcohol + N2 before coupling can occur."],
            ["Balz-Schiemann Reaction", ["RXN","REARRANGEMENT"], "Diazonium to Aryl Fluoride via Fluoroborate", "C_6H_5N_2^+Cl^- \\xrightarrow{NaBF_4} C_6H_5N_2^+BF_4^- \\xrightarrow{\\Delta} C_6H_5F + BF_3 + N_2", "The diazonium salt is first swapped for a stable fluoroborate salt, then gentle heating kicks out nitrogen and BF3 to leave the aryl fluoride behind.", "This is the standard way to make an aryl C-F bond, since fluoride can't be introduced by direct Sandmeyer-type copper chemistry the way Cl, Br, and CN can.", "Carbocation", "The only reliable general method for making ArF; direct nucleophilic substitution of the diazonium nitrogen by F- doesn't work, so the isolable fluoroborate salt is used instead."],
            ["Reaction with Aq. KI (Diazonium to Aryl Iodide)", ["RXN"], "Direct Iodide Substitution, No Catalyst Needed", "C_6H_5N_2^+Cl^- + KI \\rightarrow C_6H_5I + N_2 + KCl", "Iodide is such a good nucleophile that it displaces nitrogen from the diazonium salt directly, no copper catalyst required unlike Cl and Br.", "Contrast this with Sandmeyer's reaction, which needs Cu2Cl2 or Cu2Br2 to install Cl or Br, iodide alone gets the job done.", "Carbocation", "One of the simplest diazonium reactions: unlike chlorination/bromination via Sandmeyer's reaction, iodination needs no copper(I) catalyst at all."],
            ["Aniline Bromination (Direct, Polar Solvent)", ["RXN"], "Exhaustive Tribromination Without a Catalyst", "C_6H_5NH_2 + 3Br_2 \\xrightarrow{H_2O} 2,4,6\\text{-Tribromoaniline}\\downarrow(white) + 3HBr", "The strongly activating -NH2 group makes the ring so electron-rich that bromine water substitutes all three open positions at once, no FeBr3 needed.", "To stop at mono-substitution, the amine must first be tamed as an amide (acetanilide) before halogenating, then hydrolysed back to the free amine.", "Concerted", "To obtain mono-bromoaniline selectively, -NH2 must first be protected as -NHCOCH3 (acetanilide) via acetylation, since the acetyl group's -I effect tones down the ring's reactivity."],
            ["Direct Nitration of Aniline (meta-Selective)", ["RXN"], "Protonation Reverses the Directing Effect", "C_6H_5NH_2 \\xrightarrow{Conc.\\ HNO_3/H_2SO_4} m\\text{-Nitroaniline}\\ (major)", "Strong acid protonates the amine to -NH3+, an electron-withdrawing group that pushes the nitro group to the meta position instead of ortho/para.", "This looks paradoxical since -NH2 is normally o,p-directing, but once protonated it behaves like a deactivating, meta-directing group instead.", "Carbocation", "To get o- and p-nitroaniline instead, the amine is first acetylated to acetanilide (a milder activator that survives the nitrating mixture), nitrated, then hydrolysed back to -NH2."],
            ["Sulphonation of Aniline (Sulphanilic Acid / Baking)", ["RXN"], "Zwitterionic Amino-Sulphonic Acid Product", "C_6H_5NH_2 + H_2SO_4(fuming) \\xrightarrow{180^\\circ C,\\ baking} p\\text{-}H_2N{-}C_6H_4{-}SO_3H", "Fuming sulphuric acid first forms the anilinium hydrogen sulfate salt, and heating ('baking') rearranges it to the para-sulphonic acid.", "The product exists as a zwitterion (dipolar ion, -NH3+ and -SO3- on the same ring), which is why sulphanilic acid is a high-melting solid, insoluble in typical organic solvents.", "Concerted", "Sulphanilic acid is the key building block for sulpha drugs and azo dyes; it exists as an ampholyte (zwitterion) with both an acidic -SO3H and a basic -NH2 group in the same molecule."],
            ["Schotten-Baumann Benzoylation of Aniline", ["RXN"], "Acyl Chloride + NaOH Route to Anilide", "C_6H_5NH_2 + C_6H_5COCl \\xrightarrow{NaOH} C_6H_5NHCOC_6H_5\\ (Benzanilide) + HCl", "Aqueous NaOH mops up the HCl byproduct as fast as it forms, driving the acylation of the weakly nucleophilic aniline nitrogen to completion.", "This is the standard way to make an anilide cleanly, without the base present the liberated HCl would just protonate the aniline and shut down its nucleophilicity.", "Concerted", "Also called simply the benzoylation reaction; the NaOH is essential to keep the amine free-base (nucleophilic) rather than tied up as its ammonium salt."],
            ["Basicity Comparison of Amines (Aqueous Phase)", ["RXN"], "Steric + Solvation Effects Override Simple +I Order", "\\text{Aq. phase order}:\\ R_2NH > RNH_2 > R_3N > NH_3\\ (\\text{for } R=CH_3)", "In water, steric hindrance in 3° amines and poor hydration of the protonated ion drag their basicity below even 2° and often 1° amines.", "This flips the naive '+I effect means 3° is most basic' expectation, which only actually holds true in the gas phase where there's no solvent to worry about.", "Concerted", "In the GAS phase (no solvation effects) the order is simply R3N > R2NH > RNH2 > NH3, following the inductive +I effect alone; the reversal in water is entirely a solvation/steric story."]

        // ================= NEW: HALOALKANES & HALOARENES (extracted from ALKYL_HALIDE_AND_ARYL_HALIDE.pdf) =================
        // Each row: [name, tags[], typeDesc, reaction(LaTeX), mnemonic, story, intermediateType, notes]
        const haloalkanesArylExtra = [
            ["Alcohol + PCl5 (SNi-type Chlorination)", ["PREP"], "Phosphorus Pentachloride Route to R-Cl", "R-OH + PCl_5 \\rightarrow R-Cl + POCl_3 + HCl", "Phosphorus pentachloride swaps the alcohol's -OH for -Cl in one step, releasing phosphoryl chloride and HCl gas as byproducts.", "Unlike SOCl2/pyridine, plain PCl5 gives no stereochemical guarantee, useful for simple synthesis but not for stereospecific work.", "Concerted", "Alternative to Lucas reagent (ZnCl2/HCl) for converting alcohols to chlorides; PBr3/PI3 are less stable so a P + Br2 or P + I2 mixture is generated in situ for bromides/iodides instead."],
            ["Darzen's Procedure (SOCl2/Pyridine)", ["PREP"], "Stereospecific Chlorination via SNi Mechanism", "R-OH + SOCl_2 \\xrightarrow{Pyridine} R-Cl + SO_2\\uparrow + HCl\\uparrow", "Thionyl chloride departs as two gases (SO2 and HCl), leaving nothing but pure alkyl chloride behind, ideal for clean lab-scale prep.", "Pyridine mops up the HCl as it forms, preventing racemisation via a competing SN1 pathway and keeping the reaction cleanly SNi (retention).", "Concerted", "The only common alcohol-to-halide method that proceeds with retention of configuration (via the SNi mechanism) when pyridine is absent; SOBr2 and SOI2 are too unstable, so this method is chlorine-only."],
            ["Reactivity Order of Alkyl Halides (SN1)", ["RXN"], "Governed by Carbocation Stability", "\\text{Benzyl} > \\text{Allyl} > 3^\\circ > 2^\\circ > 1^\\circ > \\text{Methyl halide}", "The more stable the carbocation that forms on ionisation, the faster the SN1 substitution proceeds, benzyl and allyl win by resonance.", "Tertiary halides ionise fastest among simple alkyls since three alkyl groups best stabilise the developing positive charge.", "Carbocation", "SN1 reactions of chiral alkyl halides proceed with racemisation, since the planar carbocation intermediate can be attacked by the nucleophile from either face."],
            ["Reactivity Order of Alkyl Halides (SN2)", ["RXN"], "Governed by Steric Hindrance (Walden Inversion)", "CH_3X > 1^\\circ\\ halide > 2^\\circ\\ halide > 3^\\circ\\ halide", "Bulkier alkyl groups around the leaving carbon physically block backside nucleophilic attack, so methyl halide reacts fastest and 3° barely reacts at all.", "The nucleophile has to attack from directly opposite the leaving halide, so any crowding there kills the rate.", "Concerted", "SN2 reactions of chiral alkyl halides proceed with 100% inversion of configuration (Walden inversion), since the nucleophile always attacks from the back side, opposite the leaving group."],
            ["Reaction with KCN vs AgCN (Ambident Nucleophile)", ["RXN"], "Ionic vs Covalent Character Flips Major Product", "R-X + KCN \\xrightarrow{Alc.} R-CN\\ (major) + R-NC\\ \\ ;\\ \\ R-X + AgCN \\xrightarrow{Alc.} R-NC\\ (major) + R-CN", "Ionic KCN attacks through its more electronegative carbon end to give the nitrile; covalent AgCN forces attack through nitrogen instead, giving the isocyanide.", "Cyanide is a classic ambident nucleophile, hard carbon end attacks with the ionic (softer, more available) reagent, while the covalently-bound AgCN redirects attack to nitrogen.", "Carbanion", "Textbook example of an ambident nucleophile: KCN (ionic bond, C attacks, gives nitrile as major) vs AgCN (covalent Ag-CN bond, N attacks, gives isocyanide as major)."],
            ["Reaction with KNO2 vs AgNO2 (Ambident Nucleophile)", ["RXN"], "Ionic vs Covalent Character Flips O vs N Attack", "R-X + KNO_2 \\xrightarrow{Alc.} R-O-N=O\\ (alkyl\\ nitrite,\\ major)\\ \\ ;\\ \\ R-X + AgNO_2 \\xrightarrow{Alc.} R-NO_2\\ (nitroalkane,\\ major)", "Ionic KNO2 lets the more electronegative oxygen end attack to give the nitrite ester; covalent AgNO2 redirects the softer nitrogen end to attack instead, giving the nitroalkane.", "Nitrite ion is another classic ambident nucleophile, exactly parallel to the CN- case, ionic salt favours the electronegative-atom product, covalent salt favours the other.", "Carbanion", "Second classic ambident-nucleophile pair after CN-/NC-; KNO2 (ionic, O attacks) gives the alkyl nitrite as major product, while AgNO2 (covalent) gives the nitroalkane as major product."],
            ["Wurtz-Fittig Reaction", ["PREP","RXN"], "Cross-Coupling of Aryl and Alkyl Halides", "C_6H_5-Cl + 2Na + Cl-R \\xrightarrow{dry\\ ether} C_6H_5-R + 2NaCl", "Sodium metal couples an aryl halide with an alkyl halide directly, welding a new alkyl chain onto the benzene ring.", "A mixed version of the Wurtz reaction, run between one aromatic and one aliphatic halide instead of two aliphatic ones.", "Free Radical", "Named for the combination of the aliphatic Wurtz reaction and the aromatic Fittig reaction; always gives some symmetrical biphenyl and symmetrical alkane as side products alongside the main cross product."],
            ["Fittig Reaction", ["PREP","RXN"], "Symmetrical Biaryl Coupling", "2\\ C_6H_5-Cl + 2Na \\xrightarrow{dry\\ ether} C_6H_5-C_6H_5\\ (Diphenyl) + 2NaCl", "Two molecules of chlorobenzene couple head to head under sodium metal, exactly like Wurtz but for two aryl halides instead of two alkyl ones.", "This is simply the Wurtz reaction's aromatic cousin, giving the symmetrical biaryl product diphenyl (biphenyl).", "Free Radical", "The purely-aromatic counterpart of the Wurtz reaction; combining it with an alkyl halide instead gives the mixed Wurtz-Fittig reaction."],
            ["Formation of Grignard Reagent", ["PREP"], "R-X + Mg in Dry Ether", "R-X + Mg \\xrightarrow{dry\\ ether} R-MgX\\ (Grignard\\ reagent)", "Magnesium metal inserts itself directly into the carbon-halogen bond, generating one of organic chemistry's most versatile carbanion-equivalents.", "Ease of formation follows RI > RBr > RCl, mirroring the same C-X bond strength order seen throughout halide chemistry.", "Carbanion", "Must be prepared and used under strictly anhydrous, moisture-free conditions, water instantly quenches the Grignard reagent to alkane plus Mg(OH)X."],
            ["Grignard Reagent + Active Hydrogen Compounds", ["RXN"], "Quenching to Alkane by Protic Compounds", "R-MgX + H-OH\\ (or\\ ROH,\\ RNH_2,\\ RC\\equiv CH,\\ PhOH) \\rightarrow R-H + Mg(OH)X\\ (or\\ analogous\\ salt)", "Any molecule with an acidic proton, water, alcohols, amines, terminal alkynes, phenols, instantly protonates the Grignard's basic carbanion to the plain alkane.", "This unwanted side-reaction is exactly why Grignard reagents must be kept scrupulously dry until the moment they're needed for a real C-C bond-forming step.", "Carbanion", "This same quenching reaction, run quantitatively with CH3MgI, is the basis of the Zerewitinoff active-hydrogen determination, measuring evolved CH4 gas tells you how many acidic protons a compound has."],
            ["Aryl Halide from Phenol (via PCl5)", ["PREP"], "Minor Route Since Direct Halogenation is Preferred", "C_6H_5OH + PCl_5 \\rightarrow C_6H_5Cl + POCl_3 + HCl", "Phosphorus pentachloride can swap phenol's -OH for -Cl, though it's a minor pathway since direct electrophilic halogenation of benzene is far more common industrially.", "The major product from PCl3 instead is actually triphenyl phosphate ((C6H5)3PO4), phenol's oxygen prefers attacking phosphorus over displacing OH.", "Concerted", "With PCl3 the major product is triphenyl phosphate rather than chlorobenzene; PCl5 gives chlorobenzene only as the minor product, direct ring halogenation of benzene remains the standard preparation."],
            ["Nucleophilic Aromatic Substitution — Elimination-Addition (Benzyne)", ["REARRANGEMENT","RXN"], "Very Strong Base (NaNH2) on Unactivated Aryl Halides", "C_6H_5Cl + KNH_2 \\xrightarrow{liq.\\ NH_3} [\\text{Benzyne}] \\xrightarrow{NH_3} C_6H_5NH_2\\ (mixture\\ of\\ isomers)", "A ferociously strong amide base rips off a proton next to the halide first, and the resulting strained benzyne intermediate then grabs ammonia from either carbon of the old triple bond.", "This explains a classic labelling experiment: chlorobenzene labelled at C1 gives a near 50:50 mix of aniline labelled at C1 and C2, proof the intermediate is symmetric benzyne, not simple substitution.", "Concerted", "Requires a very strong base (NaNH2/KNH2) even for UNACTIVATED aryl halides (no EWG needed); proceeds via elimination to strained benzyne, then nucleophilic addition, giving a scrambled mixture of substitution positions."],
            ["Nucleophilic Aromatic Substitution — Addition-Elimination (Nitro-Activated)", ["RXN"], "Milder Base on ortho/para-Nitro Aryl Halides", "p\\text{-}O_2N{-}C_6H_4{-}Cl + NaOCH_3 \\xrightarrow{85^\\circ C} p\\text{-}O_2N{-}C_6H_4{-}OCH_3 + NaCl", "An electron-withdrawing nitro group ortho or para to the halide stabilises a negatively-charged Meisenheimer-type intermediate, letting a plain nucleophile add before the halide leaves.", "No strong base or benzyne needed here, this pathway works with an ordinary alkoxide as long as the ring is sufficiently activated by nitro groups.", "Carbanion", "Rate increases dramatically with more o/p-nitro groups (up to 10^15-fold for 2,4-dinitro vs unsubstituted); uniquely, fluoride becomes the BEST leaving group here (opposite of aliphatic SN2), since the rate-determining step is nucleophilic addition, not C-F bond breaking."],
            ["Dow's Process (Phenol from Chlorobenzene)", ["PREP"], "High-Pressure/Temperature Benzyne-Type Hydrolysis", "C_6H_5Cl + Aq.\\ NaOH \\xrightarrow{300^\\circ C,\\ high\\ pressure} C_6H_5OH + NaCl", "Superheated, high-pressure sodium hydroxide is forceful enough to substitute the inert C-Cl bond of chlorobenzene directly for -OH.", "This industrial route needs such extreme conditions specifically because aryl halides resist nucleophilic substitution far more than alkyl halides do.", "Concerted", "The harsh 300°C/high-pressure conditions are needed precisely because aryl C-Cl bonds are unusually strong (partial double-bond character from ring conjugation) and won't react under normal SN1/SN2 conditions."],
            ["Raschig Process (Chlorobenzene from Benzene)", ["PREP"], "Cu-Catalysed Oxychlorination of Benzene", "C_6H_6 + HCl + O_2(air) \\xrightarrow[300^\\circ C]{Cu_2Cl_2} C_6H_5Cl + H_2O", "Cuprous chloride catalyses a combined chlorination-oxidation of benzene, using HCl and atmospheric oxygen instead of chlorine gas directly.", "An economical industrial shortcut, it recycles HCl (a cheap byproduct of many other processes) into the more valuable chlorobenzene.", "Concerted", "Industrially attractive because it uses HCl gas (often a cheap byproduct elsewhere) plus air rather than expensive elemental chlorine gas as the chlorinating agent."],
            ["Reduction of Aryl Halides (Ni-Al/NaOH)", ["REDUCTION"], "Dehalogenation Back to the Parent Arene", "Ar-X + 2[H] \\xrightarrow{Ni{-}Al/NaOH} Ar-H + HX", "A nickel-aluminium alloy in sodium hydroxide donates nascent hydrogen that simply knocks the halogen back off the ring, regenerating plain benzene.", "This full dehalogenation is useful synthetically to remove a halogen that served only as a temporary directing/blocking group during synthesis.", "Concerted", "Occasionally used as a synthetic strategy: install a halogen to direct/block a position during a multi-step aromatic synthesis, then remove it entirely at the end with Ni-Al/NaOH."],
            ["DDT Synthesis (Chlorobenzene + Chloral)", ["CONDENSATION"], "Acid-Catalysed Friedel-Crafts-Type Condensation", "2\\ C_6H_5Cl + CCl_3CHO \\xrightarrow{Conc.\\ H_2SO_4} (ClC_6H_4)_2CHCCl_3 + H_2O", "Concentrated sulphuric acid activates chloral's carbonyl, and two molecules of chlorobenzene attack it from either side to build the insecticide DDT.", "The product, p,p'-dichlorodiphenyltrichloroethane, was once the world's most widely used insecticide before its environmental persistence became a major concern.", "Carbocation", "DDT stands for dichlorodiphenyltrichloroethane; it is formed by an electrophilic aromatic substitution of chlorobenzene onto protonated chloral (trichloroacetaldehyde), catalysed by concentrated H2SO4."],
            ["Sandmeyer's Reaction (Cl/Br on Aryl Halide Precursor)", ["RXN"], "Cu(I)-Catalysed Radical Substitution of N2 by Halide", "Ar-N_2^+Cl^- \\xrightarrow{Cu_2Cl_2/HCl} Ar-Cl + N_2\\ \\ ;\\ \\ Ar-N_2^+Cl^- \\xrightarrow{Cu_2Br_2/HBr} Ar-Br + N_2", "Copper(I) halide catalyses displacement of the diazonium's nitrogen by chloride or bromide, the standard way to install these halogens exactly where the amino group used to be.", "This is how chemists put a halogen at a ring position that direct electrophilic halogenation could never reach on its own, going through the amine/diazonium detour.", "Free Radical", "Direct thermal decomposition of the diazonium salt WITHOUT the copper catalyst instead gives phenol (via Ar+ trapped by water); the Cu2X2 catalyst is essential for redirecting the pathway toward the aryl halide."],
            ["Gattermann Reaction (Cu Powder Variant)", ["RXN"], "Alternative to Sandmeyer Using Fine Copper", "Ar-N_2^+Cl^- \\xrightarrow{Cu\\ powder/HCl} Ar-Cl + N_2", "Finely powdered copper metal itself, rather than a copper(I) salt, can catalyse the same halogen-for-nitrogen swap as Sandmeyer's reaction.", "A simpler, slightly lower-yielding alternative that avoids preparing cuprous chloride separately.", "Free Radical", "Mechanistically parallel to Sandmeyer's reaction; generally gives somewhat lower yields than the copper(I) halide method, which is why Sandmeyer's reaction remains the more commonly cited route."],
            ["Electrophilic Substitution on Chlorobenzene (o,p-Directing)", ["RXN"], "Halogen is Deactivating but o,p-Directing", "C_6H_5Cl + Cl_2 \\xrightarrow{FeCl_3} o\\text{-} \\ and\\ p\\text{-}C_6H_4Cl_2\\ (mixture)", "Chlorine's lone pairs donate into the ring by resonance (directing o,p-) even while its strong electronegativity withdraws density overall (deactivating), a genuinely unusual combination.", "This dual personality, o,p-director yet net deactivator, is what makes halogens the textbook exception among all common ring substituents.", "Carbocation", "Chlorobenzene reacts SLOWER than benzene itself in electrophilic substitution (net deactivation by -I effect) but still directs incoming groups to ortho and para (net +M/resonance donation dominates regiochemistry, not rate)."],
            ["Hydrolysis Test Distinguishing Gem- and Vic-Dihalides", ["TEST"], "Aqueous KOH Gives Diol vs Carbonyl", "Vic\\text{-}dihalide + 2KOH(aq) \\rightarrow Diol\\ \\ ;\\ \\ Gem\\text{-}dihalide + 2KOH(aq) \\rightarrow Carbonyl\\ (Aldehyde/Ketone) + 2KCl", "Vicinal dihalides simply swap both halogens for hydroxyls to give a diol, while geminal dihalides form an unstable diol on the SAME carbon that instantly collapses to a carbonyl.", "A gem-diol (two -OH on one carbon) can never survive, it always dehydrates immediately to the corresponding aldehyde or ketone.", "Carbocation", "Reliable qualitative distinction: aqueous KOH on a vic-dihalide gives a stable glycol, while the same treatment on a gem-dihalide gives an aldehyde (terminal) or ketone (internal) after the unstable gem-diol loses water."],
            ["Dehalogenation with Zn — Vic vs Gem Products", ["REDUCTION","RXN"], "Same-Carbon Alkene vs Twice-Carbon Alkene", "Vic\\text{-}dihalide + Zn \\xrightarrow{\\Delta} Alkene\\ (same\\ carbon\\ count) + ZnX_2\\ \\ ;\\ \\ 2\\ Gem\\text{-}dihalide + 2Zn \\xrightarrow{\\Delta} Alkene\\ (twice\\ carbon\\ count) + 2ZnX_2", "Zinc dust removes two halogens from adjacent carbons of a vicinal dihalide to directly form the alkene; but for a geminal dihalide it must couple TWO separate molecules together instead, doubling the carbon count.", "This carbon-count doubling for gem-dihalides is a favourite trap in exam questions, students often forget it isn't a simple 1:1 elimination like the vicinal case.", "Carbanion", "Vic-dihalide + Zn gives the 'same carbon' alkene (simple elimination); gem-dihalide + Zn gives the 'twice carbon' alkene instead, since two separate molecules must couple together, this doubling is a classic exam trap."]
        ];

        haloalkanesArylExtra.forEach(item => {

        // ================= NEW: CARBOXYLIC ACIDS & DERIVATIVES (extracted from CARBOXYLIC_ACID_AND_THEIR_DERIVATIVES.pdf) =================
        // Each row: [name, tags[], typeDesc, reaction(LaTeX), mnemonic, story, intermediateType, notes]
        const carboxylicAcidExtra = [
            ["Carboxylation of Grignard Reagent (CO2 Insertion)", ["PREP"], "One-Carbon Homologation via Dry Ice", "R-MgBr + CO_2 \\xrightarrow{dry\\ ether} R-COOMgBr \\xrightarrow{H_3O^+} R-COOH", "Solid CO2 (dry ice) is the classic quench for a Grignard reagent, inserting one new carboxyl carbon exactly where the metal was attached.", "This is the go-to route whenever a synthesis problem needs to add exactly one carbon and end up with -COOH, no reduction or hydrolysis detour required.", "Carbanion", "One of the most direct one-carbon homologations in organic synthesis; works equally well with the corresponding organolithium reagent in place of the Grignard."],
            ["Cyanide Hydrolysis of Nitriles (Dilute Acid)", ["RXN"], "R-CN to R-COOH via Amide Intermediate", "R-CN + 2H_2O \\xrightarrow{dil.\\ H^+,\\ \\Delta} R-COOH + NH_4^+", "Water adds twice across the nitrile's triple bond, first to an imidic acid tautomer, then through the amide, before finally releasing ammonium ion and the free acid.", "This is why nitriles are such a popular one-carbon homologation handle, install -CN on an alkyl halide, then simply boil with acid to reach the carboxylic acid two steps later.", "Carbocation", "Proceeds through a protonated imidic acid intermediate that tautomerises to the amide before a second hydration step releases NH4+; can be stopped at the amide stage under milder conditions."],
            ["Oxidation of Alkylbenzenes to Benzoic Acid", ["OXIDATION"], "Any Alkyl Chain with an α-H Collapses to -COOH", "C_6H_5-CH_2R + [O] \\xrightarrow{KMnO_4/OH^-,\\ then\\ H_3O^+} C_6H_5-COOH", "Hot alkaline permanganate chews right through any benzylic side chain that has even one α-hydrogen, leaving behind nothing but the carboxyl group directly on the ring.", "This is a favourite trap: tert-butylbenzene, with no benzylic H at all, survives completely untouched by this exact same reagent.", "Concerted", "Reactivity order for oxidation is methylbenzene > 1° alkylbenzene > 2° alkylbenzene; any group with NO benzylic hydrogen (like tert-butyl) resists oxidation entirely, since there's no C-H bond available at the position being attacked."],
            ["Ortho Effect on Benzoic Acid Acidity", ["RXN"], "Steric + Intramolecular H-Bonding Boosts o-Substituted Acids", "o\\text{-}X\\text{-}C_6H_4\\text{-}COOH > p\\text{-}X\\text{-}C_6H_4\\text{-}COOH\\ (regardless\\ of\\ X's\\ electronic\\ nature)", "A substituent sitting right next to -COOH stabilises the carboxylate anion through intramolecular hydrogen bonding or steric twisting, no matter whether it's normally electron-donating or -withdrawing.", "Salicylic acid (o-hydroxybenzoic acid) is the classic example, its ortho -OH locks into an intramolecular H-bond with the carboxylate, making it far more acidic than para-hydroxybenzoic acid.", "Concerted", "Called the 'ortho effect'; unusually, it makes ortho-substituted benzoic acids MORE acidic than their meta or para isomers even when the substituent (like -OH, an electron donor) would normally be expected to decrease acidity."],
            ["Fischer Esterification Mechanism", ["RXN"], "Acid-Catalysed Nucleophilic Acyl Substitution", "R-COOH + R'OH \\xrightleftharpoons[H_2O]{Conc.\\ H_2SO_4} R-COOR' + H_2O", "Protonating the carbonyl first makes it electrophilic enough for the alcohol to attack, and after a proton shuffle water leaves to reveal the ester.", "Steric bulk near either the -OH of the acid or the alcohol slows this reaction sharply, which is why bulky acids and alcohols both esterify more sluggishly.", "Carbocation", "Reactivity order for BOTH the alcohol and the acid follows CH3- > 1° > 2° > 3° due to increasing steric bulk near the reacting center; the mechanism is reversible, so excess alcohol or removal of water drives it toward ester."],
            ["Comparison of Acid Chloride-Forming Reagents", ["PREP"], "SOCl2 Preferred for Clean Gaseous Byproducts", "R-COOH \\xrightarrow{SOCl_2} R-COCl + SO_2\\uparrow + HCl\\uparrow\\ \\ (cf.\\ PCl_5 \\to +POCl_3+HCl;\\ \\ PCl_3 \\to +H_3PO_3)", "Thionyl chloride is the go-to choice precisely because both byproducts escape as gas, leaving pure acid chloride behind without any separation headache.", "PCl5 and PCl3 both work too, but their byproducts (POCl3, H3PO3) are liquids or solids that have to be separated from the product afterward.", "Concerted", "SOCl2 is the preferred laboratory reagent for exactly this reason, gaseous SO2 and HCl simply bubble away, giving the cleanest, easiest-to-purify acid chloride."],
            ["Formation of Cyclic Anhydrides from Dicarboxylic Acids", ["PREP","CONDENSATION"], "Intramolecular Dehydration to 5/6-Membered Rings", "HOOC-(CH_2)_n-COOH \\xrightarrow{\\Delta\\ or\\ P_2O_5} \\text{cyclic anhydride (5- or 6-membered)} + H_2O", "Heat alone, or a dehydrating agent like P2O5, is enough to coax a 1,4- or 1,5-dicarboxylic acid to close up into a stable 5- or 6-membered cyclic anhydride.", "Succinic acid gives succinic anhydride and phthalic acid gives phthalic anhydride this way, both are textbook examples of ring sizes that form easily on simple heating.", "Concerted", "Only dicarboxylic acids positioned to form a 5- or 6-membered ring cyclize this easily on heating (succinic → succinic anhydride, phthalic → phthalic anhydride); acids that would need to close a strained ring instead just lose water intermolecularly."],
            ["Schmidt Reaction of Carboxylic Acids", ["REARRANGEMENT"], "R-COOH to R-NH2, Losing CO2 Directly", "R-COOH + HN_3 \\xrightarrow{Conc.\\ H_2SO_4,\\ 90^\\circ C} R-NH_2 + N_2 + CO_2", "Hydrazoic acid attacks the protonated carboxylic acid, and after losing water and nitrogen the alkyl group migrates to nitrogen just as in Curtius, only here CO2 escapes directly instead of via a separate hydrolysis step.", "This is the carboxylic-acid version of the isocyanate-rearrangement family, functionally equivalent to Curtius but starting one oxidation level lower down (acid instead of acyl azide).", "Carbocation", "Distinguished from the Curtius reaction by its starting material: Curtius starts from an acyl azide (via acid chloride + NaN3), while Schmidt reacts the free carboxylic acid directly with hydrazoic acid (HN3) in conc. H2SO4; both funnel through the same alkyl isocyanate intermediate."],
            ["Reaction of Acid with Excess Organometallic Reagent", ["RXN"], "RCOOH + 2 RMgX/RLi to Ketone (After Hydrolysis)", "R-COOH + 2R'MgX \\rightarrow R-COOMgX + R'H\\ (1st\\ eq.\\ wasted)\\ \\xrightarrow{2nd\\ eq.,\\ then\\ H_3O^+} R-CO-R'\\ (ketone)", "The first equivalent of Grignard is simply sacrificed, deprotonating the acidic -COOH to its unreactive magnesium salt, only the second equivalent actually adds to the carbonyl.", "This is a classic exam trap: forgetting that carboxylic acids need TWO equivalents of Grignard (one wasted as an acid-base reaction) leads to predicting the wrong product ratio.", "Carbanion", "Requires a full 2 equivalents of the organometallic reagent, the first is consumed unproductively neutralising the acidic proton, and only the second equivalent performs the actual nucleophilic addition to give the ketone (after aqueous workup) or tertiary alcohol with excess reagent."],
            ["Hell-Volhard-Zelinsky Reaction (Full Mechanism)", ["RXN","PREP"], "Red P/Br2 Route to α-Halo Acids", "R-CH_2-COOH \\xrightarrow[Br_2]{Red\\ P} R-CHBr-COOH", "Red phosphorus first converts a little of the acid to its acid bromide, which enolises far more readily than the parent acid, letting bromine attack cleanly at the alpha carbon.", "The reaction doesn't stop at one substitution if excess Br2 is used, it keeps brominating every alpha-hydrogen until none are left, exactly like the haloform reaction's exhaustive halogenation logic.", "Carbanion", "The true reactive species is the acid BROMIDE, not the free acid, red phosphorus generates catalytic amounts of PBr3 in situ, which converts -COOH to the far more easily enolisable -COBr; the alpha-halo product is hugely versatile for making amino acids, hydroxy acids, and unsaturated acids by further substitution."],
            ["Decarboxylation of β-Keto Acids", ["RXN"], "Six-Membered Cyclic Transition State", "R-CO-CH_2-COOH \\xrightarrow{\\Delta,\\ 100-150^\\circ C} R-CO-CH_3 + CO_2", "The carboxyl's own -OH proton reaches back to hydrogen-bond with the ketone oxygen, forming a comfortable six-membered ring that lets CO2 leave without ionising to a high-energy carbanion.", "This unusually mild decarboxylation, no strong base needed, is the reason beta-keto esters are hydrolysed and decarboxylated so easily in classic malonic ester and acetoacetic ester syntheses.", "Concerted", "Decarboxylates far more readily than an ordinary carboxylic acid because the six-membered cyclic transition state avoids ever forming a bare, unstabilised carbanion; the departing CO2 leaves behind a resonance-stabilised enolate that simply tautomerises to the ketone."],
            ["Thermal Behaviour of α, β, and γ-Hydroxy Acids", ["RXN","CONDENSATION"], "Lactide vs Unsaturated Acid vs Lactone", "\\alpha\\text{-hydroxy acid} \\xrightarrow{\\Delta} Lactide\\ (cyclic\\ diester)\\ \\ ;\\ \\ \\beta\\text{-hydroxy acid} \\xrightarrow{\\Delta} \\alpha,\\beta\\text{-unsaturated acid}\\ \\ ;\\ \\ \\gamma\\text{-hydroxy acid} \\xrightarrow{\\Delta} \\gamma\\text{-lactone}", "Each hydroxy acid takes a completely different exit on heating depending purely on how far the -OH sits from -COOH, intermolecular ester dimer, simple dehydration, or intramolecular ring closure.", "Only the gamma (and delta) hydroxy acids can close into a strain-free 5- or 6-membered lactone directly; the alpha and beta cases are geometrically forced into different pathways entirely.", "Concerted", "A favourite 'identify the product from hydroxy acid position' exam question: alpha gives a cyclic DIESTER (lactide, two molecules combine), beta gives elimination to an unsaturated acid (no ring possible), and gamma/delta give an intramolecular LACTONE (one molecule, ring closure)."],
            ["Oxidative Chain Degradation of Carboxylic Acids (H2O2 / SeO2)", ["OXIDATION"], "β-Oxidation (H2O2) vs α-Oxidation (SeO2)", "R-CH_2-CH_2-COOH \\xrightarrow{H_2O_2} R-CH(OH)-CH_2-COOH\\ (\\beta)\\ \\ ;\\ \\ R-CH_2-COOH \\xrightarrow{SeO_2} R-CO-COOH\\ (\\alpha\\text{-}keto\\ acid)", "Hydrogen peroxide picks off a hydrogen two carbons down the chain (beta) to install a hydroxyl there, while selenium dioxide instead oxidises the very next carbon (alpha) all the way to a ketone.", "These reagent-controlled regioselective oxidations mirror biological beta-oxidation of fatty acids, a reminder that lab reagents can sometimes echo real metabolic pathways.", "Free Radical", "Two clearly distinct reagent-controlled oxidations worth memorising as a pair: H2O2 attacks specifically at the beta carbon (giving a beta-hydroxy acid), while SeO2 attacks specifically at the alpha carbon (giving an alpha-keto acid)."],
            ["Abnormal Reducing Behaviour of Formic Acid", ["TEST"], "The Only Carboxylic Acid That Reduces Tollens'/Fehling's", "HCOOH + Ag_2O \\xrightarrow{Tollens'} CO_2 + H_2O + 2Ag\\downarrow\\ (silver\\ mirror)\\ \\ ;\\ \\ HCOOH + 2CuO \\xrightarrow{Fehling's} CO_2 + H_2O + Cu_2O\\downarrow(red)", "Formic acid secretly still has an aldehyde-like H-C=O fragment hiding inside its structure, which is exactly what lets it reduce the same reagents that normal carboxylic acids can never touch.", "This single structural quirk, being simultaneously an acid AND an aldehyde, explains every one of formic acid's unusual reactions: Tollens', Fehling's, and even decolourising acidic KMnO4/HgCl2.", "Concerted", "The ONLY simple carboxylic acid that gives a positive Tollens' test, positive Fehling's test, and forms a white-then-grey mercury precipitate with HgCl2 (2HCOOH + HgCl2 → 2CO2 + Hg2Cl2↓ + 2HCl); all other carboxylic acids are completely unreactive toward these tests."],
            ["Basicity/Leaving-Group Order Among Acid Derivatives", ["RXN"], "Cl– Weakest Base = Best Leaving Group = Most Reactive", "\\text{Reactivity: } R\\text{-}COCl > (R\\text{-}CO)_2O > R\\text{-}COOR' > R\\text{-}CONH_2\\ \\ (\\text{basicity of leaving group: } Cl^- < RCOO^- < RO^- < NH_2^-)", "The weaker a base the leaving group is, the more willingly it departs, and Cl- is by far the weakest base of the bunch, making acyl chlorides the most reactive acid derivative toward any nucleophile.", "This single basicity-of-leaving-group rule explains the entire reactivity ladder in one shot: acyl chloride > anhydride > ester > amide, exactly the order seen throughout nucleophilic acyl substitution chemistry.", "Concerted", "This reactivity order also predicts INTERCONVERSION direction: a more reactive derivative (acyl chloride) can always be converted to a less reactive one (ester, amide) directly, but the reverse conversion generally cannot be done directly and needs to go back through the free acid."],
            ["Acyl Chloride + KCN to α-Keto Acid", ["RXN"], "Cyanide Addition then Hydrolysis to Pyruvic-Acid-type Product", "R-COCl + KCN \\rightarrow R-CO-CN \\xrightarrow{H_3O^+} R-CO-COOH\\ (\\alpha\\text{-}keto\\ acid)", "Cyanide first substitutes chloride to give an acyl cyanide, and acidic hydrolysis of that nitrile then unmasks a second carboxyl group sitting right next to the original carbonyl.", "This two-step sequence is a neat way to convert any acid chloride directly into its corresponding alpha-keto acid, exactly the kind of transformation that shows up in pyruvic-acid-style synthesis questions.", "Carbanion", "A clean two-step route from an acid chloride straight to the corresponding alpha-keto acid (e.g. from acetyl chloride to pyruvic acid), going through an isolable acyl cyanide intermediate."],
            ["Acyl Chloride + AgNO3 (Reactivity Test)", ["TEST"], "Instant White Precipitate Confirms Acid Chloride", "R-COCl + AgNO_3 + H_2O \\rightarrow R-COOH + AgCl\\downarrow(white) + HNO_3", "Acyl chlorides are so reactive toward water that aqueous silver nitrate immediately throws down a white AgCl precipitate, a much faster reaction than any ordinary alkyl halide would give.", "This fast hydrolysis is itself diagnostic: it's one of the easiest qualitative ways to confirm you're holding an acid chloride rather than a more sluggish alkyl halide or a stable ester.", "Concerted", "The reaction is essentially instantaneous at room temperature (unlike simple alkyl halides with AgNO3, which may need heating), reflecting just how much more electrophilic the acyl carbon is compared to an sp3 alkyl halide carbon."],
            ["Transesterification of Esters", ["RXN"], "Acid- or Base-Catalysed Alkoxy Group Exchange", "R-COOR' + R''OH \\xrightleftharpoons{H^+\\ or\\ OH^-} R-COOR'' + R'OH", "One alcohol simply swaps places with another on the ester's oxygen, driven forward by using a large excess of the new alcohol or by distilling off the alcohol being displaced.", "This is exactly how many natural oils and fats (triglyceride esters) get converted industrially into biodiesel, swapping glycerol for methanol as the ester's alkoxy partner.", "Carbocation", "An equilibrium reaction; it must be pushed toward the desired product by using a large excess of the new alcohol or by continuously removing the displaced alcohol (often the more volatile one) from the reaction mixture."],
            ["Ester + Excess Grignard/Organolithium to 3° Alcohol", ["RXN"], "Two Sequential Additions via a Ketone Intermediate", "R-COOR' + 2R''MgX \\rightarrow R-C(R'')_2-OMgX + R'OMgX \\xrightarrow{H_3O^+} R-C(R'')_2-OH\\ (3^\\circ\\ alcohol)", "The first equivalent of Grignard kicks out the alkoxide to leave a ketone in situ, and a second equivalent then adds to that freshly formed ketone to build the fully substituted tertiary alcohol.", "Two of the three groups on the final tertiary alcohol carbon are always identical here (both delivered by the same Grignard reagent), a tell-tale symmetry pattern useful for reverse-engineering synthesis problems.", "Carbanion", "Requires 2 equivalents of the organometallic reagent (unlike a ketone, which needs only 1); the tertiary alcohol product always has two IDENTICAL R'' groups since both additions come from the same Grignard reagent."],
            ["Acyloin Condensation of Esters", ["CONDENSATION"], "Na/Xylene Route to α-Hydroxy Ketones", "2R-CH_2-COOR' \\xrightarrow{Na/Xylene} R-CH_2-CO-CH(OH)-R\\ (acyloin) + 2R'OH", "Sodium metal donates electrons to two ester molecules, which dimerise and eliminate both alkoxide groups before a final tautomerisation delivers the alpha-hydroxy ketone product.", "This is the ester-specific cousin of the Dieckmann and Claisen condensations, but instead of a beta-keto ester it delivers a genuinely different functional group pairing, hydroxyl right next to carbonyl.", "Free Radical", "Mechanistically distinct from the Claisen/Dieckmann condensation (which gives a beta-keto ester); the acyloin condensation instead reduces both carbonyls partway and couples them directly, giving an alpha-hydroxy ketone as the final product after tautomerisation."],
            ["Dehydration of Amides to Nitriles", ["RXN"], "P2O5/PCl5/SOCl2 Strip Water from -CONH2", "R-CONH_2 \\xrightarrow{P_2O_5\\ or\\ PCl_5\\ or\\ SOCl_2} R-CN + H_2O\\ (as\\ POCl_3/HCl\\ etc.)", "Any strong dehydrating agent can pull the elements of water straight out of a primary amide, collapsing the C=O and N-H into a clean C≡N triple bond.", "This is the most direct way to go from an amide back to the nitrile it likely came from, useful in synthesis routes that shuttle between -COOH, -CONH2, and -CN as interconvertible handles.", "Concerted", "The most common way to make a nitrile from a primary amide; P2O5 is the classical reagent, though PCl5 and SOCl2 also work equally well, all functioning simply as dehydrating agents here."],
            ["Amphoteric Character of Amides", ["RXN"], "Resonance Gives Both Weak Acid and Weak Base Behaviour", "R-CONH_2 + Na \\rightarrow R-CONHNa + \\tfrac{1}{2}H_2\\ (acidic)\\ \\ ;\\ \\ R-CONH_2 + HCl \\rightarrow R-CONH_2\\cdot HCl\\ (basic)", "Resonance donates the nitrogen lone pair into the carbonyl, leaving an N-H acidic enough to lose a proton to sodium, yet that same delocalised lone pair can still grab a proton from HCl at the carbonyl oxygen.", "Amides sit right in the middle of the acid-base spectrum precisely because of this resonance, far weaker bases than amines (lone pair tied up) yet also capable of showing feeble acidity that simple amines never do.", "Concerted", "This dual reactivity comes entirely from amide resonance: the canonical form with C=N+ and O- makes the N-H mildly acidic (reacts with Na/NaNH2), while the canonical form with lone pair on N makes the carbonyl oxygen mildly basic (protonated by strong acids like HCl)."],
            ["Amide + HNO2 (Deamination Test)", ["TEST","RXN"], "Amide to Acid with Effervescence of N2", "R-CONH_2 + HONO \\rightarrow R-COOH + N_2\\uparrow + H_2O", "Nitrous acid attacks the amide nitrogen through an electrophilic NO+ species, in the end simply swapping the -NH2 for -OH and releasing nitrogen gas as visible bubbles.", "This mirrors exactly what happens when a primary aliphatic amine meets nitrous acid, both reactions replace -NH2 with -OH while fizzing out N2, a useful parallel for recognising the pattern across functional groups.", "Concerted", "Directly parallel to the reaction of 1° amines with HNO2 (which gives an alcohol + N2); here the amide's nitrogen is replaced by -OH to regenerate the parent carboxylic acid, with the same telltale nitrogen gas evolution."]
        ];

        carboxylicAcidExtra.forEach(item => {
            const isAdv = item[1].some(t => ["REARRANGEMENT","CONDENSATION"].includes(t)) || item[0].includes("Ortho Effect") || item[0].includes("Hell-Volhard") || item[0].includes("Decarboxylation of") || item[0].includes("Acyloin") || item[0].includes("Excess Organometallic") || item[0].includes("Excess Grignard");
            addR(item[0], "Carboxylic Acids & Derivatives", isAdv, item[1], item[2], item[3], item[4], item[5], item[6] + " Intermediate", item[6], "Standard Mechanism", "Alcohols / Aldehydes-Ketones / Amines / Grignard Chemistry", item[7]);
        });

        // ================= NEW: CARBOHYDRATES, AMINO ACIDS & POLYMERS (extracted from CARBOHYDRATES_AMINO_ACIDS_&_POLYMERS.pdf) =================
        // Each row: [name, tags[], typeDesc, reaction(LaTeX), mnemonic, story, intermediateType, notes]
        const carbsAminoPolymersExtra = [
            ["Preparation of Glucose from Sucrose", ["PREP"], "Acidic Hydrolysis to Equal Glucose + Fructose", "C_{12}H_{22}O_{11} + H_2O \\xrightarrow{dil.\\ HCl\\ or\\ H_2SO_4} C_6H_{12}O_6\\ (Glucose) + C_6H_{12}O_6\\ (Fructose)", "Boiling sucrose with dilute mineral acid in alcoholic solution simply hydrolyses the glycosidic bond, releasing equal amounts of its two component monosaccharides.", "This 1:1 mixture is exactly the 'invert sugar' formed during the industrial inversion of sucrose, sweeter than sucrose itself because fructose is the sweetest common sugar.", "Carbocation", "This is the classic laboratory route to glucose; the resulting equimolar glucose+fructose mixture is called invert sugar because hydrolysis flips the net optical rotation from dextro (sucrose, +66.5°) to laevo (dominated by fructose's -92°)."],
            ["Preparation of Glucose from Starch", ["PREP"], "Industrial High-Pressure Acidic Hydrolysis", "(C_6H_{10}O_5)_n + nH_2O \\xrightarrow{dil.\\ H_2SO_4,\\ 393K,\\ 2\\text{-}3\\ atm} nC_6H_{12}O_6\\ (Glucose)", "Starch's long glucose polymer chains are simply hydrolysed apart, one glycosidic bond at a time, under hot pressurised dilute sulphuric acid.", "This is the actual industrial-scale source of most commercial glucose (dextrose), far cheaper at scale than hydrolysing purified sucrose.", "Carbocation", "The industrial-scale commercial method for glucose production; the pressure and temperature (393 K, 2-3 atm) ensure complete hydrolysis of every C1-C4 glycosidic linkage along the starch chain."],
            ["Glucose Reactions Confirming Open-Chain Structure", ["TEST","RXN"], "Oxime, Cyanohydrin, Oxidation & Acetylation Evidence", "Glucose + NH_2OH \\to Oxime\\ (confirms\\ C{=}O)\\ ;\\ +HCN \\to Cyanohydrin\\ ;\\ +Br_2/H_2O \\to Gluconic\\ Acid\\ (confirms\\ -CHO)\\ ;\\ +Ac_2O \\to Pentaacetate\\ (confirms\\ 5\\ -OH)", "Each classic test isolates one structural feature: oxime and cyanohydrin formation prove a carbonyl exists, mild bromine-water oxidation proves that carbonyl is specifically an aldehyde, and pentaacetate formation counts exactly five hydroxyl groups.", "Piecing together all four results (straight 6-carbon chain from Red P/HI reduction to n-hexane, one -CHO, five -OH on different carbons) is exactly how the classical open-chain structure of glucose was first deduced.", "Concerted", "Reduction with Red P/HI giving n-hexane proves all 6 carbons are in a straight, unbranched chain; oxidation with dilute HNO3 (not just bromine water) takes glucose all the way to the dicarboxylic saccharic acid, proving the terminal CH2OH is a primary alcohol."],
            ["Anomers vs Epimers", ["RXN"], "Anomeric Carbon-Specific vs Any-Other-Carbon Stereoisomers", "\\alpha\\text{-D-glucose} \\underset{aldehydrol\\ form}{\\rightleftharpoons} \\beta\\text{-D-glucose}\\ (anomers,\\ differ\\ only\\ at\\ C1)\\ \\ ;\\ \\ D\\text{-glucose vs D-mannose (epimers, differ only at C2)}", "Anomers differ ONLY at the newly-formed hemiacetal carbon (C1 in aldoses), while epimers can differ at any other single stereocentre in the molecule, C2 by default unless another carbon is specified.", "Glucose and galactose, differing only at C4, are therefore called C-4 epimers, while alpha- and beta-D-glucose, differing only at C1, are anomers, not epimers, a distinction examiners love to test.", "Concerted", "Anomers are actually a SPECIAL CASE of epimers restricted to the anomeric (hemiacetal) carbon; every pair of anomers is technically also a pair of epimers, but not every pair of epimers qualifies as anomers."],
            ["Mutarotation of Glucose", ["RXN"], "Interconversion of α and β Anomers via Open-Chain Aldehydrol", "\\alpha\\text{-D-glucose}\\ [\\alpha]_D=+113^\\circ \\rightleftharpoons \\text{open-chain aldehydrol} \\rightleftharpoons \\beta\\text{-D-glucose}\\ [\\alpha]_D=+19.5^\\circ \\ \\ \\to\\ \\ \\text{equilibrium } [\\alpha]_D=+52.5^\\circ (36\\%\\alpha:64\\%\\beta)", "Dissolved glucose constantly flickers open and closed between its two ring forms via the free aldehyde, and the observed rotation drifts to a fixed equilibrium value as that interconversion settles down.", "This spontaneous drift in optical rotation toward a stable value is called mutarotation, and it's a dead giveaway that a sugar retains a free (or freeable) anomeric centre in solution.", "Carbocation", "All REDUCING sugars (free anomeric carbon) show mutarotation; non-reducing sugars like sucrose, where both anomeric carbons are tied up in the glycosidic bond, do NOT mutarotate since there's no open-chain form to equilibrate through."],
            ["Osazone Formation (Glucose + Excess Phenylhydrazine)", ["TEST","RXN"], "Three Equivalents Needed, Only C1-C2 Involved", "Glucose + 3\\ C_6H_5NHNH_2 \\xrightarrow{\\Delta} Glucosazone + C_6H_5NH_2 + NH_3 + 2H_2O", "The first equivalent condenses at C1 to a hydrazone, the second oxidises the adjacent C2 alcohol to a ketone (itself reduced to aniline + ammonia), and only then does a third equivalent condense at that new C2 carbonyl.", "Because only carbons C1 and C2 ever get touched, any two sugars that are identical everywhere except at those first two carbons will give the exact same osazone, glucose and fructose being the textbook pair.", "Concerted", "Glucose and fructose give an IDENTICAL osazone (since they differ only at C1/C2, exactly the carbons involved in this reaction); glucosazone is a yellow, sparingly water-soluble crystalline solid with a sharp melting point, used for sugar identification."],
            ["Glucoside (Methyl Glucoside) Formation", ["RXN"], "Acetal Formation Proves the Ring Structure", "D\\text{-Glucose} + CH_3OH \\xrightarrow{dry\\ HCl\\ gas} \\text{Methyl }\\alpha\\text{-D-glucoside} + \\text{Methyl }\\beta\\text{-D-glucoside}", "Methanol adds across the anomeric hemiacetal centre exactly like any alcohol converting a hemiacetal to a full acetal, locking the ring shut permanently as a mixed acetal (glycoside).", "Because the product no longer has a free anomeric -OH, methyl glucoside can no longer mutarotate or reduce Tollens' reagent, direct proof the free aldehyde group is genuinely gone, tied up in the ring.", "Carbocation", "A carbohydrate acetal is specifically called a glycoside (glucoside for glucose); once glycosidated, the sugar is locked as a non-reducing acetal and cannot mutarotate, exactly what happens to glucose within sucrose."],
            ["Hydrolysis of Sucrose (Inversion of Sugar)", ["RXN","TEST"], "Sign of Rotation Flips from Dextro to Laevo", "\\text{Sucrose } [\\alpha]_D=+66.5^\\circ \\xrightarrow{H^+/H_2O} \\text{D-glucose } [\\alpha]_D=+53^\\circ + \\text{D-fructose } [\\alpha]_D=-92^\\circ\\ \\ (mixture:\\ net\\ laevorotatory)", "Sucrose itself rotates light strongly clockwise, but once hydrolysed the resulting fructose's huge counter-clockwise rotation completely overwhelms glucose's modest clockwise contribution, flipping the net sign.", "This is exactly why the process is called 'inversion' of sucrose, the sign of optical rotation literally inverts from + to -, and the resulting mixture is nicknamed invert sugar.", "Carbocation", "Sucrose is NON-reducing because its glycosidic bond ties up BOTH anomeric carbons (C1 of glucose and C2 of fructose) simultaneously, unlike maltose or lactose where only one anomeric carbon is involved in the linkage."],
            ["Maltose and Lactose as Reducing Disaccharides", ["RXN"], "One Free Anomeric Carbon Retains Reducing Power", "Maltose = \\alpha\\text{-D-glucose}(1\\to4)\\text{-D-glucose (free anomeric OH at C1 of unit II)}\\ \\ ;\\ \\ Lactose = \\beta\\text{-D-galactose}(1\\to4)\\text{-D-glucose}", "Both disaccharides link only ONE of their two anomeric carbons into the glycosidic bond, leaving the second monosaccharide unit's anomeric -OH completely free to open up and reduce Tollens' or Fehling's reagent.", "This single free anomeric centre is the structural reason maltose and lactose behave as reducing sugars while sucrose, with both anomeric carbons tied up, does not.", "Concerted", "The reducing/non-reducing distinction among disaccharides comes down entirely to whether ONE or BOTH anomeric carbons are used in the glycosidic linkage; maltose and lactose (one free) are reducing, sucrose (both tied up) is not."],
            ["Starch: Amylose vs Amylopectin", ["RXN"], "Linear α(1→4) vs Branched α(1→4)+α(1→6)", "Amylose:\\ [\\alpha\\text{-D-glucose}]_{200\\text{-}1000}\\ (linear,\\ C1{-}C4\\ links\\ only)\\ \\ ;\\ \\ Amylopectin:\\ [\\alpha\\text{-D-glucose}]_n\\ (branched,\\ C1{-}C4\\ chain + C1{-}C6\\ branch\\ points)", "Amylose is simply a long unbranched chain of alpha-glucose units strung together head-to-tail, while amylopectin uses the exact same C1-C4 backbone but throws in occasional C1-C6 branch points every so often.", "Amylose's water-solubility (15-20% of starch) versus amylopectin's insolubility (80-85% of starch) directly traces back to this structural difference, unbranched chains coil into a helix that traps iodine (the blue starch-iodine test), branched ones don't as cleanly.", "Concerted", "Both amylose and amylopectin are polymers of ALPHA-D-glucose (unlike cellulose, which uses beta-glucose); amylopectin's branching occurs specifically via C1-C6 glycosidic linkages layered on top of the main C1-C4 chain."],
            ["Cellulose Structure", ["RXN"], "Linear β(1→4)-Linked D-Glucose Polymer", "[\\beta\\text{-D-glucose}]_n\\ \\text{linked C1}\\to\\text{C4}\\ \\ (straight\\ chain,\\ no\\ branching)", "Cellulose uses the beta-anomer of glucose exclusively, and that single stereochemical flip from starch's alpha-linkage is the entire reason cellulose forms rigid, indigestible-to-humans fibres instead of a digestible energy store.", "Humans lack the enzyme to cleave beta-glycosidic bonds (cellulase), which is exactly why we can digest starch for energy but not the structurally near-identical cellulose in wood and plant fibre.", "Concerted", "The single stereochemical difference between starch (alpha-glucose links) and cellulose (beta-glucose links) has enormous biological consequences: alpha-links are digestible by human amylase, beta-links are not (only certain bacteria/fungi produce cellulase)."],
            ["Amination of α-Halo Acids to Amino Acids", ["PREP"], "Excess NH3 Displaces α-Halogen", "Cl\\text{-}CH_2COOH + 2NH_3(excess) \\rightarrow H_2N\\text{-}CH_2COOH\\ (Glycine) + NH_4Cl", "A straightforward SN2 displacement swaps the alpha-halogen for an amino group, needing excess ammonia for the same reason alkyl halide ammonolysis does, to stop over-alkylation at the nitrogen.", "This is the most direct amino-acid synthesis of all, simply combine the corresponding alpha-halo acid (itself made via Hell-Volhard-Zelinsky) with concentrated ammonia.", "Concerted", "The alpha-halo acid needed here is exactly the product of the Hell-Volhard-Zelinsky reaction, so the two-step sequence (HVZ bromination, then excess NH3) is a complete, self-contained amino acid synthesis from a simple carboxylic acid."],
            ["Strecker Synthesis of Amino Acids", ["PREP"], "Aldehyde to Amino Acid via Aminonitrile", "R\\text{-}CHO + HCN + NH_3 \\rightarrow R\\text{-}CH(NH_2)\\text{-}CN \\xrightarrow{H_3O^+} R\\text{-}CH(NH_2)\\text{-}COOH", "Ammonia and cyanide both add across the aldehyde's carbonyl in sequence, giving an aminonitrile whose nitrile group is then hydrolysed straight through to the finished carboxylic acid.", "This route builds the amino acid's characteristic alpha-carbon stereocentre completely from scratch in one pot, starting from nothing more exotic than a simple aldehyde.", "Carbocation", "Proceeds through a cyanohydrin-like addition (HCN attacking the aldehyde) intercepted by ammonia to give the aminonitrile directly; acidic hydrolysis of the nitrile in the final step is mechanistically identical to any other nitrile-to-acid hydrolysis."],
            ["Zwitterion Formation of Amino Acids", ["RXN"], "Internal Proton Transfer, Not a True Neutral Molecule", "H_2N\\text{-}CHR\\text{-}COOH \\rightleftharpoons {}^+H_3N\\text{-}CHR\\text{-}COO^-\\ (Zwitterion,\\ overall\\ neutral\\ but\\ dipolar)", "The acidic -COOH proton simply hops over to the basic -NH2 group internally, no atoms gained or lost, just relocated, giving a molecule that's overall neutral yet carries both a plus and a minus charge simultaneously.", "This dipolar, salt-like character is exactly why amino acids behave like ionic solids, high melting points, water solubility, and poor solubility in typical organic solvents, quite unlike simple amines or acids.", "Concerted", "Explains why amino acids are high-melting, water-soluble crystalline SOLIDS that behave like salts rather than simple amines or carboxylic acids; at the isoelectric point the zwitterion dominates and the amino acid shows minimum solubility and does not migrate in an electric field."],
            ["Cyclic Dipeptide (Diketopiperazine) Formation", ["CONDENSATION"], "Two α-Amino Acids Lose Two Water Molecules on Heating", "2\\ H_2N\\text{-}CH_2\\text{-}COOH \\xrightarrow{\\Delta} \\text{Diketopiperazine (cyclic diamide)} + 2H_2O", "Two glycine molecules join head-to-tail not once but twice, the first amide bond forms normally, and heat then drives a second intramolecular condensation to close the six-membered diketopiperazine ring.", "This is the alpha-amino-acid-specific thermal fate, distinctly different from what happens when beta- or gamma-amino acids are heated instead.", "Concerted", "Specific to ALPHA-amino acids on heating; contrast with beta-amino acids (which lose NH3 to form an alpha,beta-unsaturated acid) and gamma-/delta-amino acids (which cyclize intramolecularly to a stable lactam) under the same thermal conditions."],
            ["Thermal Deamination of β-Amino Acids", ["RXN"], "Loss of NH3 Gives an α,β-Unsaturated Acid", "CH_2(NH_2)\\text{-}CH_2\\text{-}COOH \\xrightarrow{\\Delta,\\ -NH_3} CH_2{=}CH\\text{-}COOH\\ (Acrylic\\ acid)", "Heat simply eliminates ammonia across the beta and alpha carbons in one clean E1-type step, exactly the way heating a beta-hydroxy acid eliminates water instead.", "Beta-alanine (3-aminopropanoic acid) giving acrylic acid this way is the textbook example, direct thermal elimination rather than any cyclisation.", "Carbocation", "Mechanistically parallel to the dehydration of a beta-HYDROXY acid to an unsaturated acid, here it's dehydroammoniation (-NH3) instead of dehydration (-H2O), but the elimination logic and the alpha,beta-unsaturated acid product type are identical."],
            ["Lactam Formation from γ- and δ-Amino Acids", ["CONDENSATION"], "Intramolecular Cyclisation to Stable 5/6-Membered Rings", "H_2N\\text{-}(CH_2)_3\\text{-}COOH \\xrightarrow{\\Delta,\\ -H_2O} \\gamma\\text{-Butyrolactam (5-membered cyclic amide)}", "Sitting three or four carbons away from -COOH puts the amino group in perfect geometric reach to close a comfortable 5- or 6-membered ring directly with itself, no partner molecule required.", "This intramolecular closure to a lactam is the amino-acid mirror image of gamma-/delta-hydroxy acids closing to lactones, same ring-size logic, just swapping O for NH in the ring.", "Concerted", "Directly parallel to gamma-/delta-HYDROXY acids forming lactones; here the nitrogen nucleophile cyclises onto the carbonyl instead of oxygen, giving a lactam (cyclic amide) of the same favoured 5- or 6-membered ring size."],
            ["Peptide Bond (Amide Linkage) Formation", ["CONDENSATION"], "Carboxyl of One Amino Acid + Amino of Another", "H_2N\\text{-}CHR\\text{-}COOH + H_2N\\text{-}CHR'\\text{-}COOH \\xrightarrow{-H_2O} H_2N\\text{-}CHR\\text{-}CO\\text{-}NH\\text{-}CHR'\\text{-}COOH", "One amino acid's carboxyl condenses with a second amino acid's amino group, losing exactly one water molecule and forging the amide (peptide) bond that is the backbone of every protein.", "Because the reaction only picks one specific end from each partner, joining glycine's -COOH to alanine's -NH2 (Gly-Ala) gives a genuinely different dipeptide from joining them the other way round (Ala-Gly).", "Concerted", "The peptide bond is simply another name for an ordinary amide bond (-CO-NH-); proteins are polymers built entirely from this one repeating condensation reaction, chained together into di-, tri-, and eventually polypeptides."],
            ["Nucleotide Formation (Base + Sugar + Phosphate)", ["CONDENSATION"], "Stepwise Assembly: Nucleoside then Nucleotide", "Base + Sugar(C1') \\xrightarrow{-H_2O} Nucleoside \\xrightarrow{H_3PO_4\\ at\\ C5'} Nucleotide", "A nitrogen base first attaches to the sugar's C1' position to give a nucleoside, and phosphorylating that nucleoside's free C5'-OH then completes the full nucleotide building block.", "Nucleotides are the actual repeating monomer of DNA/RNA, so this two-step assembly (base+sugar, then +phosphate) is the biomolecular equivalent of building a single link in the polynucleotide chain.", "Concerted", "DNA uses beta-D-2-deoxyribose as its sugar while RNA uses beta-D-ribose (with an extra 2'-OH); successive nucleotides are then joined by a 3'-5' phosphodiester linkage to build the full polynucleotide chain."],
            ["Complementary Base Pairing in DNA", ["RXN"], "A–T and G–C via Specific Hydrogen Bonds", "Adenine \\cdots (2\\ H\\text{-}bonds) \\cdots Thymine\\ \\ ;\\ \\ Guanine \\cdots (3\\ H\\text{-}bonds) \\cdots Cytosine", "Purines always pair with pyrimidines across the double helix, and the specific hydrogen-bonding geometry only lets adenine match thymine and guanine match cytosine, never any other combination.", "This strict pairing rule is exactly what makes the two DNA strands complementary and lets the molecule replicate itself faithfully every time a cell divides.", "Concerted", "RNA replaces DNA's thymine with uracil (which still pairs with adenine the same way); guanine-cytosine pairing (3 H-bonds) is notably stronger than adenine-thymine pairing (only 2 H-bonds), which is why GC-rich DNA regions are harder to melt apart."],
            ["Addition (Chain-Growth) Polymerisation", ["PREP"], "Monomers Add Without Loss of Any Atoms", "n\\ CH_2{=}CH_2 \\xrightarrow{polymerisation} [-CH_2-CH_2-]_n\\ (Polythene)\\ \\ ;\\ \\ n\\ CH_2{=}CHCl \\to [-CH_2-CHCl-]_n\\ (PVC)", "Alkene monomers simply click together end to end through their own double bonds, no small molecule is ever kicked out, so the polymer's formula is just an exact multiple of the monomer's.", "Free radical, cationic, or anionic initiators can all kick off this same chain-growth process, which is why polythene, PVC, PAN, and Teflon are all made this way despite having very different monomers.", "Free Radical", "This is a chain-growth mechanism (a reactive intermediate, usually free radical, propagates the growing chain); contrast directly with condensation polymers, which are step-growth and DO eliminate a small molecule (water/alcohol) at every linking step."],
            ["Condensation (Step-Growth) Polymerisation", ["PREP","CONDENSATION"], "Nylon-6,6 and Terylene via Small-Molecule Elimination", "n\\ HOOC(CH_2)_4COOH + n\\ H_2N(CH_2)_6NH_2 \\xrightarrow{high\\ pressure} [-OC(CH_2)_4CONH(CH_2)_6NH-]_n\\ (Nylon\\text{-}6,6) + 2n\\ H_2O", "Adipic acid's two -COOH ends condense with hexamethylenediamine's two -NH2 ends over and over, releasing a water molecule at every single new amide bond formed along the growing chain.", "Terylene (Dacron) is built the exact same step-growth way but through ester linkages instead of amide ones, condensing terephthalic acid (or its dimethyl ester) with ethylene glycol.", "Concerted", "Both monomers here are BIFUNCTIONAL (two reactive ends each), which is essential for step-growth polymerisation to build a long chain at all; Nylon-6,6 is a polyamide while Terylene/Dacron is a polyester, both are copolymers since they use two different monomers."],
            ["Ring-Opening Polymerisation of Caprolactam (Nylon-6)", ["PREP"], "Single Cyclic Monomer Opens to a Linear Polyamide", "n\\ \\text{Caprolactam (cyclic amide)} \\xrightarrow{prolonged\\ heating,\\ 540K} [-NH-(CH_2)_5-CO-]_n\\ (Nylon\\text{-}6)", "Prolonged heating simply pops open caprolactam's strained 7-membered lactam ring and strings the opened units together end to end into one long linear polyamide chain.", "Unlike Nylon-6,6 (which needs two different bifunctional monomers), Nylon-6 needs only ONE monomer since the ring itself already contains both the amine and carbonyl functionality needed for chain growth.", "Concerted", "Unlike Nylon-6,6, Nylon-6 is technically a HOMOPOLYMER (built from just one type of monomer, caprolactam) even though it forms via a ring-opening mechanism rather than simple addition; also known as Perlon in Germany."],
            ["Phenol-Formaldehyde Condensation (Bakelite)", ["PREP","CONDENSATION"], "Thermosetting Cross-Linked Resin", "n\\ C_6H_5OH + n\\ HCHO \\xrightarrow{H^+\\ or\\ OH^-} \\text{Novolac/Resol (linear prepolymer)} \\xrightarrow{\\Delta} \\text{Bakelite (3-D cross-linked network)}", "Formaldehyde first links phenol rings together through their ortho/para positions into a soft linear prepolymer, and further heating then cross-links those chains into a rigid three-dimensional network.", "Because it's genuinely cross-linked in three dimensions, Bakelite becomes permanently hard on curing and can never be re-softened by heating again, the defining property of any thermosetting resin.", "Carbocation", "A classic THERMOSETTING polymer (hardens irreversibly on heating, unlike a thermoplastic which softens reversibly); the phenol ring's ortho/para positions (activated by -OH) are exactly where formaldehyde's electrophilic carbon attacks during the cross-linking step."],
            ["Urea-Formaldehyde and Melamine-Formaldehyde Resins", ["PREP","CONDENSATION"], "Nitrogen-Based Thermosetting Copolymers", "n\\ H_2N\\text{-}CO\\text{-}NH_2 + n\\ HCHO \\xrightarrow{\\Delta} \\text{Urea-formaldehyde resin (cross-linked)}", "Formaldehyde bridges together the multiple N-H groups of urea (or the even more numerous N-H groups of melamine) exactly the same way it bridges phenol rings, just swapping the aromatic partner for a nitrogen-rich one.", "Melamine-formaldehyde, with even more reactive N-H sites available on the triazine ring than urea has, tends to give a still harder, more heat- and scratch-resistant thermosetting surface.", "Concerted", "Both are thermosetting resins built by the exact same formaldehyde-bridging logic as Bakelite, just using a nitrogen-containing monomer (urea or melamine) instead of phenol as the second component."],
            ["Polyester Formation (Terylene/Dacron)", ["PREP","CONDENSATION"], "Diacid + Diol Step-Growth Copolymer", "n\\ CH_3OOC\\text{-}C_6H_4\\text{-}COOCH_3 + n\\ HOCH_2CH_2OH \\xrightarrow{\\Delta} [-OC\\text{-}C_6H_4\\text{-}CO\\text{-}OCH_2CH_2O-]_n\\ (Terylene) + 2n\\ CH_3OH", "Dimethyl terephthalate's two ester groups undergo repeated transesterification with ethylene glycol's two hydroxyls, kicking out methanol at every linkage instead of water.", "Terylene's fibre-forming strength comes from exactly the kind of regular hydrogen-bonding-free but tightly-packed chain structure that also gives Nylon its characteristic 'fibre' classification.", "Concerted", "Also known as Dacron, Terene, or Mylar depending on the application; this is a classic step-growth COPOLYMER (two different bifunctional monomers), and its formation is really a repeated transesterification rather than a Fischer esterification."],
            ["Poly Methyl Methacrylate (PMMA / Perspex) Formation", ["PREP"], "Addition Homopolymer with a Pendant Ester Group", "n\\ CH_2{=}C(CH_3)COOCH_3 \\xrightarrow{polymerisation} [-CH_2-C(CH_3)(COOCH_3)-]_n\\ (PMMA)", "The methacrylate double bond simply opens up and adds monomer after monomer in a straightforward chain-growth process, exactly like polythene but carrying a bulky ester group along for the ride on every repeat unit.", "PMMA's clarity and shatter-resistance (used as Perspex/Plexiglas) come precisely from being a purely linear, non-crystalline addition homopolymer with no cross-linking at all.", "Free Radical", "Despite containing an ester functional group in every repeat unit, PMMA is formed by ADDITION (chain-growth) polymerisation through the C=C double bond, not by any condensation/esterification process, a common point of confusion."]
        ];
