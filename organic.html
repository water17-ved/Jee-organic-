        const purificationAnalysisExtra = [
            ["Simple Distillation", ["PREP"], "Non-Volatile Impurity Removal / Large B.P. Gap Separation", "\\text{Liquid + Non-volatile Impurity} \\xrightarrow{\\Delta} \\text{Pure Distillate} + \\text{Residue}", "If two liquids boil 80 degrees C or more apart, one flask and one condenser is all you need.", "Chloroform (334K) and aniline (457K) sit far enough apart on the boiling scale that simple distillation cleanly separates them without a fractionating column.", "Concerted", "Used when the boiling point difference is 80 K or more, or when the sample carries non-volatile impurities (e.g., purifying water from dissolved salts)."],
            ["Fractional Distillation", ["PREP"], "Close B.P. Separation via Repeated Vaporisation-Condensation", "\\text{Mixture of Miscible Liquids} \\xrightarrow{\\text{Fractionating Column}} \\text{Sequential Fractions by B.P.}", "A fractionating column is just many simple distillations stacked in one glass tower.", "Crude oil is separated into petrol, kerosene, and diesel cuts this way; acetone (329K) and methanol (338K), only 9 K apart, still separate cleanly through the column's repeated condensation-vaporisation cycles.", "Concerted", "Applied when the boiling point difference is as small as about 10 K; the column's glass beads/rings provide surface area for repeated equilibration between vapour and liquid."],
            ["Vacuum (Reduced Pressure) Distillation", ["PREP"], "Lowering B.P. to Avoid Thermal Decomposition", "\\text{Heat-Sensitive Liquid} \\xrightarrow{\\text{Reduced Pressure}} \\text{Distillate at Lower B.P.}", "Suck the air out and the liquid boils at a friendlier, cooler temperature.", "Glycerol, which decomposes if boiled at its normal atmospheric boiling point, distils safely under vacuum; concentrating sugar juice and recovering glycerol from spent lye both rely on this trick.", "Concerted", "Essential for any compound that boils only at a temperature above its own decomposition point at 1 atm; lowering pressure always lowers the boiling point."],
            ["Steam Distillation", ["PREP"], "Codistillation of Water-Immiscible, Steam-Volatile Liquids", "P_{total} = P^{\\circ}_{organic} + P^{\\circ}_{water}", "Two immiscible liquids team up: together their vapour pressures add, so the mixture boils below either liquid's own boiling point.", "Aniline, turpentine oil, nitrobenzene, bromobenzene, naphthalene, and o-nitrophenol are all steam-volatile compounds purified this way, distilling over at a temperature below 373 K.", "Concerted", "Only works for substances immiscible with water and reasonably volatile at 373 K; a mixture of ortho- and para-nitrophenol is classically separated because the more volatile, intramolecularly H-bonded ortho isomer steam-distils out first."],
            ["Lassaigne's Sodium Fusion Extract", ["TEST"], "Converting Covalent N/S/X/P into Detectable Ionic Sodium Salts", "\\text{Organic Compound} + Na \\xrightarrow{\\Delta} NaCN,\\ Na_2S,\\ NaX\\ (\\text{Sodium Fusion Extract})", "Fusing with red-hot sodium metal smashes covalent N, S, and halogen bonds into simple ionic sodium salts you can test in water.", "This single fused extract is the master key: the same aqueous filtrate goes on to give three completely different confirmatory colour tests for nitrogen, sulphur, and halogens.", "Concerted", "If N and S are both present, sodium thiocyanate (NaCNS) forms instead of separate NaCN and Na2S, which changes the nitrogen test's colour outcome (see the N+S test card)."],
            ["Test for Nitrogen (Prussian Blue Test)", ["TEST"], "Sodium Extract + FeSO4/FeCl3 gives Ferric Ferrocyanide", "NaCN + FeSO_4 \\xrightarrow{boil,\\ FeCl_3/HCl} Fe_4[Fe(CN)_6]_3\\ (\\text{Prussian/Turnbull's Blue})", "Cyanide plus iron(II), boiled and then acidified with iron(III), paints the solution Prussian blue.", "Boiling the sodium extract with FeSO4 first forms sodium ferrocyanide; adding FeCl3 and conc. HCl then precipitates the deep blue-green complex that confirms nitrogen.", "Concerted", "A blue or green colour confirms nitrogen; no colour change means nitrogen is absent from the original organic compound."],
            ["Test for Sulphur (Nitroprusside & Lead Acetate Tests)", ["TEST"], "Two Independent Confirmatory Colour Tests", "Na_2S + Na_2[Fe(CN)_5NO] \\rightarrow \\text{Deep Violet}\\ \\ ;\\ \\ Na_2S + (CH_3COO)_2Pb \\rightarrow PbS\\downarrow(\\text{black})", "Sodium sulphide turns sodium nitroprusside violet, and turns lead acetate solution black, two independent confirmations for the price of one extract.", "Either the violet colour with nitroprusside or the black lead sulphide precipitate alone is enough to confirm sulphur is present in the original compound.", "Concerted", "The nitroprusside test is far more sensitive and is usually done first; acetic acid is added before the lead acetate test to prevent interference from other anions."],
            ["Test for Halogens (Silver Nitrate Test)", ["TEST"], "Precipitate Colour and Ammonia Solubility Distinguish Cl/Br/I", "NaX + HNO_3 + AgNO_3 \\rightarrow AgX\\downarrow + NaNO_3", "White dissolves, pale-yellow half-dissolves, and yellow won't dissolve at all, in aqueous ammonia.", "A white precipitate that fully dissolves in dilute ammonia confirms chlorine; a pale yellow one that only partly dissolves confirms bromine; a yellow one that stays put confirms iodine.", "Concerted", "Dilute HNO3 is always added first to destroy any NaCN or Na2S present, since CN- and S2- also give precipitates with AgNO3 that would give a false-positive halogen test."],
            ["Test for Nitrogen and Sulphur Together (Thiocyanate Test)", ["TEST"], "Blood-Red Colour Overrides the Simple Nitrogen Test", "Na + C + N + S \\xrightarrow{\\Delta} NaCNS\\ (\\text{Sodium Thiocyanate})", "When N and S are both on board, they fuse together into thiocyanate, and the usual Prussian blue test turns blood-red instead.", "This blood-red coloration (instead of the blue/green of the plain nitrogen test) is itself the diagnostic signal that both nitrogen and sulphur are present in the same molecule.", "Concerted", "A classic JEE trap: if a compound gives a blood-red colour instead of Prussian blue in the nitrogen test, sulphur must also be present, don't just conclude nitrogen is absent."],
            ["Test for Phosphorus (Ammonium Molybdate Test)", ["TEST"], "Yellow Ammonium Phosphomolybdate Precipitate", "P \\xrightarrow{Na_2O_2,\\ boil} Na_3PO_4 \\xrightarrow{HNO_3,\\ (NH_4)_2MoO_4} \\text{Yellow Precipitate}", "Fusing with sodium peroxide (not sodium metal alone) oxidises phosphorus all the way to phosphate, which then turns ammonium molybdate solution canary yellow.", "The yellow precipitate of ammonium phosphomolybdate is the unambiguous confirmatory colour for phosphorus in an organic compound.", "Concerted", "Requires the more oxidising Na2O2 fusion rather than the standard Lassaigne sodium fusion, since phosphorus must be pushed all the way to the +5 phosphate state."],
            ["Liebig's Combustion Method (C and H Estimation)", ["TEST"], "Quantitative % C and % H via CO2/H2O Absorption", "\\%C = \\frac{12 \\times m(CO_2)}{44 \\times m(sample)} \\times 100\\ \\ ;\\ \\ \\%H = \\frac{2 \\times m(H_2O)}{18 \\times m(sample)} \\times 100", "Burn it over hot CuO, catch the water in one tube and the carbon dioxide in the next, then weigh the gain.", "Anhydrous CaCl2 traps water first, then KOH traps the carbon dioxide that follows, giving two separate weight gains to plug into the two formulas.", "Concerted", "If nitrogen is present, heated copper gauze reduces oxides of nitrogen to N2 gas (which KOH won't absorb); if halogens are present, silver gauze traps them; if sulphur is present, lead chromate retains the sulphur oxides."],
            ["Duma's Method (Nitrogen Estimation)", ["TEST"], "Volumetric Estimation of Nitrogen Gas at NTP", "\\%N = \\frac{28 \\times V_{N_2}\\ (\\text{at NTP})}{22400 \\times m(compound)} \\times 100", "Every other combustion product gets scrubbed away by hot copper and KOH, leaving pure nitrogen gas to measure by volume.", "The sample is burned with CuO, the resulting oxides of nitrogen are reduced to N2 gas over hot copper gauze, and the pure nitrogen collected over KOH solution is measured at NTP.", "Concerted", "Works for ALL nitrogen-containing organic compounds, including nitro and azo compounds and ring nitrogen (pyridine), unlike Kjeldahl's method which fails on exactly those cases."],
            ["Kjeldahl's Method (Nitrogen Estimation)", ["TEST"], "Acid Digestion to (NH4)2SO4, then Back-Titration", "\\text{Organic-N} \\xrightarrow{Conc.\\ H_2SO_4,\\ K_2SO_4,\\ CuSO_4} (NH_4)_2SO_4 \\xrightarrow{KOH,\\ \\text{absorb in std. acid}} \\%N = \\frac{1.4\\, N\\, V}{m(compound)}", "Cook the sample in boiling sulphuric acid until every nitrogen atom ends up trapped as ammonium sulphate, then chase the ammonia out with alkali and titrate it.", "K2SO4 raises the boiling point of the acid for a faster digestion, and CuSO4 acts as the catalyst that speeds the whole conversion along.", "Concerted", "Fails completely for nitro compounds, azo compounds (-N=N-), and ring nitrogen (pyridine, quinoline), since none of these convert quantitatively to ammonium sulphate; best suited for foodstuffs, soil, and fertiliser nitrogen analysis."],
            ["Carius Method - Sulphur Estimation", ["TEST"], "Oxidation to BaSO4, Gravimetric Determination", "\\text{Organic-S} \\xrightarrow{fuming\\ HNO_3,\\ BaCl_2} BaSO_4\\downarrow \\ \\ ;\\ \\ \\%S = \\frac{32 \\times m(BaSO_4)}{233 \\times m(compound)} \\times 100", "Fuming nitric acid burns sulphur all the way up to sulphate, which barium chloride then locks away as a weighable white precipitate.", "The compound and fuming HNO3 are sealed together in a hard-glass Carius tube and heated, brutal enough conditions to fully oxidise even the most stubborn sulphur-containing functional groups.", "Concerted", "The same sealed-tube Carius digestion strategy is reused for halogen and phosphorus estimation too, just trapping the product as AgX or Mg2P2O7 instead of BaSO4."],
            ["Carius Method - Halogen Estimation", ["TEST"], "Oxidation to AgX, Gravimetric Determination", "\\text{Organic-X} \\xrightarrow{fuming\\ HNO_3,\\ AgNO_3} AgX\\downarrow", "Same fuming-nitric-acid Carius digestion, but this time silver nitrate is the trapping agent instead of barium chloride.", "Percent chlorine, bromine, and iodine each get their own dedicated formula (using AgCl, AgBr, or AgI's respective molar masses) once the precipitate is dried and weighed.", "Concerted", "Formulas: %Cl = 35.5(mass AgCl)/143.3(mass compound) x 100; %Br = 80(mass AgBr)/188(mass compound) x 100; %I = 127(mass AgI)/235(mass compound) x 100."],
            ["Carius Method - Phosphorus Estimation", ["TEST"], "Oxidation to Mg2P2O7, Gravimetric Determination", "\\text{Organic-P} \\xrightarrow{fuming\\ HNO_3,\\ Magnesia\\ Mixture} Mg_2P_2O_7\\downarrow \\ \\ ;\\ \\ \\%P = \\frac{62 \\times m(Mg_2P_2O_7)}{222 \\times m(compound)} \\times 100", "Magnesia mixture (MgSO4 + NH4OH + NH4Cl) precipitates phosphate as magnesium ammonium phosphate, which is then ignited down to the stable pyrophosphate for weighing.", "Igniting MgNH4PO4 drives off ammonia and water, condensing two formula units into one weighable Mg2P2O7 unit, exactly why the formula uses 62/222 rather than a 1:1 ratio.", "Concerted", "The precipitate MgNH4PO4 must be ignited (heated strongly) to convert it into Mg2P2O7 before the final weighing, this ignition step is what the 222 g/mol denominator in the formula accounts for."],
            ["Estimation of Oxygen (by Difference)", ["TEST"], "Indirect Calculation, No Direct Formula", "\\%O = 100 - [\\%C + \\%H + \\%N + \\%S + \\%X + \\%P + \\ldots]", "Oxygen is the one element with no direct gravimetric or volumetric method of its own, so it's simply whatever percentage is left over.", "Once every other element in the compound has been estimated and summed, oxygen's percentage is found purely by subtracting that sum from 100.", "Concerted", "A direct method for oxygen estimation does exist (Aluise's method, 1947), but it is rarely used in practice; the by-difference approach remains the standard exam technique."]

        const isomerismExtra = [
            ["Chain Isomerism", ["ISOM"], "Same Functional Group, Different Carbon Skeleton", "C_4H_{10}:\\ CH_3CH_2CH_2CH_3\\ (n\\text{-butane}) \\ \\ vs \\ \\ (CH_3)_3CH\\ (isobutane)", "Same atoms, same functional group, same locant, but the carbon skeleton itself is rearranged, straight chain versus branched.", "Butane and isobutane share the molecular formula C4H10 exactly, yet differ only in how the four carbons link together.", "Configurational Isomer", "Minimum 4 carbons needed for chain isomerism in alkanes; C6H14 has 5 chain isomers, C7H16 has 9."],
            ["Position Isomerism", ["ISOM"], "Same Skeleton and Functional Group, Different Locant", "CH_3CH_2CH_2CH_2OH\\ (1\\text{-butanol}) \\ \\ vs \\ \\ CH_3CH_2CH(OH)CH_3\\ (2\\text{-butanol})", "The parent chain and functional group both stay identical, only the numbered position on the chain moves.", "1-Butanol and 2-butanol are built from the exact same 4-carbon backbone; the -OH has simply slid from carbon 1 to carbon 2.", "Configurational Isomer", "Minimum 4 carbons needed for position isomerism in alcohols/haloalkanes, but a minimum of 6 carbons is needed for it to appear in simple alkanes."],
            ["Ring-Chain Isomerism", ["ISOM"], "Same Formula, Open-Chain vs Cyclic Structure", "CH_2{=}CH{-}CH_2{-}CH_3\\ (\\text{1-butene, open chain}) \\ \\ vs \\ \\ \\text{cyclobutane (closed ring)}", "Snip open a ring and you get a chain with one extra degree of unsaturation moved into a double bond, same formula either way.", "Alkenes pair up with cycloalkanes, and alkadienes pair up with cycloalkenes, as classic ring-chain isomer partners, and every ring-chain isomer pair is automatically a functional isomer pair too.", "Configurational Isomer", "A ring counts as one degree of unsaturation, exactly like one pi bond, which is why converting a ring to a chain always requires introducing one new double bond to keep the formula unchanged."],
            ["Functional Isomerism", ["ISOM"], "Same Formula, Completely Different Functional Group", "C_2H_6O:\\ CH_3CH_2OH\\ (ethanol) \\ \\ vs \\ \\ CH_3{-}O{-}CH_3\\ (\\text{dimethyl ether})", "Same atom count, same molecular formula, but a totally different functional group entirely, alcohol versus ether is the classic case.", "Aldehydes pair with ketones, acids pair with esters, and cyanides pair with isocyanides, each pair sharing one molecular formula but belonging to entirely different chemical families.", "Configurational Isomer", "Alkyl halides are a notable exception, they do NOT show functional isomerism since there is no other common functional group sharing exactly their formula."],
            ["Metamerism", ["ISOM"], "Same Polyvalent Functional Group, Different Alkyl Groups", "CH_3{-}O{-}CH_2CH_2CH_3 \\ \\ vs \\ \\ CH_3CH_2{-}O{-}CH_2CH_3", "The functional group itself, ether, ketone, or amine, sits in the exact same spot, only the alkyl groups flanking it change size.", "2-Hexanone and 3-hexanone are metamers of each other since the carbonyl's two flanking alkyl groups have simply swapped size, they also happen to be position isomers at the same time.", "Configurational Isomer", "Only possible around a polyvalent functional group with two attachment points (ether -O-, ketone C=O, ester -COO-, amide -CONH-, amine -NH-, secondary amine -N<)."],
            ["Keto-Enol Tautomerism", ["ISOM"], "Dynamic Equilibrium via Wandering Alpha-Hydrogen", "CH_3{-}CO{-}CH_3 \\rightleftharpoons CH_3{-}C(OH){=}CH_2\\ (\\sim1\\%\\ enol)", "An alpha-hydrogen wanders from carbon over to the carbonyl oxygen, snapping a pi bond open in the process, that's tautomerism, not resonance.", "Unlike resonance structures, tautomers genuinely differ in atomic connectivity (the hydrogen's position actually moves), and the two forms sit in real, separable dynamic equilibrium rather than being an averaged hybrid.", "Tautomeric Isomer", "Requires at least one alpha-hydrogen on a carbonyl compound; phenol's enol form is stabilised to ~99% by aromaticity, the one major exception to keto being dominant."],
            ["Nitro - Aci-Nitro Tautomerism", ["ISOM"], "Acidic Aci-Form Explains NaOH Solubility", "R{-}CH_2{-}NO_2 \\rightleftharpoons R{-}CH{=}NO(OH)\\ (\\text{aci-nitro, acidic form})", "Nitro compounds with at least one alpha-hydrogen tautomerise into an acidic aci-form, which is exactly why they dissolve in aqueous NaOH.", "A tertiary nitro compound like (CH3)3C-NO2 has no alpha-hydrogen to lose, so it cannot tautomerise, and predictably it does not dissolve in NaOH, unlike its primary and secondary cousins.", "Tautomeric Isomer", "This solubility-in-NaOH test is a quick way to distinguish nitroalkanes bearing an alpha-H from those (like tertiary nitroalkanes) that lack one entirely."],
            ["Geometrical (cis-trans) Isomerism in Alkenes", ["ISOM"], "Restricted Rotation About C=C, Each sp2-C Needs 2 Different Groups", "cis\\text{-}CH_3CH{=}CHCH_3 \\ \\ vs \\ \\ trans\\text{-}CH_3CH{=}CHCH_3", "A pi bond can't rotate freely at room temperature, so if each double-bond carbon carries two different groups, two genuinely non-interconvertible isomers exist.", "Trans-2-butene is more stable and has a higher melting point (better crystal packing), while cis-2-butene is more soluble in water and has a higher boiling point (larger dipole moment).", "Geometrical Isomer", "Oximes (>C=N-OH) and azo compounds (-N=N-) show the same restricted-rotation geometrical isomerism; cycloalkanes show it too, but from restricted rotation about a ring single bond, not a double bond."],
            ["E-Z Nomenclature (CIP Priority Rules)", ["ISOM"], "Systematic Naming Beyond Simple cis/trans", "\\text{High-priority groups same side} \\Rightarrow Z\\ (Zusammen) \\ \\ ; \\ \\ \\text{opposite sides} \\Rightarrow E\\ (Entgegen)", "Rank each double-bond carbon's two substituents by atomic number first; if the two heavyweight groups land on the same side, call it Z, opposite sides, call it E.", "Cis and trans only work cleanly when the two 'same' groups are visually obvious; E/Z instead uses strict Cahn-Ingold-Prelog priority rules, so it never breaks down even on complex, unsymmetrically-substituted alkenes.", "Geometrical Isomer", "Priority is decided first by the atomic number of the directly-attached atom, then (if tied) by the next atom out; double and triple bonds are treated as duplicated single-bonded phantom atoms for ranking purposes."],
            ["Geometrical Isomerism in Oximes", ["ISOM"], "Syn/Anti Isomers About C=N-OH", "CH_3{-}CH{=}N{-}OH:\\ syn\\ (H, OH\\ same\\ side) \\ \\ vs \\ \\ anti\\ (H, OH\\ opposite\\ sides)", "Exactly the same restricted-rotation logic as an alkene's C=C, just swap one carbon for a nitrogen bearing a lone pair and an -OH.", "Acetaldoxime shows two distinct, isolable syn and anti forms because its sp2 carbon carries two genuinely different substituents (H and CH3).", "Geometrical Isomer", "Only oximes where the sp2 carbon bears two DIFFERENT groups show this isomerism; formaldoxime (H2C=N-OH) cannot, since both groups on carbon are identical hydrogens."],
            ["Geometrical Isomerism in Cycloalkanes", ["ISOM"], "Restricted Rotation About a Ring Single Bond", "1,2\\text{-Dimethylcyclopropane}: \\ cis\\ vs\\ trans", "A ring itself locks rotation in place just as effectively as a pi bond does, so substituents on ring carbons can still be cis or trans to each other.", "At least two different ring carbons must each carry two different substituents for the ring to show cis-trans isomerism at all, exactly mirroring the alkene rule.", "Geometrical Isomer", "This is a purely SIGMA-bond restriction (the ring skeleton itself prevents rotation), completely different in origin from the pi-bond restriction that causes alkene geometrical isomerism."],
            ["Optical Isomerism / Enantiomers", ["ISOM"], "Non-Superimposable Mirror Images", "C^*(H)(Br)(Cl)(I):\\ \\text{two forms are non-superimposable mirror images}", "Four different groups on one carbon means that carbon's mirror image can never be rotated to match the original, that carbon is chiral.", "The two forms rotate plane-polarised light by an equal angle but in opposite directions, one dextro (+) clockwise, one laevo (-) anticlockwise, while every other physical property stays identical.", "Optical Isomer", "A compound with n chiral centres has, at most, 2^n stereoisomers (Van't Hoff's rule); enantiomers react identically with achiral reagents but at different rates with other chiral reagents."],
            ["R-S Configuration (Cahn-Ingold-Prelog Rules)", ["ISOM"], "Absolute Configuration by Priority-Based Naming", "\\text{Lowest priority group away from viewer:}\\ \\text{clockwise } 1{\\to}2{\\to}3 = R,\\ \\ \\text{anticlockwise} = S", "Point the lowest-priority group straight away from you, like a steering wheel, then read the remaining three groups from highest to lowest priority: clockwise is R, anticlockwise is S.", "R and S describe the actual 3-D arrangement and have nothing to do with the direction a compound rotates light, R-(-)-lactic acid is a real example where R happens to be laevorotatory.", "Optical Isomer", "Priority is assigned by atomic number at the first point of difference; isotopes are ranked by atomic mass (D outranks H); double/triple bonds are duplicated exactly as in E/Z assignment."],
            ["Meso Compounds & Internal Compensation", ["ISOM"], "Optically Inactive Despite Multiple Chiral Centres", "\\text{meso-Tartaric Acid: plane of symmetry present} \\Rightarrow \\text{optically inactive}", "One half of the molecule's rotation is cancelled out by the exact opposite rotation from its own other half, no external mixing required.", "Meso-tartaric acid melts lower (140 degrees C) than the d- and l- forms (170 degrees C) and is also less dense, less soluble, and a weaker acid, proof it is a genuinely distinct substance.", "Optical Isomer", "Internal compensation (meso compound, cannot be resolved) is fundamentally different from external compensation (racemic mixture of + and - forms, which CAN be resolved)."],
            ["Diastereomers", ["ISOM"], "Stereoisomers That Are Not Mirror Images", "2,3\\text{-Dibromopentane}: \\ 4\\ \\text{stereoisomers} = 2\\ \\text{enantiomeric pairs (diastereomers of each other)}", "When a molecule has two chiral centres and no symmetry to force a meso form, you get two separate pairs of enantiomers, and each pair is a diastereomer of the other pair.", "Unlike enantiomers, diastereomers have genuinely different physical and chemical properties, since they are not mirror images of one another at all.", "Optical Isomer", "A compound with n distinct chiral centres and no internal symmetry has exactly 2^n stereoisomers, forming 2^(n-1) diastereomeric pairs of enantiomers."],
            ["Conformational Isomerism of Ethane", ["ISOM"], "Free Rotation About a Single Bond, Infinite Interconvertible Forms", "\\text{Eclipsed (0}^{\\circ}\\text{, least stable)} \\rightleftharpoons \\text{Staggered (60}^{\\circ}\\text{, most stable)}", "Spin the back carbon relative to the front one and the energy rises and falls smoothly, staggered is the valley, eclipsed is the peak.", "The barrier between staggered and eclipsed ethane is only about 12.5 kJ/mol, small enough that ordinary thermal energy at room temperature lets the molecule rotate freely, so individual conformers can never be isolated.", "Conformational Isomer", "Requires at least three continuous sigma bonds in a row to exist at all; unlike configurational isomers, conformers interconvert too rapidly to ever separate."],
            ["Conformational Isomerism of Butane", ["ISOM"], "Anti, Gauche, and Eclipsed Forms Ranked by Methyl-Methyl Strain", "\\text{Stability: Anti (180}^{\\circ}\\text{)} > \\text{Gauche (60}^{\\circ}\\text{)} > \\text{Eclipsed (0}^{\\circ}\\text{)} > \\text{Fully Eclipsed}", "Keep the two bulky methyl groups as far apart as possible (180 degrees, anti) for maximum stability; jam them right on top of each other (fully eclipsed) for minimum stability.", "The fully eclipsed form, where both methyls sit directly over each other, is the single least stable conformation of butane, roughly 19 kJ/mol higher in energy than the anti form.", "Conformational Isomer", "A full 360-degree rotation about the central C2-C3 bond passes through the sequence anti, gauche, eclipsed, fully-eclipsed, eclipsed, gauche, and back to anti."],
            ["Conformational Analysis of Cyclohexane", ["ISOM"], "Chair (Most Stable) vs Boat (Strained) Forms", "\\text{Chair (all staggered, strain-free)} \\ \\ vs \\ \\ \\text{Boat (eclipsed + flagpole strain)}", "The chair form has every single C-C bond perfectly staggered, zero strain, while the boat form eclipses bonds along its sides and crowds two 'flagpole' hydrogens together at the bow and stern.", "Ring-flipping between two chair forms converts every axial hydrogen into an equatorial one and vice versa, a rapid process with a half-life of only about 10^-5 seconds at room temperature.", "Conformational Isomer", "In methylcyclohexane, about 95% of molecules keep the bulky methyl group equatorial versus only about 5% axial, due to 1,3-diaxial repulsion with the axial hydrogens at C-3 and C-5."],
            ["Optical Activity Without a Chiral Carbon (Allenes & Biphenyls)", ["ISOM"], "Chirality from Molecular Shape, Not a Stereocentre", "abC{=}C{=}Cab\\ (a \\neq b): \\ \\text{perpendicular} \\ \\pi\\text{-planes} \\Rightarrow \\text{chiral molecule, no chiral carbon}", "An allene's two pi bonds sit in mutually perpendicular planes, so the two end-groups can never be coplanar, and the whole shape becomes chiral even though no single carbon has four different groups.", "Ortho-tetrasubstituted biphenyls show the same trick: restricted rotation about the central bond (atropisomerism) locks the two rings out of coplanarity, making the whole molecule chiral by shape alone.", "Optical Isomer", "Only allenes where BOTH terminal sp2 carbons carry two different substituents are chiral; symmetric allenes like CH2=C=CH2 are achiral despite having no chiral carbon either way."]
        ];

            const isAdv = item[0].includes("R-S") || item[0].includes("Meso") || item[0].includes("Diastereomers") || item[0].includes("Cyclohexane") || item[0].includes("Allenes") || item[0].includes("E-Z");
            addR(item[0], "Isomerism", isAdv, item[1], item[2], item[3], item[4], item[5], item[6], item[6], "Structural / Stereochemical Analysis", "Applies Across All Functional Group Chapters", item[7]);

        // ================= NEW: GENERAL ORGANIC CHEMISTRY / GOC (extracted from GENERAL_ORGANIC_CHEMISTRY.pdf) =================
        const gocExtra = [
            ["Heterolytic Fission (Ionic Cleavage)", ["CONCEPT"], "Unequal Electron Distribution on Bond Cleavage", "C{:}Z \\rightarrow C^+ + {:}Z^-\\ \\ (\\text{Ionic Cleavage})", "Both bonding electrons leave with the more electronegative partner, so charged ions form on either side of the broken bond.", "Heterolysis is favoured in polar solvents that can stabilise the resulting ions, and it's the fission that generates carbocations and carbanions as reaction intermediates.", "Concerted", "Occurs preferentially in polar, protic or highly ionising media where the developing charges can be solvated and stabilised."],
            ["Homolytic Fission (Free-Radical Cleavage)", ["CONCEPT"], "Equal Electron Distribution on Bond Cleavage", "C{:}Z \\rightarrow C^{\\bullet} + Z^{\\bullet}\\ \\ (\\text{Non-Ionic Cleavage})", "Each atom walks away with exactly one electron from the shared pair, no charges form, just two neutral species with an unpaired electron each.", "Homolysis is typically triggered by heat, light, or peroxide initiators, and is the fission pathway that generates free radicals as reaction intermediates.", "Free Radical", "Favoured in the gas phase or non-polar solvents, and characteristically initiated by UV light, heat, or radical initiators like peroxides."],
            ["Electrophiles (Classification)", ["CONCEPT"], "Electron-Loving, Electron-Deficient Attacking Species", "E^+\\ (\\text{e.g. } NO_2^+,\\ Br^+) \\ \\ \\text{or Neutral Lewis Acid}\\ (BF_3,\\ AlCl_3)", "Electrophiles are electron-poor, so they hunt for the electron-rich part of a substrate, exactly the opposite of what a nucleophile wants.", "Positively charged electrophiles like the nitronium ion sit alongside neutral electron-deficient Lewis acids like BF3 and AlCl3, and even free radicals, carbenes, and nitrenes can act electrophilically.", "Concerted", "Electrophiles accept an electron pair (Lewis acids) and possess an empty orbital ready to receive it, forming one new bond with a nucleophile."],
            ["Nucleophiles (Classification & Ambident Nucleophiles)", ["CONCEPT"], "Nucleus-Loving, Electron-Rich Attacking Species", "Nu^-\\ (\\text{e.g. } CN^-,\\ OH^-) \\ \\ \\text{or Lone-Pair Lewis Base}\\ (NH_3,\\ R_2O)", "Nucleophiles are electron-rich, so they hunt for the positively-charged or electron-poor part of a substrate.", "An ambident nucleophile like the cyanide ion or the nitrite ion has two different electron-rich sites available, and can end up attacking through either one, giving two possible products depending on conditions.", "Concerted", "Nucleophiles supply the electron pair and increase their own covalency by one unit when they bond; resonance-delocalised anions (like enolates) also count as ambident nucleophiles."],
            ["Inductive Effect (+I / -I)", ["CONCEPT"], "Permanent Polarisation Through Sigma Bonds", "C_3{-}C_2{-}C_1{-}Z\\ \\ (\\text{decreasing charge with distance from } Z)", "Electron density shifts continuously along a sigma-bonded chain toward (or away from) an electron-hungry (or electron-donating) group, weakening fast with every extra carbon.", "The effect is measured relative to hydrogen (defined as exactly zero) and is effectively neutralised after 3 or 4 carbons, since it falls off with distance.", "Concerted", "Order of -I strength: NR3+ > NO2 > CN > COOH > halogens > OH > OR > C6H5 > H; alkyl groups are +I donors, and their +I strength grows with size and branching."],
            ["Mesomeric (Resonance) Effect (+M / -M)", ["CONCEPT"], "Complete Electron Transfer Through a Conjugated System", "CH_2{=}CH{-}NO_2 \\leftrightarrow {}^+CH_2{-}CH{=}N(O^-)O^-", "Unlike the inductive effect's partial shift through sigma bonds, the mesomeric effect fully relocates pi or lone-pair electrons across a conjugated pi system.", "Groups with a lone pair or negative charge (like -OH, -NH2, halogens) donate density with +M; groups with a positive charge or vacant orbital (like -NO2, -CHO, -CN) withdraw density with -M.", "Concerted", "All resonance structures must share the same atomic positions, the same number of paired/unpaired electrons, and near-identical energy, resonance is a hybrid, not a rapid interconversion like tautomerism."],
            ["Hyperconjugation (No-Bond Resonance)", ["CONCEPT"], "Sigma(C-H) Electron Delocalisation into an Adjacent p-Orbital or Pi System", "H{-}CH_2{-}CH_2^+ \\leftrightarrow H^+\\ \\ CH_2{=}CH_2\\ \\ (\\text{no-bond resonance})", "A C-H sigma bond next to a positive charge, radical, or double bond can donate its electron density sideways, more available alpha-hydrogens means more hyperconjugating structures.", "This is exactly why tertiary carbocations (9 alpha-H) beat secondary (6 alpha-H) which beat primary (3 alpha-H) which beat methyl (zero alpha-H, no hyperconjugation possible) in stability.", "Concerted", "Effectiveness order among the three permanent effects is M > H > I; hyperconjugation also explains why more substituted alkenes are more stable, and why conjugated-system bond lengths sit between pure single and double bond values."],
            ["Electromeric Effect (+E / -E)", ["CONCEPT"], "Temporary Pi-Electron Shift Only in the Presence of an Attacking Reagent", "C{=}C + H^+ \\rightarrow C{-}C^+{-}H\\ \\ (+E\\ \\text{effect})", "This effect switches on only the instant an attacking reagent approaches, and switches back off the moment that reagent is removed, truly temporary, unlike the permanent inductive and mesomeric effects.", "In +E, both pi electrons move onto the atom the reagent bonds to; in -E, they move onto the atom the reagent does NOT bond to, exactly opposite bookkeeping.", "Concerted", "Only compounds with a multiple bond (double or triple) can show this effect, and only in the presence of an attacking electrophile or nucleophile."],
            ["Aromaticity - Huckel's Rule (4n+2 Rule)", ["CONCEPT"], "Cyclic, Planar, Fully Conjugated Systems with (4n+2) pi-Electrons", "\\text{Aromatic if: cyclic + planar + uninterrupted } \\pi\\text{ cloud + } (4n+2)\\ \\pi\\text{-electrons}", "Huckel's rule really just says an aromatic ring must have an ODD number of pairs of delocalised pi electrons, 1, 3, or 5 pairs, corresponding to 2, 6, or 10 electrons.", "Cyclopropenyl cation (2 pi electrons, one pair) is aromatic, but cyclopentadienyl cation and cycloheptatrienyl anion (both with an even number of pairs) are not, despite looking superficially similar.", "Concerted", "Cyclobutadiene and planar cyclooctatetraene fail Huckel's rule (even pairs of electrons); pyrrole, furan, and thiophene use an sp3 lone pair to complete their aromatic sextet, while pyridine's lone pair sits in an sp2 orbital and stays uninvolved."],
            ["Carbocation - Formation & Stability", ["CONCEPT"], "sp2, Planar, Electron-Deficient Trivalent Carbon Cation", "R{-}X \\xrightarrow{\\text{ionising conditions}} R^+ + X^-", "Three groups around a flat, sp2-hybridised carbon leave an empty p-orbital above and below the plane, ready to be filled by any nearby electron donor.", "Stability rises with more hyperconjugating alpha-hydrogens and stronger +I/+M donors, so 3 degree beats 2 degree beats 1 degree beats methyl, and benzylic/allylic cations beat all simple alkyl cations.", "Carbocation", "Formed by direct ionisation, protonation of an alkene or carbonyl, electrophilic attack on an alkyl/acyl halide, diazonium decomposition, or superacid protonation of an alkane; prone to 1,2-hydride or alkyl shifts toward a more stable cation."],
            ["Carbanion - Formation & Stability", ["CONCEPT"], "sp3 (Pyramidal) or sp2 (Planar) Electron-Rich Trivalent Carbon Anion", "R{-}H \\xrightarrow{\\text{strong base}} R^- + BH", "The exact opposite stability trend to a carbocation, more -I/-M electron-withdrawing groups nearby make a carbanion happier, since they help disperse its extra negative charge.", "A carbanion alpha to a carbonyl group is stabilised enormously by resonance delocalisation into the C=O, exactly the reactive species behind aldol, Claisen, and Perkin condensations.", "Carbanion", "Generated by base removing an acidic C-H, decarboxylation of a carboxylate, or forming an organometallic reagent (Grignard, organolithium); stabilised by -I effect, -M effect, charge delocalisation, and aromatisation."],
            ["Free Radical - Formation & Stability", ["CONCEPT"], "Neutral Species with an Unpaired Electron", "R{-}X \\xrightarrow{h\\nu\\ or\\ \\Delta} R^{\\bullet} + X^{\\bullet}", "No charge at all here, just a lone unpaired electron sitting on an otherwise neutral carbon, and just like carbocations, more hyperconjugating alpha-hydrogens mean more stability.", "Free radicals combine (coupling), disproportionate, abstract hydrogen from another molecule, add across a double bond, or chain-propagate a polymerisation, the exact reactivity pattern behind radical halogenation and addition polymerisation alike.", "Free Radical", "Stability order mirrors carbocations exactly (3 degree > 2 degree > 1 degree > methyl) due to hyperconjugation, plus extra resonance stabilisation for allylic and benzylic radicals."],
            ["Carbene - Singlet vs Triplet", ["CONCEPT"], "Neutral Divalent Carbon with Two Non-Bonded Electrons", "CH_2N_2 \\xrightarrow{h\\nu\\ or\\ \\Delta} {:}CH_2 + N_2", "Singlet carbene pairs both its extra electrons in one sp2 orbital with opposite spins; triplet carbene spreads them into two separate p-orbitals with parallel spins.", "Singlet carbene (the excited, bent form) reacts as a strong electrophile with clean, stereospecific syn addition, while triplet carbene (the ground-state, near-linear form) reacts more like a diradical, in two separate steps.", "Concerted", "Generated from diazomethane, ketene, or base-mediated alpha-elimination of chloroform (via dichlorocarbene); triplet carbene is paramagnetic while singlet carbene is diamagnetic."],
            ["Benzyne - Structure & Generation", ["CONCEPT"], "Strained Aryne with an Extra Weak Pi Bond in the Ring Plane", "C_6H_5Cl \\xrightarrow{NaNH_2,\\ liq.\\ NH_3,\\ -NH_3} \\text{Benzyne}", "A very strong base rips off a proton ortho to the halide, and the resulting carbanion kicks out the halide right next to it, opening up a second, highly strained pi bond in the plane of the ring.", "Because this extra bond forms from sideways, poor overlap of in-plane sp2 orbitals, benzyne is extremely reactive and can never be isolated, only trapped by whatever nucleophile is nearby.", "Concerted", "The classic isotope-labelling experiment (chlorobenzene labelled at C1 gives a near-50:50 mix of aniline labelled at C1 and C2) is the definitive proof that the benzyne intermediate is symmetric."],
            ["Nitrene - Structure & Generation", ["CONCEPT"], "Electron-Deficient Monovalent Nitrogen with a Sextet", "R{-}N_3 \\xrightarrow{h\\nu\\ or\\ \\Delta,\\ -N_2} R{-}N{:}\\ (\\text{Nitrene})", "Nitrenes are the nitrogen analogue of carbenes, same electron-deficient, insertion-loving reactivity, just one atom over on the periodic table.", "Nitrene is the common thread running through the Hofmann bromamide, Curtius, Schmidt, and Lossen rearrangements, all four generate a nitrene (or its rearranged isocyanate) en route to a primary amine one carbon shorter.", "Nitrene", "Generated from acyl/alkyl azides (thermolysis or photolysis) or from isocyanate photolysis; readily inserts into C-H bonds and adds across alkene double bonds, just like a carbene does."],
            ["SN1 Reaction Mechanism", ["RXN"], "Unimolecular Nucleophilic Substitution via Carbocation", "R{-}X \\xrightarrow{slow} R^+ + X^- \\ \\ \\xrightarrow{Nu^-,\\ fast} R{-}Nu", "Rate depends on only ONE species, the substrate ionising, so the nucleophile's concentration and identity don't even enter the rate law.", "Because the flat carbocation intermediate can be attacked from either face, a single optically pure enantiomeric substrate gives a racemised (or largely racemised) product, inversion competing with retention.", "Carbocation", "Reactivity order 3 degree > 2 degree > 1 degree (governed by carbocation stability); favoured by polar protic solvents and good ionising leaving groups; prone to rearrangement via hydride/alkyl shifts."],
            ["SN2 Reaction Mechanism", ["RXN"], "Bimolecular Nucleophilic Substitution, Single Concerted Step", "Nu^- + R{-}X \\rightarrow [Nu\\cdots R\\cdots X]^{\\ddagger} \\rightarrow Nu{-}R + X^-", "The nucleophile attacks from directly behind the leaving group, backside attack, in one single step with no intermediate at all, like an umbrella flipping inside-out in the wind.", "This backside attack means every single SN2 reaction proceeds with 100% inversion of configuration at the reacting carbon, the classic Walden inversion.", "Concerted", "Reactivity order methyl > 1 degree > 2 degree > 3 degree, governed purely by steric hindrance to backside attack; rate depends on BOTH substrate and nucleophile concentration; sped up by polar aprotic solvents like DMF/DMSO."],
            ["E1 Elimination Reaction", ["RXN"], "Unimolecular Elimination via the Same Carbocation as SN1", "R_2CH{-}CR_2{-}X \\xrightarrow{slow} R_2CH{-}CR_2^+ \\xrightarrow{-H^+,\\ fast} R_2C{=}CR_2", "Exactly the same slow, rate-determining ionisation step as SN1, the only difference is what happens next, losing a proton to form an alkene instead of capturing a nucleophile.", "Since E1 and SN1 share the identical carbocation intermediate, they are always in direct competition with each other, and typically give a mixture of substitution and elimination products from the same substrate.", "Carbocation", "Follows the Saytzeff rule (more substituted, more stable alkene predominates); favoured by weak bases, polar protic solvents, and higher temperature (which favours elimination over substitution)."],
            ["E2 Elimination Reaction", ["RXN"], "Bimolecular, Single-Step, Anti-Periplanar Elimination", "Base + H{-}C{-}C{-}X \\rightarrow \\text{Alkene} + Base{-}H + X^-", "A strong base rips off a beta-hydrogen at the exact same instant the leaving group departs from the neighbouring carbon, one single concerted step, no intermediate.", "Rate depends on BOTH the alkyl halide's and the base's concentration together, and the reaction strongly prefers an anti-periplanar geometry between the departing H and the leaving group.", "Concerted", "With a bulky base or a positively-charged leaving group (like -NR3+), the Hofmann rule takes over instead, favouring the LESS substituted alkene."],
            ["Saytzeff's Rule - Orientation in Elimination", ["CONCEPT"], "More Substituted (More Stable) Alkene Predominates", "R_2CHCH_2{-}X \\xrightarrow{Saytzeff} \\text{More substituted alkene (major)}", "When a neutral leaving group (like -X or -OTs) gives a choice of directions, elimination favours whichever alkene ends up with the most alkyl groups hanging off the double bond.", "This rule governs most E1 reactions and the majority of E2 reactions, and its preference tracks directly with alkene stability, R2C=CR2 beats RCH=CR2 beats RCH=CHR beats RCH=CH2 beats CH2=CH2.", "Concerted", "The rule can be rationalised through hyperconjugation, the more substituted alkene simply has more stabilising alpha-hydrogens available on its double-bond carbons."],
            ["Hofmann's Rule - Orientation in Elimination", ["CONCEPT"], "Less Substituted Alkene Predominates with Bulky/Charged Leaving Groups", "R{-}CH_2{-}CH_2{-}\\overset{+}{N}R_3\\ OH^- \\xrightarrow{\\Delta} \\text{Less substituted alkene (major)}", "A bulky, positively-charged leaving group (like -NR3+) forces the base to grab whichever beta-hydrogen is easiest to reach, usually the LEAST hindered, least substituted side.", "This is exactly why exhaustive methylation followed by Hofmann elimination was the classical method chemists once used to determine the structure of unknown amines.", "Concerted", "Applies specifically with positively-charged (-NR3+, -SR2+) or fluoride leaving groups, since the more acidic beta-hydrogen (on the less hindered side) is what actually gets removed."],
            ["Resonance Energy & Aromatic Stability", ["CONCEPT"], "Experimental vs Calculated Heat of Hydrogenation Gap", "\\text{R.E.} = \\text{(Calculated }\\Delta H\\text{)} - \\text{(Experimental }\\Delta H\\text{)}", "Resonance energy is simply how much MORE stable the real, delocalised molecule is than a hypothetical Kekule structure with three isolated double bonds would be.", "Benzene's resonance energy (36 kcal/mol) is the standard reference point, and it climbs steadily through naphthalene (76 kcal/mol) to anthracene (85 kcal/mol) as more rings extend the conjugated pi system.", "Concerted", "Benzene's calculated heat of hydrogenation (3 x 28.6 = 85.8 kcal/mol) far exceeds its actual experimental value (49.8 kcal/mol), and that 36 kcal/mol gap IS the resonance energy."],
            ["Electrophilic Aromatic Substitution - General Mechanism", ["RXN"], "Arenium Ion (Sigma Complex) Intermediate", "C_6H_6 + E^+ \\rightarrow [\\text{Arenium ion}]^+ \\xrightarrow{-H^+} C_6H_5E", "Benzene's electron-rich pi cloud attacks the electrophile first, temporarily breaking aromaticity to form a resonance-stabilised, non-aromatic arenium cation, which then loses a proton to restore the aromatic ring.", "Nitration (NO2+), sulphonation (SO3), Friedel-Crafts alkylation (R+), and Friedel-Crafts acylation (RCO+) all funnel through this exact same arenium-ion mechanism.", "Carbocation", "Loss of the proton (rather than recapture by the counter-anion) is essential for restoring aromaticity and driving the reaction to completion, this final deprotonation is what makes it SUBSTITUTION rather than addition."],
            ["Amphiphile / Ambident Species (Nucleophile-Electrophile Duality)", ["CONCEPT"], "A Single Functional Group That Can Act as Either", "R_2C{=}O:\\ \\text{carbon is electrophilic, oxygen's lone pairs are nucleophilic}", "A carbonyl carbon happily accepts a nucleophile's attack while, at the very same time, its own oxygen lone pairs are ready to donate to an electrophile, one functional group, two completely opposite roles.", "A nitrile group (-C=N) shows this exact same duality, the carbon is electrophilic (attacked by Grignards and cyanide) while the nitrogen lone pair is nucleophilic.", "Concerted", "Not to be confused with an ambident NUCLEOPHILE (one species, two possible attacking atoms, like cyanide); an amphiphile is one species that can play EITHER role depending on what it's reacting with."]
        ];

        gocExtra.forEach(item => {
            const isAdv = item[1].includes("RXN") || item[0].includes("Benzyne") || item[0].includes("Nitrene") || item[0].includes("Aromaticity") || item[0].includes("Carbene") || item[0].includes("Ambident") || item[0].includes("Hofmann's Rule") || item[0].includes("Amphiphile");
            addR(item[0], "General Organic Chemistry (GOC)", isAdv, item[1], item[2], item[3], item[4], item[5], item[6] + " Intermediate", item[6], "Mechanistic Fundamentals", "Foundation for Every Functional Group Chapter", item[7]);
        });


        // ---- INIT ----
        window.addEventListener('load', function () {
            reactionsData.forEach(r => {
                reactionsById[r.id] = r;
                (reactionsByChapter[r.group] = reactionsByChapter[r.group] || []).push(r);
            });

            document.getElementById('searchInput').addEventListener('input', debouncedApplyFilters);
            document.getElementById('tagFilter').addEventListener('change', applyFilters);
            document.getElementById('levelFilter').addEventListener('change', applyFilters);

            applyFilters(); // builds allItems + does the first render
        });

        // PERFORMANCE + ANIMATION LAYER
        // ---------------------------------------------------------------

        // SPEECH SYNTHESIS GLOBAL STATE
        let currentlySpeakingId = null;
        let cachedVoices = [];

        function loadVoices() {
            try {
                if (window.speechSynthesis && typeof window.speechSynthesis.getVoices === 'function') {
                    cachedVoices = window.speechSynthesis.getVoices() || [];
                }
            } catch (e) {
                cachedVoices = [];
            }
        }
        // Wrapped in try/catch and deferred so a browser with partial/quirky
        // speechSynthesis support can never break page load or filtering.
        try {
            if ('speechSynthesis' in window && window.speechSynthesis) {
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }
        } catch (e) { /* Text-to-speech simply won't get a preferred voice; rest of the page still works. */ }

        // Picks the best-sounding available English voice instead of
        // whatever robotic default the browser falls back to.
        function pickBestVoice() {
            if (!cachedVoices.length) return null;

            const englishVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            const pool = englishVoices.length ? englishVoices : cachedVoices;

            // Preference order: known high-quality natural/neural voices first,
            // then anything explicitly labelled "natural"/"neural"/"premium",
            // then Google's voices (solid quality on Chrome/Android),
            // then any local (non-network) voice, then just the first available.
            const namedPreferences = [
                "Microsoft Aria Online (Natural)", "Microsoft Jenny Online (Natural)",
                "Microsoft Guy Online (Natural)", "Google US English", "Google UK English Female",
                "Samantha", "Karen", "Daniel", "Moira"
            ];
            for (const name of namedPreferences) {
                const match = pool.find(v => v.name === name);
                if (match) return match;
            }

            const qualityMatch = pool.find(v => /natural|neural|premium/i.test(v.name));
            if (qualityMatch) return qualityMatch;

            const googleMatch = pool.find(v => /google/i.test(v.name));
            if (googleMatch) return googleMatch;

            const localMatch = pool.find(v => v.localService);
            if (localMatch) return localMatch;

            return pool[0];
        }

        function speakStory(id, name, mnemonic, story) {
            if (!('speechSynthesis' in window)) {
                alert("Text-to-Speech is not supported in your current browser.");
                return;
            }

            if (currentlySpeakingId === id && window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                currentlySpeakingId = null;
                updateAudioButtons();
                return;
            }

            window.speechSynthesis.cancel();

            const textToRead = `${name}. Memory Trick: ${mnemonic}. Visual Story: ${story}`;
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.rate = 0.95;
            utterance.pitch = 1.0;

            const bestVoice = pickBestVoice();
            if (bestVoice) utterance.voice = bestVoice;

            utterance.onstart = () => {
                currentlySpeakingId = id;
                updateAudioButtons();
            };

            utterance.onend = () => {
                currentlySpeakingId = null;
                updateAudioButtons();
            };

            utterance.onerror = () => {
                currentlySpeakingId = null;
                updateAudioButtons();
            };

            window.speechSynthesis.speak(utterance);
        }


        function updateAudioButtons() {
            reactionsData.forEach(r => {
                const btn = document.getElementById(`audio-btn-${r.id}`);
                if (btn) {
                    if (currentlySpeakingId === r.id) {
                        btn.innerHTML = `<i class="fa-solid fa-square text-red-500"></i> Stop Audio`;
                        btn.classList.add("bg-red-50", "border-red-200", "text-red-700", "speaking");
                    } else {
                        btn.innerHTML = `<i class="fa-solid fa-volume-high text-amber-600"></i> Read Aloud`;
                        btn.classList.remove("bg-red-50", "border-red-200", "text-red-700", "speaking");
                    }
                }
            });
        }


    </script>
